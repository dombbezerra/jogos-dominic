<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#1a1a2e">
  <title>Luta Elemental</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      height: 100%;
      overscroll-behavior: none;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      margin: 0;
      background: #1a1a2e;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 8px;
      padding-top: max(8px, env(safe-area-inset-top));
      padding-bottom: max(8px, env(safe-area-inset-bottom));
      gap: 6px;
      min-height: 100vh;
      overflow: hidden;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }
    #back-link {
      position: fixed;
      top: calc(env(safe-area-inset-top) + 8px);
      left: calc(env(safe-area-inset-left) + 8px);
      background: rgba(255, 204, 0, 0.9);
      color: #1a1a2e;
      border: none;
      padding: 6px 12px;
      font-size: 13px;
      font-weight: bold;
      text-decoration: none;
      border-radius: 6px;
      z-index: 20;
    }
    /* esconde linha de instruções desktop em telas touch */
    @media (hover: none) and (pointer: coarse) {
      #instrucoes { display: none; }
      h1 { font-size: clamp(15px, 4vw, 22px); }
    }
    h1 {
      margin: 0;
      color: #ffcc00;
      font-size: clamp(18px, 3.5vw, 30px);
      text-align: center;
      line-height: 1;
    }
    #instrucoes {
      font-size: clamp(10px, 1.6vw, 14px);
      opacity: 0.8;
      text-align: center;
      line-height: 1.3;
    }
    #area-jogo {
      position: relative;
      width: 100%;
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    canvas {
      background: #0f0f1e;
      border: 3px solid #ffcc00;
      border-radius: 8px;
      cursor: crosshair;
      max-width: 100%;
      max-height: 100%;
      touch-action: none;
    }
    #botao-pausa {
      position: absolute;
      top: 10px;
      right: 10px;
      width: clamp(36px, 5vw, 50px);
      height: clamp(36px, 5vw, 50px);
      background: rgba(255, 204, 0, 0.85);
      color: #1a1a2e;
      border: none;
      border-radius: 50%;
      font-size: clamp(16px, 2.5vw, 22px);
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
      transition: transform 0.1s;
    }
    #botao-pausa:hover { transform: scale(1.1); }
    #placar {
      font-size: clamp(13px, 2vw, 18px);
      text-align: center;
      line-height: 1.2;
    }
  </style>
</head>
<body>
  <a href="../index.html" id="back-link">← Menu</a>
  <h1>LUTA ELEMENTAL</h1>
  <div id="instrucoes">
    Mover: <b>W A S D</b> &nbsp;|&nbsp; Mirar: <b>mouse</b> &nbsp;|&nbsp; Atirar: <b>segurar clique</b> &nbsp;|&nbsp; Super: <b>Q</b> &nbsp;|&nbsp; Pausar: <b>P</b>
  </div>
  <div id="area-jogo">
    <canvas id="tela" width="800" height="600"></canvas>
    <button id="botao-pausa" title="Pausar (P)">⏸</button>
  </div>
  <div id="placar">Clique em JOGAR pra começar</div>
  <script src="game.js"></script>
</body>
</html>
