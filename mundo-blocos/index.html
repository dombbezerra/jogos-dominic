<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#2b1d12">
  <title>Mundo de Blocos</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: #87ceeb; color: #fff;
      font-family: 'Courier New', monospace;
      -webkit-user-select: none; user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: none; overscroll-behavior: none;
    }
    canvas { display: block; }

    #back-link {
      position: fixed;
      top: calc(env(safe-area-inset-top) + 8px);
      left: calc(env(safe-area-inset-left) + 8px);
      background: rgba(0,0,0,.55); color: #fff;
      border: 2px solid #000;
      padding: 6px 12px; font-size: 13px; font-weight: bold;
      text-decoration: none; z-index: 100;
    }

    /* ── Telas (título, mundos, criar, pausa) ─────────────── */
    .screen {
      position: fixed; inset: 0; z-index: 60;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 12px; padding: 56px 16px 20px;
      text-align: center; overflow-y: auto;
    }
    .screen.hidden { display: none; }
    .screen.dirt {
      background-color: #3b2a1e;
      background-image: var(--dirt);
      background-size: 64px 64px;
      image-rendering: pixelated;
    }
    #scr-pause { background: rgba(0, 0, 0, .55); }
    .screen h1 {
      font-size: clamp(34px, 8vw, 72px);
      font-weight: 900; letter-spacing: 4px;
      color: #e8e8e8;
      text-shadow: 4px 4px 0 #3a3a3a, 8px 8px 0 rgba(0,0,0,.35);
    }
    .screen h2 { font-size: 22px; text-shadow: 2px 2px 0 #222; margin-bottom: 4px; }
    .splash {
      color: #ffeb3b; font-weight: bold; font-size: 16px;
      text-shadow: 2px 2px 0 #3f3a00;
      transform: rotate(-12deg) translate(110px, -18px);
      animation: pulse .6s ease-in-out infinite alternate;
    }
    @keyframes pulse { to { transform: rotate(-12deg) translate(110px, -18px) scale(1.08); } }
    .row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
    .row .btn { width: min(220px, 44vw); }
    .btn {
      width: min(320px, 90vw);
      padding: 14px 0;
      font: bold 18px 'Courier New', monospace; letter-spacing: 1px;
      color: #fff; cursor: pointer;
      background: linear-gradient(#8a8a8a, #6a6a6a);
      border: 3px solid #1a1a1a;
      box-shadow: inset 2px 2px 0 #aaa, inset -2px -2px 0 #444;
      text-shadow: 2px 2px 0 #333;
    }
    .btn:hover:not(:disabled) { background: linear-gradient(#7d93c9, #5a70a8); }
    .btn:disabled { opacity: .45; cursor: default; }
    .btn.small { font-size: 14px; padding: 10px 0; }
    .controls {
      margin-top: 10px; font-size: 13px; line-height: 1.7;
      opacity: .85; max-width: 480px;
    }
    .controls b { color: #ffd84a; }

    #world-list {
      width: min(460px, 100%); max-height: 46vh; overflow-y: auto;
      background: rgba(0,0,0,.5); border: 2px solid #000; padding: 6px;
      display: flex; flex-direction: column; gap: 6px; text-align: left;
    }
    .world {
      padding: 8px 10px; border: 2px solid transparent; cursor: pointer;
      display: flex; flex-direction: column; gap: 2px;
    }
    .world:hover { background: rgba(255,255,255,.08); }
    .world.sel { border-color: #fff; background: rgba(255,255,255,.12); }
    .world b { font-size: 16px; }
    .world span { font-size: 12px; opacity: .7; }
    .world-list .empty, #world-list .empty { padding: 20px; text-align: center; opacity: .8; }

    .field { display: flex; flex-direction: column; gap: 4px; width: min(320px, 90vw); text-align: left; font-size: 13px; }
    .field input {
      font: 16px 'Courier New', monospace; color: #fff;
      background: #000; border: 2px solid #a0a0a0; padding: 8px;
      -webkit-user-select: text; user-select: text;
    }
    #c-desc { font-size: 13px; opacity: .8; max-width: 340px; min-height: 2.6em; }
    .opts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; width: min(460px, 100%); }
    .opts .btn { width: 100%; }
    .bar { width: min(320px, 80vw); height: 10px; background: #333; border: 2px solid #000; }
    #load-bar { height: 100%; width: 0; background: #7ccf4a; }

    #underwater {
      position: fixed; inset: 0; pointer-events: none; z-index: 5;
      background: rgba(20, 60, 170, .35); display: none;
    }
    body.underwater #underwater { display: block; }
    body:not(.ingame) #hotbar, body:not(.ingame) #info, body:not(.ingame) #toast { display: none; }

    /* ── HUD ──────────────────────────────────────────────── */
    #crosshair {
      position: fixed; left: 50%; top: 50%;
      width: 22px; height: 22px; margin: -11px 0 0 -11px;
      pointer-events: none; z-index: 10; mix-blend-mode: difference;
    }
    body.mouse #crosshair { display: none; }
    body.mouse.playing canvas { cursor: crosshair; }
    #crosshair::before, #crosshair::after {
      content: ''; position: absolute; background: #fff;
    }
    #crosshair::before { left: 10px; top: 0; width: 2px; height: 22px; }
    #crosshair::after  { top: 10px; left: 0; height: 2px; width: 22px; }

    #hotbar {
      position: fixed; left: 50%; transform: translateX(-50%);
      bottom: calc(env(safe-area-inset-bottom) + 10px);
      display: flex; gap: 2px; z-index: 20;
      background: rgba(0,0,0,.45); border: 3px solid #222; padding: 3px;
    }
    .slot {
      width: min(44px, calc((100vw - 44px) / 10));
      height: min(44px, calc((100vw - 44px) / 10)); position: relative;
      border: 3px solid #555; background: rgba(140,140,140,.35);
      cursor: pointer;
    }
    .slot.sel { border-color: #fff; box-shadow: 0 0 0 2px #000; }
    .slot.bag {
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; background: rgba(90,60,30,.7); border-color: #c9a46a;
    }
    .slot.bag:hover { background: rgba(130,90,40,.85); }
    .slot canvas { width: 100%; height: 100%; image-rendering: pixelated; }
    .slot span {
      position: absolute; right: 2px; bottom: 0;
      font-size: 10px; text-shadow: 1px 1px 0 #000;
    }
    #toast {
      position: fixed; left: 50%; transform: translateX(-50%);
      bottom: calc(env(safe-area-inset-bottom) + 76px);
      font-size: 16px; font-weight: bold; text-shadow: 2px 2px 0 #000;
      opacity: 0; transition: opacity .4s; z-index: 20; pointer-events: none;
    }
    #toast.show { opacity: 1; transition: none; }
    #info {
      position: fixed; right: 8px;
      top: calc(env(safe-area-inset-top) + 8px);
      font-size: 12px; text-shadow: 1px 1px 0 #000; z-index: 20;
      text-align: right; line-height: 1.5;
    }

    /* ── Inventário ───────────────────────────────────────── */
    #inv {
      position: fixed; inset: 0; z-index: 50;
      display: flex; align-items: center; justify-content: center;
      background: rgba(0,0,0,.45); padding: 12px;
    }
    #inv.hidden { display: none; }
    .inv-box {
      width: min(560px, 100%); max-height: calc(100vh - 110px); overflow: auto;
      background: #c6c6c6; color: #3a3a3a;
      border: 3px solid #1a1a1a;
      box-shadow: inset 3px 3px 0 #fff, inset -3px -3px 0 #555;
      padding: 12px;
    }
    .inv-head { display: flex; gap: 6px; align-items: flex-start; margin-bottom: 10px; }
    #inv-tabs { display: flex; flex-wrap: wrap; gap: 4px; flex: 1; }
    #inv-tabs button, #inv-close, #inv-clear {
      font: bold 13px 'Courier New', monospace; cursor: pointer;
      padding: 8px 10px; background: #8b8b8b; color: #fff;
      border: 2px solid #1a1a1a; text-shadow: 1px 1px 0 #333;
    }
    #inv-tabs button.on { background: #5a70a8; }
    #inv-close { padding: 8px 12px; }
    .inv-body { display: flex; gap: 12px; }
    #inv-armor { display: flex; flex-direction: column; align-items: center; gap: 6px; }
    #preview {
      width: 96px; height: 96px; image-rendering: pixelated;
      background: #8b8b8b; border: 2px solid #555;
    }
    #armor-slots { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
    .aslot {
      width: 44px; height: 44px; background: #8b8b8b; border: 2px solid #555;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; cursor: pointer; opacity: .9;
    }
    .aslot canvas { width: 100%; height: 100%; image-rendering: pixelated; }
    #inv-grid {
      flex: 1; display: grid; gap: 4px;
      grid-template-columns: repeat(auto-fill, minmax(44px, 1fr));
      align-content: start;
    }
    .item {
      aspect-ratio: 1; padding: 4px; cursor: pointer;
      background: #8b8b8b; border: 2px solid #555;
    }
    .item:hover { background: #a8b8e0; border-color: #fff; }
    .item.on { background: #7ccf4a; border-color: #fff; }
    .item canvas { width: 100%; height: 100%; image-rendering: pixelated; display: block; }
    .inv-foot {
      display: flex; justify-content: space-between; align-items: center;
      gap: 8px; margin-top: 10px; font-size: 13px; font-weight: bold;
    }

    /* ── Touch ────────────────────────────────────────────── */
    #touch { display: none; position: fixed; inset: 0; z-index: 15; }
    body.touch.playing #touch { display: block; }
    #joy {
      position: absolute;
      left: calc(env(safe-area-inset-left) + 24px);
      bottom: calc(env(safe-area-inset-bottom) + 70px);
      width: 120px; height: 120px; border-radius: 50%;
      background: rgba(255,255,255,.15); border: 2px solid rgba(255,255,255,.4);
    }
    #knob {
      position: absolute; left: 35px; top: 35px;
      width: 50px; height: 50px; border-radius: 50%;
      background: rgba(255,255,255,.5);
    }
    .tbtn {
      position: absolute; width: 64px; height: 64px; border-radius: 50%;
      background: rgba(0,0,0,.35); border: 2px solid rgba(255,255,255,.5);
      font-size: 26px; display: flex; align-items: center; justify-content: center;
    }
    .tbtn.on { background: rgba(255,216,74,.5); }
    #b-jump  { right: calc(env(safe-area-inset-right) + 24px);  bottom: calc(env(safe-area-inset-bottom) + 80px); }
    #b-break { right: calc(env(safe-area-inset-right) + 100px); bottom: calc(env(safe-area-inset-bottom) + 130px); }
    #b-place { right: calc(env(safe-area-inset-right) + 24px);  bottom: calc(env(safe-area-inset-bottom) + 160px); }
    #b-fly   { right: calc(env(safe-area-inset-right) + 12px);  top: calc(env(safe-area-inset-top) + 50px); width: 52px; height: 52px; font-size: 20px; }
    #b-cam   { right: calc(env(safe-area-inset-right) + 132px); top: calc(env(safe-area-inset-top) + 50px); width: 52px; height: 52px; font-size: 20px; }
    #b-pause { right: calc(env(safe-area-inset-right) + 72px);  top: calc(env(safe-area-inset-top) + 50px); width: 52px; height: 52px; font-size: 20px; }
  </style>
</head>
<body>
  <a href="../index.html" id="back-link">← MENU</a>

  <div id="scr-title" class="screen dirt">
    <h1>MUNDO DE BLOCOS</h1>
    <div class="splash">Agora com cavernas!</div>
    <button class="btn" id="t-play">Um jogador</button>
    <div class="controls"></div>
  </div>

  <div id="scr-worlds" class="screen dirt hidden">
    <h2>Escolha o mundo</h2>
    <div id="world-list"></div>
    <div class="row">
      <button class="btn" id="w-play">Jogar</button>
      <button class="btn" id="w-new">Criar novo mundo</button>
    </div>
    <div class="row">
      <button class="btn small" id="w-delete">Apagar</button>
      <button class="btn small" id="w-back">Voltar</button>
    </div>
  </div>

  <div id="scr-create" class="screen dirt hidden">
    <h2>Criar novo mundo</h2>
    <label class="field">Nome do mundo
      <input id="c-name" maxlength="32" autocomplete="off">
    </label>
    <button class="btn" id="c-type">Tipo de mundo: Normal</button>
    <div id="c-desc"></div>
    <div class="opts">
      <button class="btn small" data-opt="caves"></button>
      <button class="btn small" data-opt="water"></button>
      <button class="btn small" data-opt="animals"></button>
      <button class="btn small" data-opt="daynight"></button>
      <button class="btn small" data-opt="infinite"></button>
    </div>
    <label class="field">Semente (deixe vazio pra sortear)
      <input id="c-seed" maxlength="20" autocomplete="off">
    </label>
    <div class="row">
      <button class="btn" id="c-create">Criar mundo</button>
      <button class="btn" id="c-cancel">Cancelar</button>
    </div>
  </div>

  <div id="scr-loading" class="screen dirt hidden">
    <h2>Gerando o mundo...</h2>
    <div class="bar"><div id="load-bar"></div></div>
  </div>

  <div id="scr-pause" class="screen hidden">
    <h2>Jogo pausado</h2>
    <button class="btn" id="p-resume">Voltar ao jogo</button>
    <button class="btn" id="p-quit">Salvar e sair</button>
    <div class="controls"></div>
  </div>

  <div id="underwater"></div>

  <div id="crosshair"></div>
  <div id="info"></div>
  <div id="toast"></div>
  <div id="hotbar"></div>

  <div id="inv" class="hidden">
    <div class="inv-box">
      <div class="inv-head">
        <div id="inv-tabs"></div>
        <button id="inv-close">✕</button>
      </div>
      <div class="inv-body">
        <div id="inv-armor">
          <canvas id="preview" width="32" height="32"></canvas>
          <div id="armor-slots"></div>
        </div>
        <div id="inv-grid"></div>
      </div>
      <div class="inv-foot">
        <span id="inv-name"></span>
        <button id="inv-clear">Limpar barra</button>
      </div>
    </div>
  </div>

  <div id="touch">
    <div id="joy"><div id="knob"></div></div>
    <div class="tbtn" id="b-jump">⬆</div>
    <div class="tbtn" id="b-break">⛏</div>
    <div class="tbtn" id="b-place">🧱</div>
    <div class="tbtn" id="b-fly">🕊</div>
    <div class="tbtn" id="b-cam">👁</div>
    <div class="tbtn" id="b-pause">⏸</div>
  </div>

  <script src="three.min.js"></script>
  <script src="game.js?v=10"></script>
</body>
</html>
