<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1a8a3a">
<title>Cobrinha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root { --tinta: #0e0c33; --creme: #fff6dc; --sol: #ffd23f; --rosa: #ff5d8f; --verde: #2fd15a;
    --display: 'Bungee', 'Arial Black', Impact, sans-serif; --texto: 'Baloo 2', 'Segoe UI', Arial, sans-serif; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: #0b2414; color: var(--creme); font-family: var(--texto); -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; touch-action: none; }
  #back-link { position: fixed; top: calc(env(safe-area-inset-top) + 10px); left: 10px; z-index: 30; text-decoration: none; font-weight: 800; background: var(--sol); color: var(--tinta); border: 3px solid var(--tinta); border-radius: 12px; padding: 4px 12px 2px; box-shadow: 0 4px 0 var(--tinta); }
  .tela { position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 60px 16px 20px; text-align: center; overflow-y: auto; background: radial-gradient(circle at 50% 30%, #2e9e4f, #0b2414 75%); }
  .tela.hidden { display: none; }
  h1 { font-family: var(--display); font-weight: 400; font-size: clamp(40px, 11vw, 80px); line-height: .95; text-shadow: 4px 4px 0 #000; transform: rotate(-3deg); }
  h1 span { color: var(--sol); display: block; font-size: .5em; }
  .sub { font-weight: 700; margin-top: 12px; max-width: 520px; }
  .btn { font-family: var(--texto); font-weight: 800; font-size: 18px; cursor: pointer; border: 3px solid var(--tinta); border-radius: 16px; padding: 10px 24px 7px; color: var(--tinta); background: var(--creme); box-shadow: 0 5px 0 var(--tinta); }
  .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--tinta); }
  .btn.grande { font-family: var(--display); font-weight: 400; font-size: clamp(22px, 6vw, 32px); background: var(--verde); color: #fff; padding: 10px 40px 6px; margin-top: 18px; }
  #niveis { display: grid; grid-template-columns: repeat(10, 1fr); gap: 5px; width: min(100%, 520px); margin-top: 18px; }
  #niveis button { font-family: var(--display); font-size: clamp(11px, 3vw, 16px); height: clamp(30px, 8.5vw, 44px); padding: 0; border: 2px solid var(--tinta); border-radius: 9px; box-shadow: 0 3px 0 var(--tinta); cursor: pointer; color: var(--tinta); }
  #niveis button:disabled { background: #555 !important; color: #999; cursor: default; box-shadow: none; }
  #perso { justify-content: flex-start; }
  #perso h2 { font-family: var(--display); font-weight: 400; font-size: 20px; margin-top: 16px; text-shadow: 2px 2px 0 #000; }
  .opcoes { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 8px; max-width: 520px; }
  .opcoes button { width: 50px; height: 50px; font-size: 26px; border: 3px solid var(--tinta); border-radius: 14px; background: var(--creme); box-shadow: 0 4px 0 var(--tinta); cursor: pointer; }
  .opcoes button.on { outline: 4px solid var(--sol); outline-offset: 2px; transform: scale(1.08); }
  .dica { font-size: 14px; opacity: .85; margin-top: 14px; max-width: 520px; }

  #jogo { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding-top: calc(env(safe-area-inset-top) + 58px); gap: 10px; }
  #hud { display: flex; gap: 8px; font-weight: 800; font-size: 17px; flex-wrap: wrap; justify-content: center; }
  .pill { background: rgba(0,0,0,.45); border: 2px solid rgba(255,255,255,.35); border-radius: 12px; padding: 2px 12px 0; white-space: nowrap; }
  #barra { width: min(92vw, 420px); height: 12px; border-radius: 8px; background: rgba(0,0,0,.45); overflow: hidden; border: 2px solid rgba(255,255,255,.35); }
  #barra i { display: block; height: 100%; width: 0; background: var(--sol); transition: width .2s; }
  canvas { border: 4px solid var(--tinta); border-radius: 10px; box-shadow: 0 6px 0 var(--tinta); }
  #setas { display: grid; grid-template-columns: repeat(3, 64px); grid-template-rows: repeat(2, 56px); gap: 6px; margin-top: 4px; }
  #setas button { font-size: 26px; border: 3px solid var(--tinta); border-radius: 14px; background: var(--creme); box-shadow: 0 4px 0 var(--tinta); }
  #setas button:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--tinta); }
  #b-cima { grid-column: 2; } #b-esq { grid-column: 1; grid-row: 2; } #b-baixo { grid-column: 2; grid-row: 2; } #b-dir { grid-column: 3; grid-row: 2; }
  @media (hover: hover) and (pointer: fine) { #setas { display: none; } }
  #aviso { position: fixed; left: 50%; top: 40%; transform: translate(-50%, -50%); z-index: 12; font-family: var(--display); font-size: clamp(28px, 8vw, 56px); text-shadow: 4px 4px 0 #000; text-align: center; pointer-events: none; opacity: 0; transition: opacity .25s; white-space: nowrap; }
  #aviso.on { opacity: 1; }
</style>
</head>
<body>
<a href="../index.html" id="back-link">← Menu</a>

<div id="menu" class="tela">
  <h1>COBRINHA<span>100 NÍVEIS</span></h1>
  <p class="sub">Coma as frutas pra crescer! Cada nível é mais rápido e tem mais paredes. O nível 100 é o MAIS DIFÍCIL! 💀</p>
  <div id="niveis"></div>
  <button class="btn" id="b-perso" style="margin-top:18px">🎨 Personalizar cobrinha</button>
  <p class="dica">Setas ou W A S D no computador. No celular: arraste o dedo ou use os botões.</p>
</div>

<div id="perso" class="tela hidden">
  <h1 style="font-size:clamp(30px,8vw,56px)">PERSONALIZAR</h1>
  <canvas id="previa" style="margin-top:16px"></canvas>
  <h2>🎨 Cor</h2><div class="opcoes" id="o-cor"></div>
  <h2>🎩 Chapéu</h2><div class="opcoes" id="o-chapeu"></div>
  <h2>🕶️ Acessório</h2><div class="opcoes" id="o-acess"></div>
  <button class="btn grande" id="b-perso-ok">PRONTO ✔</button>
</div>

<div id="fim" class="tela hidden">
  <h1 id="fim-titulo">BATEU!</h1>
  <p class="sub" id="fim-texto"></p>
  <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center">
    <button class="btn grande" id="b-de-novo">DE NOVO</button>
    <button class="btn grande" id="b-proximo" style="background:var(--rosa)">PRÓXIMO ▶</button>
  </div>
  <button class="btn" id="b-niveis" style="margin-top:16px">Escolher nível</button>
</div>

<div id="jogo">
  <div id="hud"><span class="pill" id="h-nivel"></span><span class="pill" id="h-frutas"></span><span class="pill" id="h-recorde"></span></div>
  <div id="barra"><i></i></div>
  <canvas id="tela"></canvas>
  <div id="setas">
    <button id="b-cima">⬆️</button><button id="b-esq">⬅️</button><button id="b-baixo">⬇️</button><button id="b-dir">➡️</button>
  </div>
</div>
<div id="aviso"></div>

<script>
const $ = (id) => document.getElementById(id);
const N = 20; // tamanho do campo (20 x 20 quadradinhos)

// ── Os níveis 1 a 10: velocidade (ms por passo), quantas frutas pra passar e onde ficam as paredes ──
function paredes(nivel) {
  const p = [];
  const linha = (x1, y1, x2, y2) => { for (let x = x1; x <= x2; x++) for (let y = y1; y <= y2; y++) p.push(x + ',' + y); };
  if (nivel >= 3) { linha(4, 4, 5, 5); linha(14, 4, 15, 5); linha(4, 14, 5, 15); linha(14, 14, 15, 15); }
  if (nivel >= 4) { linha(9, 8, 10, 11); }
  if (nivel >= 5) { linha(2, 9, 6, 10); linha(13, 9, 17, 10); }
  if (nivel >= 6) { linha(8, 1, 11, 1); linha(8, 18, 11, 18); }
  if (nivel >= 7) { linha(1, 1, 1, 6); linha(18, 13, 18, 18); }
  if (nivel >= 8) { linha(7, 5, 12, 5); linha(7, 14, 12, 14); }
  if (nivel >= 9) { linha(1, 13, 1, 18); linha(18, 1, 18, 6); }
  if (nivel >= 10) { linha(13, 2, 13, 3); linha(6, 16, 6, 17); linha(2, 2, 3, 2); linha(16, 17, 17, 17); }
  return new Set(p);
}
// Do nível 11 ao 100 as paredes são sorteadas (sempre iguais pra cada nível) e vão ficando mais e mais
function sorteio(semente) { return () => { semente = (semente + 0x6D2B79F5) | 0; let t = Math.imul(semente ^ (semente >>> 15), 1 | semente); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function paredesSorteadas(nivel) {
  const rnd = sorteio(nivel * 7919), p = new Set();
  const pecas = 16 + Math.floor((nivel - 10) / 4); // nível 11: 16 pedaços … nível 100: 38
  for (let k = 0; k < pecas; k++) {
    const tam = 2 + Math.floor(rnd() * Math.min(6, 2 + nivel / 25)), deitada = rnd() < .5;
    const x0 = Math.floor(rnd() * N), y0 = Math.floor(rnd() * N);
    for (let j = 0; j < tam; j++) {
      const x = deitada ? x0 + j : x0, y = deitada ? y0 : y0 + j;
      if (x >= N || y >= N || (y >= 11 && y <= 13 && x <= 9)) continue; // deixa livre onde a cobrinha nasce
      p.add(x + ',' + y);
    }
  }
  // quadradinho que a cobrinha não consegue alcançar vira parede (pra fruta nunca nascer lá)
  const visto = new Set(['5,12']), fila = [[5, 12]];
  while (fila.length) {
    const [x, y] = fila.pop();
    [[1, 0], [-1, 0], [0, 1], [0, -1]].forEach(([dx, dy]) => {
      const k = (x + dx) + ',' + (y + dy);
      if (x + dx < 0 || y + dy < 0 || x + dx >= N || y + dy >= N || p.has(k) || visto.has(k)) return;
      visto.add(k); fila.push([x + dx, y + dy]);
    });
  }
  for (let x = 0; x < N; x++) for (let y = 0; y < N; y++) if (!visto.has(x + ',' + y)) p.add(x + ',' + y);
  return p;
}
const ULTIMO = 100;
const CORES_NIVEL = ['#8fe05a', '#5cd18a', '#3fb8f0', '#6f8cff', '#b06cff', '#ff8ad8', '#ff8a3d', '#ff5d5d', '#d92b2b', '#1a1a1a'];
const NIVEIS = Array.from({ length: ULTIMO }, (_, i) => ({
  velo: Math.round(170 - i * 1.15), // 170ms no nível 1 … 56ms no 100 (cada nível um pouquinho mais rápido)
  meta: 8 + Math.floor(i * 0.3),     // 8 frutas no nível 1 … 37 no 100
  paredes: i < 10 ? paredes(i + 1) : paredesSorteadas(i + 1),
  cor: CORES_NIVEL[Math.floor(i / 10)],
}));
const FRUTAS = ['🍎', '🍓', '🍌', '🍇', '🍉', '🍒', '🍍', '🥝'];

// ── Save (por perfil) ──
const PERFIL = new URLSearchParams(location.search).get('perfil');
const KEY = 'cobrinha' + (PERFIL ? ':' + PERFIL : '');
let save; try { save = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { save = {}; }
save = Object.assign({ liberado: 1, recordes: {} }, save);
const grava = () => { try { localStorage.setItem(KEY, JSON.stringify(save)); } catch (e) { /* ok */ } };

// ── Sons simples ──
let ac;
function som(f, d, tipo) {
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = tipo || 'square'; o.frequency.value = f;
    g.gain.setValueAtTime(.08, ac.currentTime); g.gain.exponentialRampToValueAtTime(.001, ac.currentTime + d);
    o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime + d);
  } catch (e) { /* sem som */ }
}

// ── Tela (canvas) ──
const cv = $('tela'), ctx = cv.getContext('2d');
let Q = 20; // tamanho de cada quadradinho em pixels
function ajusta() {
  const livre = Math.min(innerWidth - 24, innerHeight - (matchMedia('(hover: hover) and (pointer: fine)').matches ? 150 : 290));
  Q = Math.max(12, Math.floor(Math.min(livre, 560) / N));
  const dpr = devicePixelRatio || 1;
  cv.style.width = cv.style.height = Q * N + 'px';
  cv.width = cv.height = Q * N * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  desenha();
}

// ── Estado do jogo ──
let nivel = 1, cobra = [], dir = { x: 1, y: 0 }, fila = [], fruta = null, comidas = 0, vivo = false, timer = null;

function menu() {
  $('menu').classList.remove('hidden'); $('fim').classList.add('hidden'); $('perso').classList.add('hidden');
  const box = $('niveis'); box.innerHTML = '';
  NIVEIS.forEach((nv, i) => {
    const b = document.createElement('button');
    b.textContent = i + 1 > save.liberado ? '🔒' : (i === ULTIMO - 1 ? '💀' : i + 1);
    b.style.background = nv.cor; if (i >= 90) b.style.color = '#fff';
    b.disabled = i + 1 > save.liberado;
    b.onclick = () => comeca(i + 1);
    box.appendChild(b);
  });
}

function comeca(n) {
  nivel = n;
  $('menu').classList.add('hidden'); $('fim').classList.add('hidden'); $('perso').classList.add('hidden');
  cobra = [{ x: 4, y: 12 }, { x: 3, y: 12 }, { x: 2, y: 12 }]; // linha 12 não tem parede em nenhum nível
  dir = { x: 1, y: 0 }; fila = []; comidas = 0; vivo = true;
  novaFruta(); hud(); ajusta();
  aviso('NÍVEL ' + n + (n === ULTIMO ? ' 💀' : ''), 1200);
  clearInterval(timer); clearTimeout(comeca.t);
  comeca.t = setTimeout(() => { if (vivo) timer = setInterval(passo, NIVEIS[nivel - 1].velo); }, 900);
}

function livre(x, y) {
  return !NIVEIS[nivel - 1].paredes.has(x + ',' + y) && !cobra.some((c) => c.x === x && c.y === y);
}
function novaFruta() {
  let x, y, t = 0;
  do { x = Math.floor(Math.random() * N); y = Math.floor(Math.random() * N); } while (!livre(x, y) && ++t < 999);
  fruta = { x, y, e: FRUTAS[Math.floor(Math.random() * FRUTAS.length)] };
}

function passo() {
  if (fila.length) { const d = fila.shift(); if (d.x !== -dir.x || d.y !== -dir.y) dir = d; }
  const cab = { x: cobra[0].x + dir.x, y: cobra[0].y + dir.y };
  const comeu = cab.x === fruta.x && cab.y === fruta.y;
  if (!comeu) cobra.pop();
  if (cab.x < 0 || cab.y < 0 || cab.x >= N || cab.y >= N || !livre(cab.x, cab.y)) { cobra.push(cobra[cobra.length - 1]); return perde(); }
  cobra.unshift(cab);
  if (comeu) {
    comidas++; som(660 + comidas * 20, .1);
    if (comidas >= NIVEIS[nivel - 1].meta) return ganha();
    novaFruta();
  }
  hud(); desenha();
}

function perde() {
  vivo = false; clearInterval(timer); som(140, .5, 'sawtooth'); desenha(true);
  guardaRecorde();
  setTimeout(() => fim(false), 700);
}
function ganha() {
  vivo = false; clearInterval(timer); hud(); desenha();
  [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => som(f, .15), i * 110));
  guardaRecorde();
  if (nivel < ULTIMO && save.liberado < nivel + 1) save.liberado = nivel + 1;
  if (nivel === ULTIMO) save.zerou = true;
  grava();
  setTimeout(() => fim(true), 900);
}
function guardaRecorde() {
  if (comidas > (save.recordes[nivel] || 0)) { save.recordes[nivel] = comidas; grava(); }
}

function fim(venceu) {
  $('fim').classList.remove('hidden');
  $('fim-titulo').textContent = venceu ? (nivel === ULTIMO ? '🏆 ZEROU!' : 'PASSOU! 🎉') : 'BATEU! 💥';
  $('fim-texto').textContent = venceu
    ? (nivel === ULTIMO ? 'Você venceu o nível MAIS DIFÍCIL! Você é o mestre da cobrinha! 🐍👑' : 'Nível ' + (nivel + 1) + ' liberado!')
    : 'Você comeu ' + comidas + ' de ' + NIVEIS[nivel - 1].meta + ' frutas no nível ' + nivel + '.';
  $('b-proximo').style.display = venceu && nivel < ULTIMO ? '' : 'none';
}

function hud() {
  const nv = NIVEIS[nivel - 1];
  $('h-nivel').textContent = 'Nível ' + nivel + (nivel === ULTIMO ? ' 💀' : '');
  $('h-frutas').textContent = '🍎 ' + comidas + ' / ' + nv.meta;
  $('h-recorde').textContent = '🏆 ' + (save.recordes[nivel] || 0);
  document.querySelector('#barra i').style.width = (comidas / nv.meta * 100) + '%';
}

function aviso(t, ms) {
  const a = $('aviso'); a.textContent = t; a.classList.add('on');
  clearTimeout(aviso.t); aviso.t = setTimeout(() => a.classList.remove('on'), ms);
}

function desenha(bateu) {
  if (!cobra.length) return;
  const nv = NIVEIS[nivel - 1];
  // grama quadriculada
  for (let x = 0; x < N; x++) for (let y = 0; y < N; y++) {
    ctx.fillStyle = (x + y) % 2 ? '#a8e063' : '#9ad455';
    ctx.fillRect(x * Q, y * Q, Q, Q);
  }
  // paredes de pedra
  nv.paredes.forEach((k) => {
    const [x, y] = k.split(',').map(Number);
    ctx.fillStyle = '#6b6b7a'; ctx.fillRect(x * Q, y * Q, Q, Q);
    ctx.fillStyle = '#4a4a56'; ctx.fillRect(x * Q, y * Q + Q * .7, Q, Q * .3);
    ctx.fillStyle = '#8a8a99'; ctx.fillRect(x * Q + 2, y * Q + 2, Q * .4, Q * .25);
  });
  // fruta
  ctx.fillStyle = '#000';
  ctx.font = Math.floor(Q * .9) + 'px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(fruta.e, fruta.x * Q + Q / 2, fruta.y * Q + Q / 2 + 1);
  desenhaCobra(ctx, cobra, dir, Q, bateu);
}

// ── Personalizar: cor, chapéu e acessório ──
const CORES = [
  { n: 'Verde', a: '#27a845', b: '#1f8f3a' }, { n: 'Azul', a: '#2f8fe0', b: '#1f6ab0' },
  { n: 'Vermelha', a: '#e0453a', b: '#b02a22' }, { n: 'Amarela', a: '#ffd23f', b: '#e0a800' },
  { n: 'Roxa', a: '#9b5cff', b: '#6a35c7' }, { n: 'Rosa', a: '#ff8ad8', b: '#d94aa8' },
  { n: 'Laranja', a: '#ff8a3d', b: '#d9600f' }, { n: 'Preta', a: '#333', b: '#111' },
  { n: 'Dourada', a: '#ffcc33', b: '#c99400', brilho: true }, { n: 'Arco-íris', arco: true },
];
const CHAPEUS = ['', '🎩', '👑', '🧢', '🎓', '🤠', '🎅', '⛑️', '🪖', '🎉'];
const ACESSORIOS = [
  { e: '', n: 'Nada' }, { e: '🕶️', n: 'Óculos', onde: 'olho' }, { e: '🎀', n: 'Laço', onde: 'pescoco' },
  { e: '🧣', n: 'Cachecol', onde: 'pescoco' }, { e: '👔', n: 'Gravata', onde: 'pescoco' }, { e: '🥸', n: 'Disfarce', onde: 'olho' },
  { e: '🌹', n: 'Flor', onde: 'boca' }, { e: '⭐', n: 'Estrelas', onde: 'rabo' },
];
save.visual = Object.assign({ cor: 0, chapeu: 0, acess: 0 }, save.visual);

function corDo(i, bateu) {
  if (bateu && i === 0) return '#ff3b3b';
  const c = CORES[save.visual.cor] || CORES[0];
  if (c.arco) return 'hsl(' + ((i * 30) % 360) + ',85%,55%)';
  return i % 2 ? c.b : c.a;
}

function desenhaCobra(ctx, cobra, dir, Q, bateu) {
  const v = save.visual, ac = ACESSORIOS[v.acess] || ACESSORIOS[0];
  const meio = (c) => [c.x * Q + Q / 2, c.y * Q + Q / 2];
  const emoji = (e, x, y, t) => { ctx.fillStyle = '#000'; ctx.font = Math.floor(t) + 'px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(e, x, y); };
  // corpo (do rabo pra cabeça)
  for (let i = cobra.length - 1; i >= 0; i--) {
    const [x, y] = meio(cobra[i]), r = i === 0 ? Q * .5 : Q * .42;
    ctx.fillStyle = corDo(i, bateu);
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    if ((CORES[v.cor] || {}).brilho && i % 3 === 0) { ctx.fillStyle = 'rgba(255,255,255,.6)'; ctx.beginPath(); ctx.arc(x - r * .3, y - r * .3, r * .25, 0, 7); ctx.fill(); }
  }
  if (ac.onde === 'rabo') { const [x, y] = meio(cobra[cobra.length - 1]); emoji(ac.e, x, y, Q * .8); }
  if (ac.onde === 'pescoco' && cobra[1]) { const [x, y] = meio(cobra[1]); emoji(ac.e, x, y + 1, Q * .85); }
  // olhinhos
  const [cx, cy] = meio(cobra[0]);
  const px = -dir.y, py = dir.x; // de lado
  [1, -1].forEach((s) => {
    const ex = cx + dir.x * Q * .15 + px * s * Q * .2, ey = cy + dir.y * Q * .15 + py * s * Q * .2;
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(ex, ey, Q * .14, 0, 7); ctx.fill();
    ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(ex + dir.x * Q * .04, ey + dir.y * Q * .04, Q * .07, 0, 7); ctx.fill();
  });
  if (ac.onde === 'olho') emoji(ac.e, cx + dir.x * Q * .15, cy + dir.y * Q * .15, Q * .8);
  if (ac.onde === 'boca') emoji(ac.e, cx + dir.x * Q * .5, cy + dir.y * Q * .5 + Q * .1, Q * .6);
  if (CHAPEUS[v.chapeu]) emoji(CHAPEUS[v.chapeu], cx, cy - Q * .55, Q * .85);
}

// tela de personalizar, com a cobrinha de exemplo
const pv = document.getElementById('previa'), pctx = pv.getContext('2d');
function previa() {
  const q = 44, dpr = devicePixelRatio || 1;
  pv.width = 8 * q * dpr; pv.height = 3 * q * dpr; pv.style.width = 8 * q + 'px'; pv.style.height = 3 * q + 'px';
  pctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  pctx.fillStyle = '#a8e063'; pctx.fillRect(0, 0, 8 * q, 3 * q);
  const c = [6, 5, 4, 3, 2, 1].map((x) => ({ x, y: 1.5 }));
  desenhaCobra(pctx, c, { x: 1, y: 0 }, q, false);
}
function opcoes(id, lista, chave, mostra) {
  const box = $(id); box.innerHTML = '';
  lista.forEach((it, i) => {
    const b = document.createElement('button');
    mostra(b, it, i);
    if (save.visual[chave] === i) b.classList.add('on');
    b.onclick = () => { save.visual[chave] = i; grava(); som(520 + i * 40, .08); personalizar(); };
    box.appendChild(b);
  });
}
function personalizar() {
  $('menu').classList.add('hidden'); $('perso').classList.remove('hidden');
  opcoes('o-cor', CORES, 'cor', (b, c) => { b.title = c.n; b.style.background = c.arco ? 'linear-gradient(90deg,red,orange,yellow,lime,cyan,blue,violet)' : c.a; });
  opcoes('o-chapeu', CHAPEUS, 'chapeu', (b, e) => { b.textContent = e || '🚫'; });
  opcoes('o-acess', ACESSORIOS, 'acess', (b, a) => { b.textContent = a.e || '🚫'; b.title = a.n; });
  previa();
}
$('b-perso').onclick = personalizar;
$('b-perso-ok').onclick = menu;

// ── Controles ──
const DIRS = { cima: { x: 0, y: -1 }, baixo: { x: 0, y: 1 }, esq: { x: -1, y: 0 }, dir: { x: 1, y: 0 } };
function vira(nome) {
  if (!vivo) return;
  const d = DIRS[nome], ult = fila.length ? fila[fila.length - 1] : dir;
  if ((d.x === ult.x && d.y === ult.y) || (d.x === -ult.x && d.y === -ult.y)) return;
  if (fila.length < 3) fila.push(d);
}
addEventListener('keydown', (e) => {
  const k = { ArrowUp: 'cima', w: 'cima', W: 'cima', ArrowDown: 'baixo', s: 'baixo', S: 'baixo', ArrowLeft: 'esq', a: 'esq', A: 'esq', ArrowRight: 'dir', d: 'dir', D: 'dir' }[e.key];
  if (k) { e.preventDefault(); vira(k); }
});
['cima', 'baixo', 'esq', 'dir'].forEach((n) => $('b-' + n).addEventListener('pointerdown', (e) => { e.preventDefault(); vira(n); }));
let toque = null;
addEventListener('touchstart', (e) => { toque = { x: e.touches[0].clientX, y: e.touches[0].clientY }; }, { passive: true });
addEventListener('touchmove', (e) => {
  if (!toque) return;
  const dx = e.touches[0].clientX - toque.x, dy = e.touches[0].clientY - toque.y;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 25) return;
  vira(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'dir' : 'esq') : (dy > 0 ? 'baixo' : 'cima'));
  toque = { x: e.touches[0].clientX, y: e.touches[0].clientY };
}, { passive: true });

$('b-de-novo').onclick = () => comeca(nivel);
$('b-proximo').onclick = () => comeca(nivel + 1);
$('b-niveis').onclick = menu;
addEventListener('resize', ajusta);

window.__cobra = { NIVEIS, save, comeca, get cobra() { return cobra; }, get fruta() { return fruta; }, set fruta(f) { fruta = f; }, passo, vira };
menu(); ajusta();
</script>
