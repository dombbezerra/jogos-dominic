<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root { --tinta: #0e0c33; --creme: #fff6dc; --sol: #ffd23f; --verde: #2fd15a; --display: 'Bungee', 'Arial Black', Impact, sans-serif; --texto: 'Baloo 2', 'Segoe UI', Arial, sans-serif; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: #3d8b3d; font-family: var(--texto); color: var(--creme); -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
  #back-link { position: fixed; top: calc(env(safe-area-inset-top) + 10px); left: 10px; z-index: 40; text-decoration: none; font-weight: 800; background: var(--sol); color: var(--tinta); border: 3px solid var(--tinta); border-radius: 12px; padding: 4px 12px 2px; box-shadow: 0 4px 0 var(--tinta); }
  .barra { position: fixed; top: calc(env(safe-area-inset-top) + 10px); left: 0; right: 0; z-index: 30; display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; pointer-events: none; padding: 0 60px 0 100px; }
  .pill { background: var(--tinta); border: 3px solid #fff; border-radius: 999px; padding: 4px 14px 2px; font-weight: 800; font-size: 16px; white-space: nowrap; }
  .pill b { font-family: var(--display); font-weight: 400; color: var(--sol); }
  .botoes { position: fixed; right: 14px; bottom: calc(env(safe-area-inset-bottom) + 16px); z-index: 30; display: flex; flex-direction: column; gap: 10px; align-items: flex-end; }
  .btn { font-family: var(--texto); font-weight: 800; font-size: 17px; cursor: pointer; border: 3px solid var(--tinta); border-radius: 16px; padding: 10px 16px 7px; color: var(--tinta); background: var(--sol); box-shadow: 0 4px 0 var(--tinta); max-width: 70vw; }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--tinta); }
  #acao { font-size: 20px; padding: 14px 20px 10px; background: var(--verde); color: #fff; display: none; }
  #acao.roubar { background: #ff4d6d; }
  #acao.vender { background: #ff9f1c; }
  #toast { position: fixed; left: 50%; top: calc(env(safe-area-inset-top) + 60px); transform: translateX(-50%); z-index: 70; background: var(--tinta); color: #fff; border: 3px solid #fff; border-radius: 14px; padding: 8px 16px 5px; font-weight: 800; opacity: 0; transition: opacity .25s; pointer-events: none; max-width: 92vw; text-align: center; }
  #toast.on { opacity: 1; }
  #natal { position: fixed; left: 50%; top: 40%; transform: translate(-50%, -50%) scale(.6); z-index: 65; font-family: var(--display); font-size: clamp(30px, 9vw, 64px); color: #fff; text-align: center; text-shadow: 4px 4px 0 #c62828, -2px -2px 0 #2e7d32; opacity: 0; transition: opacity .4s, transform .4s; pointer-events: none; }
  #natal small { display: block; font-family: var(--texto); font-weight: 800; font-size: 18px; text-shadow: 2px 2px 0 #000; }
  #natal.on { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  #toast.alarme { background: #d62839; }
  #joy { position: fixed; z-index: 25; width: 100px; height: 100px; margin: -50px 0 0 -50px; border: 4px solid rgba(255,255,255,.6); border-radius: 50%; display: none; pointer-events: none; }
  #joy i { position: absolute; left: 50%; top: 50%; width: 44px; height: 44px; margin: -22px 0 0 -22px; border-radius: 50%; background: rgba(255,255,255,.75); }
  .fundo { position: fixed; inset: 0; z-index: 60; background: rgba(5,20,40,.6); display: none; align-items: flex-end; justify-content: center; touch-action: auto; }
  .fundo.on { display: flex; }
  .painel { width: min(620px, 100%); max-height: 88vh; overflow-y: auto; background: #fff6dc; color: var(--tinta); border: 4px solid var(--tinta); border-radius: 22px 22px 0 0; padding: 14px 14px calc(env(safe-area-inset-bottom) + 18px); }
  .painel h2 { font-family: var(--display); font-weight: 400; font-size: 24px; text-align: center; }
  .painel h3 { font-weight: 800; margin: 14px 0 4px; font-size: 18px; display: flex; justify-content: space-between; }
  .fechar { float: right; font-size: 22px; background: none; border: none; cursor: pointer; }
  .barrinha { height: 12px; border: 2px solid var(--tinta); border-radius: 8px; overflow: hidden; background: #fff; margin: 2px 0 8px; }
  .barrinha i { display: block; height: 100%; background: var(--verde); }
  .cartas { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 6px; }
  .carta { border: 3px solid var(--c); border-radius: 12px; background: #fff; text-align: center; padding: 4px 2px 3px; font-weight: 800; font-size: 11px; line-height: 1.15; }
  .carta b { display: block; font-size: 34px; line-height: 1.2; }
  .carta small { display: block; color: #1a8a3a; font-size: 11px; }
  .carta.nao { background: #e6e0cc; }
  .carta.nao b { filter: brightness(0) opacity(.35) !important; }
  #inNome { font-family: var(--texto); font-weight: 800; font-size: 22px; width: min(320px, 90%); padding: 10px 14px 6px; border: 3px solid var(--tinta); border-radius: 14px; text-align: center; color: var(--tinta); }
  .dica { position: fixed; left: 14px; bottom: calc(env(safe-area-inset-bottom) + 16px); z-index: 20; font-weight: 800; font-size: 13px; color: #fff; text-shadow: 1px 1px 0 #000; pointer-events: none; opacity: .85; }
</style>
</head>
<body>
<a href="../index.html" id="back-link">← Menu</a>
<div class="barra">
  <span class="pill" id="dinheiro">💰 <b>R$ 0</b></span>
  <span class="pill">📈 <b id="renda">R$ 0</b>/s</span>
  <span class="pill">👥 <b id="gente">—</b></span>
  <span class="pill" id="pillNatal" style="display:none;background:#c62828">🎄 <b style="color:#fff">Natal</b></span>
</div>
<canvas id="cv"></canvas>
<div class="botoes">
  <button class="btn" id="acao"></button>
  <button class="btn" id="b-nome">✏️ Nome</button>
  <button class="btn" id="b-indice">📖 Índice</button>
</div>
<div class="dica" id="dica">Arraste o dedo pra andar 👆</div>
<div id="toast"></div>
<div id="natal">🎄 FELIZ NATAL! 🎅<small>Cai um monte de presente! O bicho que leva um presente vale 3x!</small></div>
<div class="fundo" id="fundo"><div class="painel" id="painel"></div></div>
<div class="fundo" id="telaNome" style="align-items:center"><div class="painel" style="border-radius:22px;text-align:center">
  <h2>🐾 Qual é o seu nome?</h2>
  <p style="font-weight:700;margin:6px 0 10px">Ele aparece em cima do seu boneco e no seu cercadinho.<br>Todo mundo no servidor vai ver!</p>
  <input id="inNome" maxlength="14" autocomplete="off" placeholder="Seu nome">
  <p id="erroNome" style="color:#c0303a;font-weight:800;min-height:20px"></p>
  <button class="btn" id="okNome" style="background:var(--verde);color:#fff">JOGAR! ▶</button>
</div></div>
<div id="joy"><i></i></div>
<script src="../mundo-blocos/three.min.js"></script>
<script>
(() => {
const $ = id => document.getElementById(id);
const real = v => {   // números grandes ficam curtinhos: mil, mi, bi, tri
  v = Math.floor(v);
  for (const [n, nome] of [[1e12, ' tri'], [1e9, ' bi'], [1e6, ' mi']]) if (v >= n) return 'R$ ' + (v / n).toLocaleString('pt-BR', { maximumFractionDigits: v / n < 10 ? 1 : 0 }) + nome;
  return 'R$ ' + v.toLocaleString('pt-BR');
};

// ── Bichos (raridades) ──
const RAR = {
  comum:    { nome: 'Comum',    cor: '#cfd8dc', peso: 60 },
  raro:     { nome: 'Raro',     cor: '#5ee06b', peso: 25 },
  epico:    { nome: 'Épico',    cor: '#b37bff', peso: 10 },
  lendario: { nome: 'Lendário', cor: '#ffd23f', peso: 4 },
  mitico:   { nome: 'Mítico',   cor: '#ff5d5d', peso: 0.9 },
  secreto:  { nome: 'SECRETO',  cor: 'arco',    peso: 0.12 },
};
// os 100 bichos, em grupos (o Índice). Cada um é um pouco mais caro que o anterior: de R$ 1 até R$ 2 trilhões!
// [nome, emoji, filtro de cor (pra bichos que não têm emoji próprio)]
const GRUPOS = [
  { id: 'fazenda', nome: 'Fazenda', e: '🏡', bichos: [['Formiga', '🐜'], ['Borboleta', '🦋'], ['Lagartixa', '🦎', 'saturate(.3) brightness(1.3)'], ['Rato', '🐭'], ['Hamster', '🐹'], ['Porquinho-da-índia', '🐹', 'hue-rotate(-30deg) saturate(1.6)'], ['Esquilo', '🐿️'], ['Coelho', '🐰'], ['Galinha', '🐔'], ['Pato', '🦆'], ['Peru', '🦃'], ['Ganso', '🪿'], ['Gato', '🐱'], ['Cachorro', '🐶'], ['Ovelha', '🐑'], ['Cabra', '🐐'], ['Porco', '🐷'], ['Vaca', '🐮'], ['Burro', '🫏'], ['Cavalo', '🐴']] },
  { id: 'ceu', nome: 'Céu', e: '☁️', bichos: [['Beija-flor', '🐦', 'hue-rotate(120deg) saturate(2)'], ['Pica-pau', '🐦', 'hue-rotate(160deg) saturate(2.5)'], ['Papagaio', '🦜'], ['Arara', '🦜', 'hue-rotate(200deg) saturate(1.5)'], ['Tucano', '🐦‍⬛'], ['Coruja', '🦉'], ['Falcão', '🦅', 'sepia(.6) brightness(1.1)'], ['Águia', '🦅'], ['Pavão', '🦚'], ['Flamingo', '🦩'], ['Cisne', '🦢'], ['Pinguim', '🐧'], ['Avestruz', '🦤', 'grayscale(.8) brightness(.8)'], ['Emu', '🦤', 'sepia(.8) brightness(.8)'], ['Morcego', '🦇']] },
  { id: 'pantano', nome: 'Pântano', e: '🪷', bichos: [['Sapo', '🐸'], ['Rã', '🐸', 'hue-rotate(60deg)'], ['Salamandra', '🦎', 'hue-rotate(-90deg) saturate(2)'], ['Axolote', '🦎', 'hue-rotate(200deg) saturate(.7) brightness(1.4)'], ['Camaleão', '🦎', 'hue-rotate(40deg) saturate(2.5)'], ['Iguana', '🦎', 'hue-rotate(-30deg)'], ['Cobra', '🐍'], ['Cobra-coral', '🐍', 'hue-rotate(-110deg) saturate(3)'], ['Jiboia', '🐍', 'sepia(.9) brightness(.85)'], ['Píton', '🐍', 'hue-rotate(-60deg) saturate(1.5)'], ['Jacaré', '🐊'], ['Crocodilo', '🐊', 'brightness(.7) saturate(.8)'], ['Tartaruga-marinha', '🐢']] },
  { id: 'floresta', nome: 'Floresta', e: '🌲', bichos: [['Ouriço', '🦔'], ['Tatu', '🦔', 'grayscale(.7) brightness(1.1)'], ['Preguiça', '🦥'], ['Tamanduá', '🦡', 'sepia(.7)'], ['Capivara', '🦫', 'sepia(.5) brightness(1.15)'], ['Castor', '🦫'], ['Lontra', '🦦'], ['Raposa', '🦊'], ['Lobo', '🐺'], ['Cervo', '🦌'], ['Alce', '🫎'], ['Lince', '🐈', 'sepia(.7) saturate(1.4)'], ['Urso-pardo', '🐻'], ['Urso-polar', '🐻‍❄️'], ['Panda', '🐼'], ['Coala', '🐨']] },
  { id: 'selva', nome: 'Selva', e: '🌴', bichos: [['Macaco', '🐒'], ['Gorila', '🦍'], ['Canguru', '🦘'], ['Zebra', '🦓'], ['Camelo', '🐫'], ['Dromedário', '🐪'], ['Antílope', '🦌', 'sepia(.6) saturate(1.8)'], ['Gazela', '🦌', 'hue-rotate(-20deg) brightness(1.2)'], ['Búfalo', '🐃'], ['Hiena', '🐺', 'sepia(.8) saturate(1.3)'], ['Guepardo', '🐆', 'brightness(1.2) saturate(1.3)'], ['Leopardo', '🐆'], ['Onça-pintada', '🐆', 'hue-rotate(-15deg) saturate(2)'], ['Girafa', '🦒'], ['Tigre', '🐯'], ['Leão', '🦁'], ['Hipopótamo', '🦛'], ['Rinoceronte', '🦏'], ['Elefante', '🐘']] },
  { id: 'mar', nome: 'Mar', e: '🌊', bichos: [['Camarão', '🦐'], ['Caranguejo', '🦀'], ['Estrela-do-mar', '⭐', 'hue-rotate(-40deg) saturate(2)'], ['Lagosta', '🦞'], ['Água-viva', '🪼'], ['Peixe-palhaço', '🐠'], ['Cavalo-marinho', '🐟', 'hue-rotate(-160deg) saturate(2)'], ['Lula', '🦑'], ['Polvo', '🐙'], ['Foca', '🦭'], ['Leão-marinho', '🦭', 'sepia(.8)'], ['Morsa', '🦭', 'sepia(1) saturate(1.6) brightness(.85)'], ['Tubarão-martelo', '🦈', 'brightness(.8)'], ['Tubarão-branco', '🦈'], ['Golfinho', '🐬'], ['Orca', '🐋', 'grayscale(1) brightness(.5) contrast(1.6)'], ['Baleia-azul', '🐳']] },
];
const slug = n => n.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z]+/g, '-');
const BICHOS = [];
for (const g of GRUPOS) for (const [nome, e, f] of g.bichos) BICHOS.push({ id: slug(nome), nome, e, f, grupo: g.id });
// preço sobe um pouquinho a cada bicho (uns 33%), e o dinheiro por segundo acompanha
BICHOS.forEach((b, i) => {
  const bruto = Math.pow(2e12, i / (BICHOS.length - 1)), dig = Math.pow(10, Math.max(0, Math.floor(Math.log10(bruto)) - 1));
  b.preco = Math.max(Math.round(bruto / dig) * dig, i ? BICHOS[i - 1].preco + 1 : 1);
  b.renda = Math.max(1, Math.round(b.preco / (12 + i * 0.6)));
  b.r = i < 30 ? 'comum' : i < 55 ? 'raro' : i < 75 ? 'epico' : i < 90 ? 'lendario' : i < 97 ? 'mitico' : 'secreto';
});
const B = id => BICHOS.find(b => b.id === id);
// dourado vale 2x; com a mutação de Natal (presente que caiu nele) vale 3x
const mult = a => (a.ouro ? 2 : 1) * (a.natal ? 3 : 1);
const rendaDe = a => B(a.id).renda * mult(a);
const precoDe = a => B(a.id).preco * mult(a);
// sorteia um bicho: primeiro a raridade, depois o bicho dela (de vez em quando vem DOURADO, que vale o dobro)
function sorteia(sorte = 1, rnd = Math.random) {
  const pesos = Object.entries(RAR).map(([k, v], i) => [k, v.peso * (i ? sorte : 1)]);
  let n = rnd() * pesos.reduce((s, p) => s + p[1], 0), r = 'comum';
  for (const [k, p] of pesos) { if ((n -= p) < 0) { r = k; break; } }
  const lista = BICHOS.filter(b => b.r === r);
  return { id: lista[Math.floor(rnd() * lista.length)].id, ouro: rnd() < 0.06 };
}

// ── Save ──
const PERFIL = new URLSearchParams(location.search).get('perfil');
const KEY = 'roubeAnimal' + (PERFIL ? ':' + PERFIL : '');
const VAGAS = 10;
let S; try { S = JSON.parse(localStorage.getItem(KEY)); } catch (e) { S = null; }
S = Object.assign({ dinheiro: 100, caixa: 0, slots: Array(VAGAS).fill(null), salvo: Date.now(), nome: '', id: '' }, S || {});
if (!S.id) S.id = Math.random().toString(36).slice(2, 12).padEnd(8, '0');
const grava = () => { S.salvo = Date.now(); try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* ok */ } };
S.slots = S.slots.map(a => a && B(a.id) ? a : null);
S.indice = S.indice || {}; S.grupoOk = S.grupoOk || {};
// Índice: marca o bicho como descoberto (e dá prêmio quando completa um grupo)
function descobre(id) {
  if (S.indice[id]) return; S.indice[id] = true;
  const g = GRUPOS.find(x => x.id === B(id).grupo), lista = BICHOS.filter(b => b.grupo === g.id);
  toast('📖 Novo no Índice: ' + B(id).e + ' ' + B(id).nome + '!', 2200);
  if (!S.grupoOk[g.id] && lista.every(b => S.indice[b.id])) {
    S.grupoOk[g.id] = true; const premio = lista[lista.length - 1].preco; S.dinheiro += premio;
    setTimeout(() => toast('🏆 Você completou ' + g.e + ' ' + g.nome + '! Ganhou ' + real(premio) + '!', 4000), 2300);
  }
}
for (const a of S.slots) if (a) S.indice[a.id] = true;
// sorteio que dá igual em todo aparelho (a mesma "semente" dá o mesmo bicho)
function rng(seed) {
  return () => { seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}

// ── Mapa: 8 cercadinhos (4 em cima, 4 embaixo) e a esteira de bichos no meio ──
const PW = 480, PH = 380, VAO = 70, T = 18, PORTA = 120;
const MW = 4 * PW + 5 * VAO, MH = 1400;
const bases = [];
function criaBase(i) {
  const cima = i >= 4, x = VAO + (i % 4) * (PW + VAO), y = cima ? 100 : 920, w = PW, h = PH;
  const px = x + w / 2 - PORTA / 2, py = cima ? y + h - T : y;
  const b = { i, x, y, w, h, cima, slots: Array(VAGAS).fill(null), solto: {}, caixaFlut: 0 };
  b.paredes = [[x, y, w, T], [x, y + h - T, w, T], [x, y, T, h], [x + w - T, y, T, h]];
  b.paredes[cima ? 1 : 0] = [x, py, px - x, T];
  b.paredes.push([px + PORTA, py, x + w - px - PORTA, T]);
  b.dIn = { x: x + w / 2, y: cima ? y + h - 60 : y + 60 };
  b.dOut = { x: x + w / 2, y: cima ? y + h + 50 : y - 50 };
  b.pos = [];
  for (let k = 0; k < VAGAS; k++) {
    const c = k % 5, r = Math.floor(k / 5);
    b.pos.push({ x: x + 60 + c * (w - 120) / 4, y: cima ? y + 70 + r * 95 : y + h - 70 - r * 95 });
  }
  bases.push(b); return b;
}
for (let i = 0; i < 8; i++) criaBase(i);
let minha = bases[0];
minha.slots = S.slots;
const ESTEIRA = { y1: 650, y2: 750 };
const dentro = (p, b) => p.x > b.x + T && p.x < b.x + b.w - T && p.y > b.y + T && p.y < b.y + b.h - T;
const baseDe = p => bases.find(b => dentro(p, b)) || null;
// cada bicho anda solto pelo cercadinho
function solto(b, k) {
  let st = b.solto[k];
  if (!st) st = b.solto[k] = { x: b.pos[k].x, y: b.pos[k].y, tx: b.pos[k].x, ty: b.pos[k].y, espera: Math.random() * 2, dir: 1, moeda: 1 + Math.random() * 3 };
  return st;
}
const moedas = [];
function andaSoltos(dt) {
  for (const b of bases) for (let k = 0; k < VAGAS; k++) {
    if (!b.slots[k]) { delete b.solto[k]; continue; }
    const st = solto(b, k);
    if (st.espera > 0) st.espera -= dt;
    else {
      const dx = st.tx - st.x, dy = st.ty - st.y, d = Math.hypot(dx, dy), p = 35 * dt;
      if (d <= p) { st.x = st.tx; st.y = st.ty; st.espera = 1 + Math.random() * 3; st.tx = b.x + 60 + Math.random() * (b.w - 120); st.ty = b.y + 60 + Math.random() * (b.h - 120); }
      else { st.x += dx / d * p; st.y += dy / d * p; st.dir = dx > 0 ? -1 : 1; }
    }
    // os seus bichos vão soltando moedinhas enquanto andam
    if (b === minha && (st.moeda -= dt) <= 0) { st.moeda = 2.5 + Math.random() * 2; moedas.push({ x: st.x, y: st.y, t: 0 }); }
  }
  for (let i = moedas.length - 1; i >= 0; i--) if ((moedas[i].t += dt) > 1) moedas.splice(i, 1);
}
const livre = b => b.slots.findIndex((s, k) => !s && !b.reserva?.[k]);

// ── Gente: você, as outras pessoas do servidor e os bots (nos cercadinhos sem ninguém) ──
const eu = { x: minha.dIn.x, y: minha.dIn.y, r: 20, nome: S.nome || 'Você', base: minha, vel: 230 };
const remotos = {};   // id → outra pessoa
const donoHumano = b => Object.values(remotos).find(r => r.base === b) || null;
const BOT_NOMES = ['Lucas', 'Bia', 'Theo', 'Ana', 'Davi', 'Lara', 'Enzo', 'Malu'];
const bots = bases.map((b, i) => ({ x: b.dIn.x, y: b.dIn.y, r: 20, nome: BOT_NOMES[i] + ' (bot)', base: b, rota: [], espera: Math.random() * 3 }));
const botAtivo = bt => bt.base !== minha && !donoHumano(bt.base);
let sala = 0;
function slotsBot(i) {   // os bichos do cercadinho de um bot (iguais pra todo mundo do servidor)
  const r = rng(sala * 1000 + i * 17 + 5), n = 3 + Math.floor(r() * 4), s = Array(VAGAS).fill(null);
  for (let j = 0; j < n; j++) s[j] = sorteia(1 + j * 0.6, r);
  return s;
}
function semeiaBots(tudo) { for (const b of bases) if (b !== minha && !donoHumano(b) && (tudo || b.humano)) { b.slots = slotsBot(b.i); b.solto = {}; b.humano = false; } }
semeiaBots(true);

// ── Esteira: é a mesma pra todo mundo (sai do relógio do servidor) ──
let difRelogio = 0, online = false;
const agoraServ = () => Date.now() + difRelogio;

// ── Evento de Natal (20 a 30 de dezembro): cai um monte de presente, e o bicho que leva um presente ganha mutação de Natal ──
const NATAL = (() => { const d = new Date(); return new URLSearchParams(location.search).has('natal') || (d.getMonth() === 11 && d.getDate() >= 20 && d.getDate() <= 30); })();
const presentes = [], brilhos = [];
let proxPresente = 0, proxMirado = 8;
function chovePresentes(dt) {

  if ((proxPresente -= dt) <= 0) { proxPresente = 0.35; presentes.push({ x: eu.x + (Math.random() - 0.5) * 1400, y: eu.y + (Math.random() - 0.5) * 1000, h: 14 + Math.random() * 4 }); }

  if ((proxMirado -= dt) <= 0) {

  }

// ── Loop ──
function passo(dt) {
  // você anda
  let mx = 0, my = 0;
  if (joy.on) { const dx = joy.x - joy.ox, dy = joy.y - joy.oy, d = Math.hypot(dx, dy); if (d > 8) { mx = dx / Math.max(d, 50); my = dy / Math.max(d, 50); } }
  if (teclas['arrowleft'] || teclas['a']) mx = -1; if (teclas['arrowright'] || teclas['d']) mx = 1;
  if (teclas['arrowup'] || teclas['w']) my = -1; if (teclas['arrowdown'] || teclas['s']) my = 1;
  const m = Math.hypot(mx, my); if (m > 1) { mx /= m; my /= m; }
  eu.x += mx * eu.vel * dt; eu.y += my * eu.vel * dt;
  empurra(eu);
  // as outras pessoas deslizam até onde o servidor disse que elas estão
  for (const o of Object.values(remotos)) { const k = Math.min(1, dt * 5); o.x += (o.tx - o.x) * k; o.y += (o.ty - o.y) * k; }
  // dinheiro dos bichos vai pro caixa do cercadinho; entrando nele você pega
  andaSoltos(dt);
  chovePresentes(dt);
  S.caixa += rendaTotal() * dt;
  if (dentro(eu, minha) && S.caixa >= 1) { S.dinheiro += S.caixa; minha.caixaFlut = Math.floor(S.caixa); minha.caixaT = 1; S.caixa = 0; if (minha.caixaFlut >= 1) som('moeda'); }
  if (minha.caixaT > 0) minha.caixaT -= dt;
  atualizaEsteira();
  // bichos comprados andando até a vaga
  for (let i = andando.length - 1; i >= 0; i--) {
    const a = andando[i];
    if (!a.rota.length || anda(a, a.rota[0], 150, dt) && (a.rota.shift(), !a.rota.length)) {
      if (!a.remoto) { a.base.slots[a.k] = { id: a.id, ouro: a.ouro }; delete a.base.reserva[a.k]; if (a.base === minha) descobre(a.id); grava(); }
      andando.splice(i, 1);
    }
  }
  pensaBots(dt);
  if ((passo.salva = (passo.salva || 0) + dt) > 5) { passo.salva = 0; grava(); }
}
