<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f0d24">
<title>DJ IA</title>

<style>
  :root {
    --fundo: #0f0d24; --painel: #1a1738; --borda: #2c2860; --texto: #f2efff; --apagado: #a39fc9;

    --display: 'Bungee', 'Arial Black', Impact, sans-serif; --fonte: 'Baloo 2', 'Segoe UI', Arial, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { background: var(--fundo); color: var(--texto); font-family: var(--fonte); display: flex; flex-direction: column; -webkit-tap-highlight-color: transparent; }
  header { display: flex; align-items: center; gap: 10px; padding: calc(env(safe-area-inset-top) + 10px) 14px 10px; border-bottom: 1px solid var(--borda); background: rgba(15,13,36,.92); position: sticky; top: 0; z-index: 5; }
  header a { text-decoration: none; color: var(--texto); font-weight: 800; background: var(--painel); border: 1px solid var(--borda); border-radius: 12px; padding: 4px 12px 2px; }
  header h1 { flex: 1; font-family: var(--display); font-weight: 400; font-size: 20px; text-align: center; }
  header h1 span { color: var(--roxo); }
  #b-minhas { background: var(--painel); color: var(--texto); border: 1px solid var(--borda); border-radius: 12px; padding: 4px 12px 2px; font-family: inherit; font-weight: 800; font-size: 14px; cursor: pointer; }

  main { flex: 1; overflow-y: auto; padding: 18px 14px 10px; }
  .conversa { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
  .msg { display: flex; gap: 10px; align-items: flex-start; }
  .msg .av { flex: none; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-size: 18px; background: linear-gradient(135deg, var(--roxo), var(--rosa)); }
  .msg .txt { font-size: 16px; line-height: 1.45; font-weight: 600; padding-top: 4px; white-space: pre-wrap; }
  .msg.eu { justify-content: flex-end; }
  .msg.eu .txt { background: var(--painel); border: 1px solid var(--borda); border-radius: 18px; padding: 8px 14px 6px; max-width: 80%; }
  .digitando span { display: inline-block; width: 7px; height: 7px; margin: 0 2px; border-radius: 50%; background: var(--apagado); animation: pontinho 1s infinite; }
  .digitando span:nth-child(2) { animation-delay: .15s; } .digitando span:nth-child(3) { animation-delay: .3s; }
  @keyframes pontinho { 50% { transform: translateY(-5px); opacity: .5; } }

  /* Cartão da música */
  .cartao { margin-top: 10px; display: flex; gap: 12px; align-items: center; background: var(--painel); border: 1px solid var(--borda); border-radius: 18px; padding: 10px; max-width: 460px; }
  .capa { flex: none; width: 84px; height: 84px; border-radius: 14px; display: grid; place-items: center; font-size: 42px; box-shadow: 0 6px 18px rgba(0,0,0,.4); position: relative; overflow: hidden; }
  .capa::after { content: ''; position: absolute; inset: 0; background: radial-gradient(circle at 30% 20%, rgba(255,255,255,.35), transparent 55%); }
  .cartao.tocando .capa { animation: gira-capa 1.6s ease-in-out infinite; }
  @keyframes gira-capa { 50% { transform: scale(1.06) rotate(-3deg); } }
  .info { flex: 1; min-width: 0; }
  .info b { display: block; font-size: 18px; line-height: 1.15; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .info small { color: var(--apagado); font-weight: 700; font-size: 13px; }
  .barra { height: 4px; border-radius: 3px; background: var(--borda); margin: 8px 0 8px; overflow: hidden; }
  .barra i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--roxo), var(--rosa)); }
  .acoes { display: flex; gap: 8px; }
  .acoes button { font-family: inherit; font-weight: 800; font-size: 14px; cursor: pointer; border: none; border-radius: 999px; padding: 6px 14px 4px; }
  .play { background: var(--texto); color: var(--fundo); min-width: 82px; }
  .salvar { background: var(--roxo); color: #fff; }
  .salvar:disabled { background: var(--borda); color: var(--apagado); cursor: default; }

  /* Escrever */
  footer { padding: 10px 14px calc(env(safe-area-inset-bottom) + 12px); }
  .sugestoes { max-width: 760px; margin: 0 auto 8px; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
  .sugestoes button { flex: none; font-family: inherit; font-weight: 700; font-size: 14px; color: var(--texto); background: var(--painel); border: 1px solid var(--borda); border-radius: 999px; padding: 5px 12px 3px; cursor: pointer; white-space: nowrap; }
  form { max-width: 760px; margin: 0 auto; display: flex; gap: 8px; background: var(--painel); border: 1px solid var(--borda); border-radius: 24px; padding: 6px 6px 6px 16px; }
  #texto { flex: 1; min-width: 0; background: none; border: none; outline: none; color: var(--texto); font-family: inherit; font-size: 16px; font-weight: 600; }
  #texto::placeholder { color: var(--apagado); }
  #enviar { flex: none; width: 42px; height: 42px; border-radius: 50%; border: none; background: var(--texto); color: var(--fundo); font-size: 20px; font-weight: 800; cursor: pointer; }
  #enviar:disabled { opacity: .35; }
  #mic { flex: none; width: 42px; height: 42px; border-radius: 50%; border: none; background: var(--borda); color: var(--texto); font-size: 19px; cursor: pointer; }
  #mic.ouvindo { background: var(--rosa); animation: ouvindo 1s ease-in-out infinite; }
  @keyframes ouvindo { 50% { box-shadow: 0 0 0 8px rgba(255, 93, 143, .3); } }

  /* Minhas músicas */
  #gaveta { position: fixed; inset: 0; z-index: 20; background: rgba(5,4,15,.7); display: none; justify-content: flex-end; }
  #gaveta.on { display: flex; }
  .gav { width: min(380px, 100%); height: 100%; background: var(--fundo); border-left: 1px solid var(--borda); padding: calc(env(safe-area-inset-top) + 14px) 14px 14px; overflow-y: auto; }
  .gav h2 { font-family: var(--display); font-weight: 400; font-size: 20px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .gav h2 button { background: var(--painel); color: var(--texto); border: 1px solid var(--borda); border-radius: 10px; font-size: 16px; padding: 2px 10px; cursor: pointer; }
  .gav .cartao { max-width: none; margin: 0 0 10px; }
  .gav .capa { width: 60px; height: 60px; font-size: 30px; }
  .vazio { color: var(--apagado); font-weight: 700; text-align: center; margin-top: 30px; }
  .apagar { background: none !important; color: var(--apagado); padding: 6px 8px 4px !important; }
</style>
</head>

  <a href="../index.html">←</a>

<script>
(() => {
const $ = id => document.getElementById(id);
const sorteia = l => l[Math.floor(Math.random() * l.length)];
const semAcento = t => t.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');

// ── Guardado neste aparelho (cada perfil tem o seu) ──
const PERFIL = new URLSearchParams(location.search).get('perfil');
const KEY = 'djMusicas' + (PERFIL ? ':' + PERFIL : '');
let salvas = []; try { salvas = JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) { salvas = []; }
const grava = () => { try { localStorage.setItem(KEY, JSON.stringify(salvas)); } catch (e) { /* cheio */ } };

// ══════════════ TEORIA MUSICAL ══════════════
const ESCALAS = { maior: [0, 2, 4, 5, 7, 9, 11], menor: [0, 2, 3, 5, 7, 8, 10], dorico: [0, 2, 3, 5, 7, 9, 10] };
const PROGRESSOES = {
  maior: [[0, 4, 5, 3], [0, 5, 3, 4], [5, 3, 0, 4], [0, 3, 4, 3]],
  menor: [[0, 5, 2, 6], [0, 3, 4, 0], [0, 6, 5, 4], [5, 6, 0, 0]],
  dorico: [[0, 3, 0, 3], [0, 6, 3, 0]],
};
const hz = n => 130.81 * Math.pow(2, n / 12);   // n = semitons acima do Dó grave
function notaDoGrau(m, grau, oitava) {   // grau da escala (pode passar de 7) -> semitom
  const esc = ESCALAS[m.escala], o = Math.floor(grau / esc.length), g = ((grau % esc.length) + esc.length) % esc.length;
  return m.raiz + esc[g] + 12 * (o + oitava);
}

// ══════════════ ESTILOS ══════════════
// bateria em 16 passos (1 compasso); o baixo segue os passos de "baixoPassos"
const ESTILOS = {
  funk: { nome: 'Funk', palavras: ['funk', 'tamborzao', 'baile', 'favela', 'mc'], bpm: 128, escala: 'menor', lead: 'pluck', pad: true, baixo: '808', voz: true, capa: ['🔥', '#ff5d3a', '#7a1a5a'],
    b: { bumbo: [0, 6, 10], palma: [4, 12], chimbal: [2, 6, 10, 14], tambor: [0, 3, 6, 8, 10, 13] }, baixoPassos: [0, 6, 10] },
  mandelao: { nome: 'Mandelão', palavras: ['mandelao', 'mandela', 'pancadao', 'automotivo'], bpm: 130, escala: 'menor', lead: 'synth', pad: false, baixo: '808', voz: true, capa: ['💣', '#2a2a2a', '#ff2a6a'],
    b: { bumbo: [0, 3, 8, 11], palma: [4, 12], chimbal: [0, 2, 4, 6, 8, 10, 12, 14] }, baixoPassos: [0, 3, 8, 11] },
  rave: { nome: 'Funk Rave', palavras: ['rave', 'balada', 'festa', 'danca', 'dancar', 'dançante', 'dancante'], bpm: 135, escala: 'menor', lead: 'synth', pad: true, baixo: 'synth', voz: true, capa: ['🪩', '#5b2aff', '#ff4fd8'],
    b: { bumbo: [0, 4, 8, 12], palma: [4, 12], chimbal: [2, 6, 10, 14], tambor: [3, 7, 11, 15] }, baixoPassos: [2, 6, 10, 14] },
  trap: { nome: 'Trap', palavras: ['trap', 'rap', 'hip hop', 'hiphop', 'drill'], bpm: 140, escala: 'menor', lead: 'sino', pad: true, baixo: '808', voz: true, capa: ['💎', '#101030', '#3fe0d0'],
    b: { bumbo: [0, 7, 10], caixa: [8], chimbal: [0, 2, 4, 5, 6, 8, 10, 12, 13, 14, 15] }, baixoPassos: [0, 7, 10] },
  eletronica: { nome: 'Eletrônica', palavras: ['eletronica', 'eletro', 'dj', 'edm', 'techno', 'house'], bpm: 126, escala: 'menor', lead: 'synth', pad: true, baixo: 'synth', voz: false, capa: ['⚡', '#0a3aff', '#00e0ff'],
    b: { bumbo: [0, 4, 8, 12], palma: [4, 12], chimbal: [2, 6, 10, 14] }, baixoPassos: [2, 6, 10, 14] },
  rock: { nome: 'Rock', palavras: ['rock', 'guitarra', 'banda', 'metal'], bpm: 122, escala: 'menor', lead: 'guitarra', pad: false, baixo: 'synth', voz: false, capa: ['🎸', '#3a0a0a', '#ff4a2a'],
    b: { bumbo: [0, 8, 10], caixa: [4, 12], chimbal: [0, 2, 4, 6, 8, 10, 12, 14] }, baixoPassos: [0, 2, 8, 10] },
  game: { nome: 'Videogame', palavras: ['game', 'videogame', 'jogo', '8 bit', '8bit', 'pixel', 'fase', 'chefao', 'boss'], bpm: 150, escala: 'maior', lead: 'gamer', pad: false, baixo: 'gamer', voz: false, capa: ['👾', '#1a1a5a', '#5df07a'],
    b: { bumbo: [0, 8], caixa: [4, 12], chimbal: [0, 2, 4, 6, 8, 10, 12, 14] }, baixoPassos: [0, 4, 8, 12] },
  lofi: { nome: 'Lo-fi', palavras: ['lofi', 'lo-fi', 'calma', 'calmo', 'dormir', 'relax', 'relaxar', 'estudar', 'chill', 'tranquilo', 'tranquila'], bpm: 82, escala: 'dorico', lead: 'piano', pad: true, baixo: 'suave', voz: false, capa: ['🌙', '#2a1a4a', '#ff9ab0'],
    b: { bumbo: [0, 7, 10], caixa: [8], chimbal: [0, 4, 8, 12] }, baixoPassos: [0, 10] },
  samba: { nome: 'Samba', palavras: ['samba', 'pagode', 'carnaval', 'cartola', 'pixinguinha', 'choro'], bpm: 100, escala: 'maior', lead: 'cavaco', pad: false, baixo: 'violao7', voz: false, capa: ['🥁', '#0a7a3a', '#ffd23f'],
    b: { bumbo: [4, 12], tambor: [0, 8], palma: [0, 3, 6, 8, 11, 14], chimbal: [0, 2, 4, 6, 8, 10, 12, 14], caixa: [3, 6, 10, 13] }, baixoPassos: [0, 6, 8, 14] },
  bossa: { nome: 'Bossa Nova', palavras: ['bossa', 'jobim', 'ipanema', 'joao gilberto', 'elis', 'aguas de marco'], bpm: 92, escala: 'maior', lead: 'piano', pad: true, baixo: 'suave', voz: false, capa: ['🌴', '#0a5a7a', '#ffb07a'],
    b: { bumbo: [0, 6, 8, 14], caixa: [0, 3, 6, 10, 13], chimbal: [0, 2, 4, 6, 8, 10, 12, 14] }, baixoPassos: [0, 6, 8, 14] },
  forro: { nome: 'Forró', palavras: ['forro', 'baiao', 'xote', 'nordeste', 'sanfona', 'gonzaga', 'asa branca', 'sertao', 'sao joao'], bpm: 118, escala: 'maior', lead: 'sanfona', pad: false, baixo: 'synth', voz: false, capa: ['🪗', '#a85a1a', '#ffd23f'],
    b: { bumbo: [0, 6, 8], tambor: [3, 11], chimbal: [0, 2, 3, 4, 6, 8, 10, 11, 12, 14] }, baixoPassos: [0, 6, 8] },
  mpb: { nome: 'MPB', palavras: ['mpb', 'chico', 'buarque', 'caetano', 'gil', 'brasileira', 'milton'], bpm: 96, escala: 'dorico', lead: 'piano', pad: true, baixo: 'suave', voz: false, capa: ['🇧🇷', '#1a6a3a', '#3a5aaa'],
    b: { bumbo: [0, 7, 10], caixa: [4, 12], chimbal: [0, 2, 4, 6, 8, 10, 12, 14] }, baixoPassos: [0, 7, 10] },
  pop: { nome: 'Pop', palavras: ['pop', 'radio', 'feliz', 'alegre', 'divertido', 'divertida'], bpm: 116, escala: 'maior', lead: 'piano', pad: true, baixo: 'synth', voz: false, capa: ['🌈', '#ff8a3d', '#ff4fd8'],
    b: { bumbo: [0, 8, 11], palma: [4, 12], chimbal: [0, 2, 4, 6, 8, 10, 12, 14] }, baixoPassos: [0, 8, 11] },
};
const TITULOS_A = ['Batida', 'Noite', 'Onda', 'Baile', 'Trovão', 'Vibe', 'Céu', 'Fogo', 'Estrela', 'Rolê', 'Sonho', 'Coração'];
const TITULOS_B = ['do Futuro', 'de Ouro', 'Neon', 'da Madrugada', 'do Dominic', 'da Quebrada', 'do Verão', 'das Estrelas', 'sem Fim', 'do Trovão', 'na Lua', 'de Fogo'];   // servem pra qualquer palavra (sem erro de masculino/feminino)
const CAPAS = { fogo: '🔥', estrela: '⭐', carro: '🏎️', futebol: '⚽', bola: '⚽', coroa: '👑', caveira: '💀', coracao: '❤️', dragao: '🐉', lua: '🌙', sol: '☀️', raio: '⚡', foguete: '🚀', diamante: '💎', robo: '🤖', gato: '🐱', cachorro: '🐶', leao: '🦁', tubarao: '🦈', alien: '👽', ninja: '🥷', dinheiro: '💸', planeta: '🪐', oculos: '😎' };
const HUMOR_NOME = { triste: 'triste', alegre: 'alegre', terror: 'de terror', epico: 'épico' };

// ── Criar uma música ──
function novaMusica(E, humor) {
  const escala = humor === 'triste' ? (E.escala === 'maior' ? 'menor' : E.escala) : humor === 'alegre' ? 'maior' : E.escala;
  const m = {
    estilo: Object.keys(ESTILOS).find(k => ESTILOS[k] === E), humor: humor || '',
    bpm: Math.max(70, Math.min(170, E.bpm + (humor === 'triste' ? -26 : humor === 'terror' ? -14 : humor === 'epico' ? 8 : 0))),
    raiz: Math.floor(Math.random() * 7) - 2, escala, prog: sorteia(PROGRESSOES[escala]),
    lead: E.lead, pad: E.pad || humor === 'triste' || humor === 'epico', baixo: E.baixo,
    bateria: JSON.parse(JSON.stringify(E.b)), baixoPassos: E.baixoPassos.slice(),
    voz: E.voz, palavra: sorteia(['Vai!', 'Ahn!', 'Bora!', 'Uh!', 'Ê!']),
    titulo: sorteia(TITULOS_A) + ' ' + sorteia(TITULOS_B),
    capa: { emoji: E.capa[0], c1: E.capa[1], c2: E.capa[2] },
    pesado: 0,
  };
  if (humor === 'terror') { m.capa = { emoji: '👻', c1: '#0a0a14', c2: '#5a1a7a' }; m.escala = 'menor'; m.prog = [0, 1, 0, 5]; }
  if (humor === 'triste') m.capa = { emoji: '🌧️', c1: '#1a2a4a', c2: '#5a7aaa' };
  fazMelodia(m);
  return m;
}
// Melodia: 4 compassos; um pedacinho que repete com variação, usando as notas do acorde
function fazMelodia(m) {
  const mel = Array(64).fill(null);
  const ritmo = [];   // ritmo do pedacinho (16 passos)
  const dens = m.humor === 'triste' ? 0.32 : m.estilo === 'lofi' ? 0.3 : m.estilo === 'game' ? 0.6 : 0.45;
  for (let p = 0; p < 16; p++) ritmo.push(p === 0 || Math.random() < (p % 4 === 0 ? dens * 1.4 : p % 2 === 0 ? dens : dens * 0.35));
  const motivo = [];
  let g = 2;
  for (let p = 0; p < 16; p++) { motivo.push(g); g = Math.max(-1, Math.min(6, g + sorteia([-1, -1, 1, 1, 0, 2, -2]))); }
  for (let c = 0; c < 4; c++) {
    const acorde = m.prog[c];
    for (let p = 0; p < 16; p++) {
      if (!ritmo[p] || (c === 3 && p > 11 && Math.random() < 0.5)) continue;
      let grau = acorde + motivo[p];
      if (p % 4 === 0) grau = acorde + sorteia([0, 2, 4, 7]);   // no tempo forte: nota do acorde (soa certo)
      if (c % 2 === 1 && p >= 8) grau += sorteia([0, 1, -1]);
      mel[c * 16 + p] = grau;
    }
  }
  m.melodia = mel;
}

// ══════════════ SOM (feito na hora, com eco de estúdio) ══════════════
let ac = null, mestre, eco, ruido;
function audio() {
  if (!ac) {
    ac = new (window.AudioContext || window.webkitAudioContext)();
    const comp = ac.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 4;
    mestre = ac.createGain(); mestre.gain.value = 0.8; mestre.connect(comp); comp.connect(ac.destination);
    // reverb: um "eco de sala" feito de barulhinho que vai sumindo
    const conv = ac.createConvolver(), len = ac.sampleRate * 2.2, ir = ac.createBuffer(2, len, ac.sampleRate);
    for (let ch = 0; ch < 2; ch++) { const d = ir.getChannelData(ch); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3); }
    conv.buffer = ir; eco = ac.createGain(); eco.gain.value = 0.28; eco.connect(conv); conv.connect(mestre);
    ruido = ac.createBuffer(1, ac.sampleRate, ac.sampleRate); const c = ruido.getChannelData(0); for (let i = 0; i < c.length; i++) c[i] = Math.random() * 2 - 1;
  }
  if (ac.state === 'suspended') ac.resume();
  return ac;
}
function env(g, t, a, v, dur) { g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + dur); }
function saida(no, ecoQtd = 0) { no.connect(mestre); if (ecoQtd) { const g = ac.createGain(); g.gain.value = ecoQtd; no.connect(g); g.connect(eco); } }
function osc(tipo, f, t, dur, vol, destino, detune = 0) { const o = ac.createOscillator(); o.type = tipo; o.frequency.value = f; o.detune.value = detune; const g = ac.createGain(); env(g, t, 0.005, vol, dur); o.connect(g); g.connect(destino); o.start(t); o.stop(t + dur + 0.05); return o; }
function tocaBateria(id, t, pesado) {
  if (id === 'bumbo') {
    const o = ac.createOscillator(), g = ac.createGain();
    o.frequency.setValueAtTime(160, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.22);
    g.gain.setValueAtTime(1.1 + pesado * 0.2, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.4);
    o.connect(g); saida(g); o.start(t); o.stop(t + 0.45);
    return;

  return [intro + ' "' + m.titulo + '", ' + (E.nome === 'Bossa Nova' ? 'uma ' : 'um ') + E.nome + (humor ? ' ' + HUMOR_NOME[humor] : '') + '. ' + (m.letra ? 'Coloquei a sua letra 🎤 ' : '') + sorteia(['Se quiser letra, fala: coloca a letra ... (o que você quiser) ✍️', 'Quer mais pesado, mais rápido ou com a voz falando alguma coisa?', 'Se quiser, posso mudar a melodia, o instrumento ou o nome.', 'Gostou? Aperta 💾 Salvar!']), m];
}
let ocupado = false;
// ── Quando o pai colocar a chave, quem cria é o Claude (api/dj); sem chave, é o robozinho daqui ──
let temCerebro = true;   // vira false se o servidor disser que não tem chave
const historico = [];
const n = (v, a, b, d) => { v = Math.round(Number(v)); return Number.isFinite(v) ? Math.max(a, Math.min(b, v)) : d; };
const passos16 = l => Array.isArray(l) ? [...new Set(l.map(x => n(x, 0, 15, -1)).filter(x => x >= 0))] : [];
// O que vem da IA é conferido antes de tocar (nada fora do lugar quebra o som)
function limpaMusica(x) {
  if (!x || typeof x !== 'object') return null;
  const estilo = ESTILOS[x.estilo] ? x.estilo : 'pop';
  const m = novaMusica(ESTILOS[estilo], ['triste', 'alegre', 'terror', 'epico'].includes(x.humor) ? x.humor : '');
  m.titulo = String(x.titulo || m.titulo).slice(0, 40);
  m.bpm = n(x.bpm, 70, 170, m.bpm);
  m.raiz = n(x.raiz, -5, 6, m.raiz);
  if (ESCALAS[x.escala]) m.escala = x.escala;
  if (Array.isArray(x.prog) && x.prog.length >= 4) m.prog = x.prog.slice(0, 4).map(g => n(g, 0, 6, 0));
  if (['piano', 'pluck', 'synth', 'gamer', 'sino', 'guitarra', 'cavaco', 'sanfona'].includes(x.lead)) m.lead = x.lead;
  if (typeof x.pad === 'boolean') m.pad = x.pad;
  if (['808', 'synth', 'suave', 'gamer', 'violao7', ''].includes(x.baixo)) m.baixo = x.baixo;
  m.pesado = n(x.pesado, 0, 3, 0);
  if (x.bateria && typeof x.bateria === 'object') { m.bateria = {}; for (const id of ['bumbo', 'caixa', 'palma', 'chimbal', 'tambor']) { const l = passos16(x.bateria[id]); if (l.length) m.bateria[id] = l; } }
  if (Array.isArray(x.baixoPassos)) m.baixoPassos = passos16(x.baixoPassos);
  if (Array.isArray(x.melodia) && x.melodia.length) { m.melodia = Array(64).fill(null); for (let i = 0; i < 64; i++) { const v = x.melodia[i]; m.melodia[i] = v == null ? null : n(v, -2, 9, null); } }
  m.voz = !!x.voz;
  if (TIPOS_VOZ[x.tipoVoz] || x.tipoVoz === 'dueto') m.tipoVoz = x.tipoVoz;
  if (x.palavra) m.palavra = String(x.palavra).slice(0, 24);
  m.letra = Array.isArray(x.letra) && x.letra.length ? x.letra.slice(0, 8).map(t => String(t).slice(0, 40)).filter(Boolean) : null;
  if (x.capa && typeof x.capa === 'object') {
    const cor = c => /^#[0-9a-f]{6}$/i.test(String(c)) ? c : null;
    m.capa = { emoji: String(x.capa.emoji || m.capa.emoji).slice(0, 8), c1: cor(x.capa.c1) || m.capa.c1, c2: cor(x.capa.c2) || m.capa.c2 };
  }
  m.id = Date.now() + Math.random();
  return m;
}
async function perguntaClaude(texto) {
  if (!temCerebro) return null;
  try {
    const r = await fetch('/api/dj/', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ texto, atual: ultima, historico }) });
    if (!r.ok) return null;
    const d = await r.json();
    if (d.semChave) { temCerebro = false; return null; }
    if (d.limite) return { resposta: 'Ufa, já fiz muita música hoje! 😅 Por enquanto vou usar meu modo simples, tá?', musica: null, simples: true };
    if (!d.resposta && !d.musica) return null;
    return { resposta: d.resposta, musica: limpaMusica(d.musica) };
  } catch (e) { return null; }
}
function pedir(texto) {
  texto = String(texto || '').trim();
  if (!texto || ocupado) return;
  ocupado = true; $('enviar').disabled = true;
  audio();   // o som precisa começar com um toque da pessoa
  msg('eu', texto);
  $('texto').value = '';
  const d = document.createElement('div'); d.className = 'msg ia'; d.innerHTML = '<div class="av">🎧</div><div class="txt digitando"><span></span><span></span><span></span></div>';
  $('conversa').appendChild(d); $('main').scrollTop = $('main').scrollHeight;
  const inicio = Date.now();
  perguntaClaude(texto).then(ia => {
    let resposta, musica;
    if (ia && ia.musica) { resposta = ia.resposta || 'Fiz essa pra você!'; musica = ia.musica; }
    else if (ia && ia.resposta && !ia.simples) { resposta = ia.resposta; musica = null; }   // a IA só respondeu (ex: recusou um pedido)
    else { const r = entende(texto); resposta = (ia && ia.simples ? ia.resposta + '\n' : '') + r[0]; musica = r[1]; }
    historico.push(texto); if (historico.length > 6) historico.shift();
    setTimeout(() => {
      d.remove();
      if (musica) ultima = musica;
      const c = msg('ia', resposta, musica);
      if (musica) toca(musica, c);   // já começa a tocar
      ocupado = false; $('enviar').disabled = false;
    }, Math.max(0, 900 - (Date.now() - inicio)));
  });
}
$('form').addEventListener('submit', e => { e.preventDefault(); pedir($('texto').value); });

// 🎤 Falar em vez de escrever (o celular escuta e escreve pra você)
const Reconhece = window.SpeechRecognition || window.webkitSpeechRecognition;
let ouvindo = null;
$('mic').onclick = () => {
  if (!Reconhece) { msg('ia', 'Esse navegador não consegue me ouvir 😕 Tenta no Google Chrome, ou escreve aí que eu entendo!'); return; }
  if (ouvindo) { ouvindo.stop(); return; }
  const r = new Reconhece();
  r.lang = 'pt-BR'; r.interimResults = true; r.maxAlternatives = 1;
  ouvindo = r;
  $('mic').classList.add('ouvindo'); $('texto').placeholder = 'Pode falar, tô ouvindo... 👂';
  let final = '';
  r.onresult = e => {
    let parcial = '';
    for (const res of e.results) { if (res.isFinal) final = res[0].transcript; else parcial += res[0].transcript; }
    $('texto').value = final || parcial;
  };
  r.onerror = e => { if (e.error === 'not-allowed') msg('ia', 'Preciso que você deixe eu usar o microfone 🎤 Toca em "Permitir" quando o navegador perguntar!'); };
  r.onend = () => {
    if (ac && ac.state !== 'running') ac.resume();   // o celular pausa o som enquanto escuta: volta a tocar
    ouvindo = null; $('mic').classList.remove('ouvindo'); $('texto').placeholder = 'Fale que música você quer...';
    if (final.trim()) pedir(final);   // falou: já manda
  };
  r.start();
};
for (const s of ['🔥 Um funk da hora', '🥁 Um samba', '🌴 Bossa nova', '🪗 Forró', '😢 Música triste', '👾 De videogame', '🌙 Lo-fi pra relaxar', '💎 Trap pesado', '🎲 Me surpreenda']) {
  const b = document.createElement('button'); b.type = 'button'; b.textContent = s; b.onclick = () => pedir(s.replace(/^\S+\s/, '')); $('sugestoes').appendChild(b);
}
msg('ia', 'E aí! Eu sou o DJ IA 🎧\nMe fala que música você quer, do seu jeito. Tipo "um funk da hora", "música triste" ou "trap com a voz falando bora". Pode até mandar a letra: "coloca a letra tananã tananã, pá pá pum". Eu crio e você ouve na hora!');
})();
