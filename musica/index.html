<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#15134a">
<title>Estúdio de Música</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --tinta: #0e0c33; --noite: #15134a; --noite-2: #2a2380; --creme: #fff6dc; --sol: #ffd23f; --rosa: #ff5d8f; --agua: #3fe0d0; --roxo: #b06cff; --verde: #2fd15a;
    --display: 'Bungee', 'Arial Black', Impact, sans-serif; --texto: 'Baloo 2', 'Segoe UI', Arial, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { min-height: 100vh; font-family: var(--texto); color: var(--creme); -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none;
    background: radial-gradient(circle at 50% -10%, var(--noite-2) 0%, transparent 60%), var(--noite); }
  #back-link { position: fixed; top: 10px; left: 10px; z-index: 10; text-decoration: none; font-weight: 800; background: var(--sol); color: var(--tinta);
    border: 3px solid var(--tinta); border-radius: 12px; padding: 4px 12px 2px; box-shadow: 0 4px 0 var(--tinta); }
  .wrap { max-width: 1000px; margin: 0 auto; padding: 56px 10px 40px; }
  h1 { font-family: var(--display); font-weight: 400; text-align: center; font-size: clamp(26px, 6vw, 46px); line-height: 1; transform: rotate(-2deg);
    text-shadow: 3px 3px 0 var(--tinta); }
  h1 span { color: var(--rosa); }
  .sub { text-align: center; font-weight: 700; opacity: .85; margin-top: 6px; }

  /* Visualizador: barrinhas pulando no ritmo */
  #vis { display: flex; align-items: flex-end; justify-content: center; gap: 4px; height: 46px; margin: 10px auto 4px; }
  #vis i { width: 10px; height: 6px; border-radius: 4px; background: var(--agua); transition: height .12s ease-out; }

  .controles { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; align-items: center; margin: 10px 0; }
  .btn { font-family: var(--texto); font-weight: 800; font-size: 16px; cursor: pointer; border: 3px solid var(--tinta); border-radius: 14px; padding: 6px 14px 3px;
    color: var(--tinta); background: var(--creme); box-shadow: 0 4px 0 var(--tinta); }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--tinta); }
  #b-play { background: var(--verde); color: #fff; font-family: var(--display); font-weight: 400; font-size: 20px; padding: 6px 22px 2px; min-width: 150px; }
  #b-play.tocando { background: var(--rosa); }
  .btn.sol { background: var(--sol); } .btn.agua { background: var(--agua); } .btn.roxo { background: var(--roxo); color: #fff; }
  .aviso { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(10, 8, 32, .85); }
  .aviso.fechado { display: none; }
  .aviso-caixa { width: min(380px, 100%); text-align: center; background: var(--noite); border: 4px solid var(--tinta); border-radius: 22px; box-shadow: 0 0 0 4px #ff5d3a, 0 8px 0 var(--tinta); padding: 18px 16px 20px; }
  .aviso-ic { font-size: 54px; line-height: 1; }
  .aviso-caixa h2 { font-family: var(--display); font-weight: 400; font-size: 40px; color: #ff5d3a; text-shadow: 3px 3px 0 var(--tinta); margin: 6px 0 4px; }
  .aviso-caixa p { font-weight: 800; font-size: 18px; margin-bottom: 14px; }
  #b-entendi { background: var(--verde); color: #fff; font-family: var(--display); font-weight: 400; font-size: 20px; padding: 8px 28px 4px; }
  /* Chat do DJ Robô */
  .ia { margin: 14px auto 6px; max-width: 720px; background: rgba(0,0,0,.28); border: 3px solid var(--tinta); border-radius: 20px; padding: 10px; box-shadow: 0 0 0 3px var(--roxo); }
  .ia-topo { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .ia-rosto { font-size: 34px; line-height: 1; animation: ia-pula 1.6s ease-in-out infinite; }
  .ia.pensando .ia-rosto { animation: ia-pensa .5s linear infinite; }
  @keyframes ia-pula { 50% { transform: translateY(-4px); } }
  @keyframes ia-pensa { 50% { transform: rotate(12deg); } }
  .ia-topo b { font-family: var(--display); font-weight: 400; font-size: 20px; color: var(--roxo); display: block; line-height: 1; }
  .ia-topo small { font-weight: 700; opacity: .85; font-size: 13px; }
  .ia-msgs { max-height: 220px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; padding: 2px; }
  .ia-msg { max-width: 88%; padding: 6px 12px 4px; border-radius: 14px; font-weight: 700; font-size: 15px; line-height: 1.3; }
  .ia-msg.robo { align-self: flex-start; background: #2e2366; border: 2px solid #4a3a8a; border-bottom-left-radius: 4px; }
  .ia-msg.eu { align-self: flex-end; background: #1f6a4a; border: 2px solid #2fa070; border-bottom-right-radius: 4px; }
  .ia-sug { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
  .ia-sug button { font-family: var(--texto); font-weight: 800; font-size: 13px; cursor: pointer; border: 2px solid var(--roxo); background: rgba(176,108,255,.15); color: var(--creme); border-radius: 12px; padding: 3px 10px 1px; }
  .ia-form { display: flex; gap: 6px; }
  #ia-input { flex: 1; min-width: 0; padding: 9px 12px; font-size: 16px; border-radius: 14px; border: 3px solid var(--tinta); background: var(--creme); color: var(--tinta); font-family: inherit; font-weight: 700; }
  #ia-manda { background: var(--roxo); color: #fff; font-size: 20px; padding: 2px 16px 0; }
  .modos { display: flex; justify-content: center; gap: 8px; margin-top: 10px; }
  .modo { font-family: var(--display); font-weight: 400; font-size: 15px; cursor: pointer; border: 3px solid rgba(255,255,255,.2); border-radius: 14px; padding: 5px 14px 2px; background: rgba(255,255,255,.07); color: var(--creme); }
  .modo.on { background: var(--sol); color: var(--tinta); border-color: var(--tinta); box-shadow: 0 4px 0 var(--tinta); }
  #m-dificil.on { background: #ff5d3a; color: #fff; }
  .cel.sust { background: rgba(0,0,0,.35); }   /* notas pretas do piano */
  .rotulo.sust .nm { opacity: .75; }
  .velo { display: flex; align-items: center; gap: 6px; font-weight: 800; background: rgba(255,255,255,.08); border-radius: 14px; padding: 4px 12px; }
  .velo input { width: 110px; accent-color: var(--sol); }

  .instrumentos { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin: 4px 0 10px; }
  .inst { font-family: var(--texto); font-weight: 800; font-size: 14px; cursor: pointer; border: 3px solid rgba(255,255,255,.2); border-radius: 12px; padding: 4px 10px 2px;
    background: rgba(255,255,255,.07); color: var(--creme); }
  .inst.on { background: var(--sol); color: var(--tinta); border-color: var(--tinta); box-shadow: 0 3px 0 var(--tinta); }

  /* A grade da música */
  .grade-box { overflow-x: auto; padding: 8px; background: rgba(0,0,0,.25); border: 3px solid var(--tinta); border-radius: 18px; }
  .grade { display: grid; grid-template-columns: 92px repeat(16, minmax(22px, 1fr)); gap: 4px; min-width: 540px; }
  .rotulo { display: flex; align-items: center; gap: 4px; font-weight: 800; font-size: 12px; white-space: nowrap; cursor: pointer; border-radius: 8px; padding: 0 4px; }
  .rotulo .em { font-size: 18px; }
  .rotulo:active { background: rgba(255,255,255,.12); }
  .cel { aspect-ratio: 1; border-radius: 7px; border: 2px solid rgba(255,255,255,.08); background: rgba(255,255,255,.07); cursor: pointer; padding: 0; transition: transform .08s; }
  .cel.batida { background: rgba(255,255,255,.12); }   /* começo de cada grupo de 4 */
  .cel.on { border-color: var(--tinta); box-shadow: inset 0 -3px 0 rgba(0,0,0,.25); }
  .cel.agora { outline: 3px solid #fff; outline-offset: -1px; }
  .cel.toca { transform: scale(1.18); filter: brightness(1.4); }
  .sep { grid-column: 1 / -1; height: 4px; }
  .marca { height: 6px; border-radius: 3px; background: transparent; }
  .marca.agora { background: #fff; }

  .salvas { margin-top: 16px; }
  .salvas h2 { font-family: var(--display); font-weight: 400; font-size: 18px; text-align: center; margin-bottom: 8px; }
  .lista { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .lista:empty::after { content: 'Aperte 💾 SALVAR pra salvar sua música aqui.'; opacity: .7; }
  .musica { display: flex; align-items: center; gap: 6px; background: var(--creme); color: var(--tinta); border: 3px solid var(--tinta); border-radius: 14px; padding: 4px 6px 2px 12px; font-weight: 800; box-shadow: 0 4px 0 var(--tinta); cursor: pointer; }
  .musica button { border: 2px solid var(--tinta); border-radius: 50%; width: 26px; height: 26px; background: var(--rosa); color: #fff; font-weight: 800; cursor: pointer; }
  .dica { text-align: center; font-size: 13px; opacity: .75; margin-top: 10px; }
  #msg { text-align: center; min-height: 22px; font-weight: 800; color: var(--sol); }
  @media (max-width: 560px) {
    .grade { grid-template-columns: 44px repeat(16, minmax(17px, 1fr)); gap: 3px; min-width: 0; }
    .rotulo .nm { display: none; }
    .cel { border-radius: 5px; }
    .btn { font-size: 14px; padding: 5px 10px 2px; }
    #b-play { min-width: 120px; font-size: 17px; }
  }
</style>
</head>
<body>
<a href="../index.html" id="back-link">← Menu</a>
<div class="wrap">
  <h1>🎵 ESTÚDIO DE <span>MÚSICA</span></h1>
  <p class="sub">🔥 Aqui é você que faz tudo. Capricha!</p>
  <div class="modos" style="display:none"><button class="modo" id="m-facil">😊 FÁCIL</button><button class="modo" id="m-dificil">🔥 DIFÍCIL</button></div>
  <div class="aviso" id="aviso">
    <div class="aviso-caixa">
      <div class="aviso-ic">⚠️</div>
      <h2>DIFÍCIL</h2>
      <p>Recomendado jogar com os pais 👨‍👦</p>
      <button class="btn" id="b-entendi">ENTENDI</button>
    </div>
  </div>
  <div class="ia">
    <div class="ia-topo"><span class="ia-rosto">🤖</span><div><b>DJ ROBÔ</b><small>Fala o que você quer, do seu jeito. Eu faço a música!</small></div></div>
    <div class="ia-msgs" id="ia-msgs"></div>
    <div class="ia-sug" id="ia-sug"></div>
    <form class="ia-form" id="ia-form" autocomplete="off">
      <input id="ia-input" maxlength="160" placeholder="Ex: faz um funk pesado com a voz falando bora">
      <button class="btn" id="ia-manda" aria-label="Mandar">➤</button>
    </form>
  </div>
  <div id="vis"></div>

  <div class="controles">
    <button class="btn" id="b-play">▶ TOCAR</button>
    <label class="velo">🐢 <input type="range" id="tempo" min="70" max="170" value="110"> 🐇</label>
  </div>
  <div class="controles">
    <button class="btn sol" id="b-sorteia">🎲 SURPRESA</button>
    <button class="btn agua" id="b-ritmo">🥁 RITMOS</button>
    <button class="btn roxo" id="b-guarda">💾 SALVAR</button>
    <button class="btn" id="b-limpa">🧽 LIMPAR</button>
  </div>
  <div class="instrumentos" id="insts"></div>
  <div id="msg"></div>

  <div class="grade-box"><div class="grade" id="grade"></div></div>
  <p class="dica">Dica: toque no nome da linha pra ouvir o som dela. No 🎤, toque pra trocar o que a voz fala!</p>

  <div class="salvas">
    <h2>⭐ MINHAS MÚSICAS</h2>
    <div class="lista" id="lista"></div>
  </div>
</div>

<script>
(() => {
const $ = id => document.getElementById(id);
let PASSOS = 16;   // 16 no fácil, 32 no difícil

// ── As linhas: 4 de bateria e 8 notas (escala pentatônica: sempre fica bonito junto) ──
const BATERIA = [
  { id: 'bumbo',   nome: 'Bumbo',   em: '🥁', cor: '#ff5d5d' },
  { id: 'caixa',   nome: 'Caixa',   em: '💥', cor: '#ff9a3d' },
  { id: 'palma',   nome: 'Palmas',  em: '👏', cor: '#ffd23f' },
  { id: 'chimbal', nome: 'Chimbal', em: '🔔', cor: '#9be36a' },
  { id: 'tambor',  nome: 'Tamborzão', em: '🪘', cor: '#e0a35a' },
  { id: 'grave',   nome: 'Grave 808', em: '🔊', cor: '#ff3b8a' },
  { id: 'voz',     nome: 'Voz',     em: '🎤', cor: '#5cb8ff' },
];
// O que a voz fala (toque no 🎤 pra trocar)
const FALAS = ['Vai!', 'Ahn!', 'Uh!', 'Ê!', 'Tá tá!', 'Joga!', 'Dominic!'];
let fala = 0;
const NOTAS = [   // de cima (mais aguda) pra baixo
  { nome: 'Lá',  f: 880.00 }, { nome: 'Sol', f: 783.99 }, { nome: 'Mi', f: 659.25 }, { nome: 'Ré', f: 587.33 },
  { nome: 'Dó',  f: 523.25 }, { nome: 'Lá',  f: 440.00 }, { nome: 'Sol', f: 392.00 }, { nome: 'Mi', f: 329.63 },
];
const CORES_NOTAS = ['#ff5dc8', '#c46bff', '#8a7bff', '#5cb8ff', '#3fe0d0', '#4fe08a', '#a6e84a', '#ffd23f'];
// Difícil: as 13 notas do piano, com as pretas (pode ficar feio se errar!)
const NOMES_CROMA = ['Dó', 'Si', 'Lá#', 'Lá', 'Sol#', 'Sol', 'Fá#', 'Fá', 'Mi', 'Ré#', 'Ré', 'Dó#', 'Dó'];
const NOTAS_DIFICIL = NOMES_CROMA.map((nome, i) => ({ nome, f: 1046.5 / Math.pow(2, i / 12), sust: nome.includes('#') }));
const corDificil = i => `hsl(${(i * 26) % 360} 80% 62%)`;
const LINHAS_DE = {
  facil: [...BATERIA.map(b => ({ ...b, tipo: 'bateria' })), ...NOTAS.map((n, i) => ({ id: 'n' + i, nome: n.nome, em: '🎵', cor: CORES_NOTAS[i], tipo: 'nota', f: n.f }))],
  dificil: [...BATERIA.map(b => ({ ...b, tipo: 'bateria' })), ...NOTAS_DIFICIL.map((n, i) => ({ id: 'd' + i, nome: n.nome, em: '🎵', cor: corDificil(i), tipo: 'nota', f: n.f, sust: n.sust }))],
};
const PASSOS_DE = { facil: 16, dificil: 32 };
let modo = 'dificil';
let LINHAS = LINHAS_DE.facil;

const INSTRUMENTOS = [
  { id: 'piano',  nome: '🎹 Piano',   onda: 'triangle', ataque: 0.005, dura: 0.6 },
  { id: 'gamer',  nome: '👾 8-bit',   onda: 'square',   ataque: 0.002, dura: 0.25 },
  { id: 'flauta', nome: '🪈 Flauta',  onda: 'sine',     ataque: 0.04,  dura: 0.45 },
  { id: 'synth',  nome: '🎛️ Synth',   onda: 'sawtooth', ataque: 0.01,  dura: 0.35 },
  { id: 'sino',   nome: '🔔 Sininho', onda: 'sine',     ataque: 0.001, dura: 1.0, sino: true },
];

// ── Guardado neste aparelho (cada perfil tem o seu) ──
const PERFIL = new URLSearchParams(location.search).get('perfil');
const KEY = 'estudioMusica' + (PERFIL ? ':' + PERFIL : '');
const ler = (d) => { try { return JSON.parse(localStorage.getItem(KEY)) || d; } catch (e) { return d; } };
const grava = v => { try { localStorage.setItem(KEY, JSON.stringify(v)); } catch (e) { /* ok */ } };
const dados = ler({ salvas: [], atual: null });
const ajeita = g => { if (g && g.length === 12) g.splice(4, 0, ...[0, 1, 2].map(() => Array(PASSOS).fill(false))); return g; };
if (dados.atual) ajeita(dados.atual.grade);
dados.salvas.forEach(m => ajeita(m.grade));
fala = dados.fala || 0;
let falaCustom = dados.falaCustom || '';   // o que o DJ Robô mandou a voz falar

// dados.atual = a música do fácil; dados.dificil = a do difícil
modo = dados.modo || 'dificil';
let grade = [], inst = 'piano';
function carregaModo() {
  LINHAS = LINHAS_DE[modo]; PASSOS = PASSOS_DE[modo];
  const a = modo === 'facil' ? dados.atual : dados.dificil;
  grade = a && a.grade && a.grade.length === LINHAS.length && a.grade[0].length === PASSOS ? a.grade : LINHAS.map(() => Array(PASSOS).fill(false));
  inst = a && a.inst || 'piano';
  $('tempo').value = a && a.bpm || 110;
  document.body.classList.toggle('dificil', modo === 'dificil');
  $('m-facil').classList.toggle('on', modo === 'facil'); $('m-dificil').classList.toggle('on', modo === 'dificil');
  $('b-sorteia').style.display = $('b-ritmo').style.display = modo === 'dificil' ? 'none' : '';   // no difícil você faz tudo sozinho
}
const guardaAtual = () => {
  const v = { grade, inst, bpm: +$('tempo').value };
  if (modo === 'facil') dados.atual = v; else dados.dificil = v;
  dados.modo = modo; dados.fala = fala; dados.falaCustom = falaCustom; grava(dados);
};

// ══════════════ SONS (feitos na hora) ══════════════
let ac = null, mestre = null, ruido = null;
function audio() {
  if (!ac) {
    ac = new (window.AudioContext || window.webkitAudioContext)();
    mestre = ac.createGain(); mestre.gain.value = 0.7;
    const comp = ac.createDynamicsCompressor();
    mestre.connect(comp); comp.connect(ac.destination);
    ruido = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
    const c = ruido.getChannelData(0); for (let i = 0; i < c.length; i++) c[i] = Math.random() * 2 - 1;
  }
  if (ac.state === 'suspended') ac.resume();
  return ac;
}
function falar(atraso) {
  if (!window.speechSynthesis) return;
  const dizer = () => {
    const u = new SpeechSynthesisUtterance(falaCustom || FALAS[fala]);
    u.lang = 'pt-BR'; u.rate = 1.5; u.pitch = 0.9; u.volume = 1;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  };
  atraso > 10 ? setTimeout(dizer, atraso) : dizer();
}
function tocaBateria(id, t, passoN) {
  const a = audio(); t = t || a.currentTime;
  if (id === 'voz') { falar((t - a.currentTime) * 1000); return; }
  if (id === 'tambor') {   // tamborzão: dois tambores, um grave e um agudo
    const agudo = (passoN || 0) % 2 === 1;
    const o = a.createOscillator(), g = a.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(agudo ? 260 : 170, t); o.frequency.exponentialRampToValueAtTime(agudo ? 180 : 95, t + 0.18);
    g.gain.setValueAtTime(0.9, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.22);
    o.connect(g); g.connect(mestre); o.start(t); o.stop(t + 0.25);
    const n = a.createBufferSource(), f = a.createBiquadFilter(), g2 = a.createGain();
    n.buffer = ruido; f.type = 'bandpass'; f.frequency.value = 900; g2.gain.setValueAtTime(0.25, t); g2.gain.exponentialRampToValueAtTime(0.001, t + 0.03);
    n.connect(f); f.connect(g2); g2.connect(mestre); n.start(t); n.stop(t + 0.04);
    return;
  }
  if (id === 'grave') {   // 808: grave comprido que treme
    const o = a.createOscillator(), g = a.createGain(), sat = a.createWaveShaper();
    const curva = new Float32Array(256); for (let i = 0; i < 256; i++) { const x = i / 128 - 1; curva[i] = Math.tanh(x * 2.5); }
    sat.curve = curva;
    o.type = 'sine';
    o.frequency.setValueAtTime(90, t); o.frequency.exponentialRampToValueAtTime(48, t + 0.12);
    g.gain.setValueAtTime(0.9, t); g.gain.setValueAtTime(0.85, t + 0.25); g.gain.exponentialRampToValueAtTime(0.001, t + 0.7);
    o.connect(sat); sat.connect(g); g.connect(mestre); o.start(t); o.stop(t + 0.75);
    return;
  }
  if (id === 'bumbo') {
    const o = a.createOscillator(), g = a.createGain();
    o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(40, t + 0.25);
    g.gain.setValueAtTime(1, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.35);
    o.connect(g); g.connect(mestre); o.start(t); o.stop(t + 0.4);
  } else {
    const n = a.createBufferSource(); n.buffer = ruido;
    const f = a.createBiquadFilter(), g = a.createGain();
    const dur = { caixa: 0.18, palma: 0.22, chimbal: 0.05 }[id];
    f.type = id === 'chimbal' ? 'highpass' : 'bandpass';
    f.frequency.value = { caixa: 1800, palma: 1200, chimbal: 7000 }[id];
    g.gain.setValueAtTime(id === 'chimbal' ? 0.35 : 0.8, t);
    if (id === 'palma') { g.gain.setValueAtTime(0.8, t); g.gain.setValueAtTime(0.2, t + 0.01); g.gain.setValueAtTime(0.8, t + 0.02); g.gain.setValueAtTime(0.2, t + 0.03); g.gain.setValueAtTime(0.7, t + 0.04); }
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    n.connect(f); f.connect(g); g.connect(mestre); n.start(t); n.stop(t + dur + 0.02);
    if (id === 'caixa') { const o = a.createOscillator(), g2 = a.createGain(); o.frequency.value = 190; g2.gain.setValueAtTime(0.5, t); g2.gain.exponentialRampToValueAtTime(0.001, t + 0.1); o.connect(g2); g2.connect(mestre); o.start(t); o.stop(t + 0.12); }
  }
}

    feito.push('Fiz ' + (E.nome.startsWith('música') ? 'uma ' : 'um ') + E.nome + (humor ? ' ' + humor : '') + ' a ' + $('tempo').value + ' BPM');
    if (tem('pesad', 'grave', 'estoura', 'treme')) { const gv = linha('grave'), bb = linha('bumbo'); for (let p = 0; p < PASSOS; p++) if (grade[bb][p]) grade[gv][p] = true; feito.push('bem pesado com grave 808 🔊'); }
  }
  // ajustes na música de agora
  if (tem('mais rapido', 'acelera', 'rapidao', 'mais rapida')) { $('tempo').value = Math.min(170, +$('tempo').value + 15); feito.push('deixei mais rápido (' + $('tempo').value + ' BPM)'); mexeu = true; }
  if (tem('mais devagar', 'mais lento', 'mais lenta', 'devagarinho')) { $('tempo').value = Math.max(70, +$('tempo').value - 15); feito.push('deixei mais devagar (' + $('tempo').value + ' BPM)'); mexeu = true; }
  if (!nova && tem('mais pesad', 'mais grave', 'pesad', 'treme', 'estoura')) { const gv = linha('grave'), bb = linha('bumbo'); for (let p = 0; p < PASSOS; p++) if (grade[bb][p]) grade[gv][p] = true; for (const p of [0, 16].filter(p => p < PASSOS)) grade[bb][p + 3] = true; feito.push('coloquei mais grave 808 🔊'); mexeu = true; }
  if (tem('mais leve', 'suave', 'menos grave', 'tira o grave', 'sem grave')) { grade[linha('grave')] = Array(PASSOS).fill(false); feito.push('tirei o grave'); mexeu = true; }
  if (tem('tamborzao', 'tambor') && !nova) { const tb = linha('tambor'); for (let r = 0; r < PASSOS / 16; r++) for (const p of [0, 3, 6, 8, 10, 13]) grade[tb][r * 16 + p] = true; feito.push('coloquei tamborzão 🪘'); mexeu = true; }
  if (tem('palma') && !nova) { const pl = linha('palma'); for (let p = 4; p < PASSOS; p += 8) grade[pl][p] = true; feito.push('coloquei palmas 👏'); mexeu = true; }
  if (tem('sem voz', 'tira a voz', 'sem a voz')) { grade[linha('voz')] = Array(PASSOS).fill(false); feito.push('tirei a voz'); mexeu = true; }
  if (palavra) {
    falaCustom = palavra.slice(0, 20);
    const vz = linha('voz'); if (!grade[vz].some(Boolean)) pVoz(null, true);
    feito.push('a voz agora fala "' + falaCustom + '" 🎤'); mexeu = true;
  }
  if (tem('muda a melodia', 'troca a melodia', 'outra melodia', 'melodia nova')) { pMelodia(escala || (estiloIA && estiloIA.escala) || 'penta', 0.6); feito.push('fiz uma melodia nova 🎵'); mexeu = true; }
  if (tem('sem bateria', 'tira a bateria')) { for (const L of LINHAS) if (L.tipo === 'bateria' && L.id !== 'voz') grade[linha(L.id)] = Array(PASSOS).fill(false); feito.push('tirei a bateria'); mexeu = true; }
  if (tem('so bateria', 'sem melodia', 'tira a melodia', 'sem nota')) { for (const L of LINHAS) if (L.tipo === 'nota') grade[LINHAS.indexOf(L)] = Array(PASSOS).fill(false); feito.push('deixei só a batida'); mexeu = true; }
  for (const [p, id, nome] of [['piano', 'piano', 'piano 🎹'], ['8 bit', 'gamer', '8-bit 👾'], ['8bit', 'gamer', '8-bit 👾'], ['flauta', 'flauta', 'flauta 🪈'], ['synth', 'synth', 'synth 🎛️'], ['sintetiz', 'synth', 'synth 🎛️'], ['sino', 'sino', 'sininho 🔔']])
    if (t.includes(p) && !nova) { inst = id; feito.push('troquei pro ' + nome); mexeu = true; break; }
  if (tem('limpa', 'apaga tudo', 'zera')) { grade = LINHAS.map(() => Array(PASSOS).fill(false)); feito.length = 0; feito.push('apaguei tudo, tá limpinho'); mexeu = true; tituloIA = ''; }
  if (tem('para de', 'pare', 'chega', 'stop', 'desliga') && !mexeu) { if (tocando) stop(); return 'Parei a música! ⏹ Quando quiser, é só pedir de novo.'; }
  if (tem('nome', 'titulo') && !nova) { tituloIA = sorteia(TITULOS_A) + ' ' + sorteia(TITULOS_B); return 'Que tal o nome "' + tituloIA + '"? 😎 Aperte 💾 SALVAR que ela fica guardada com esse nome.'; }
  if (!mexeu) {
    // não entendeu: faz alguma coisa mesmo assim
    return cerebro('faz uma música');
  }
  monta(); montaInstrumentos(); guardaAtual();
  if (tocando) { stop(); } play();
  let resposta = feito.join(', ') + '! ';
  if (nova) resposta += 'O nome dela é "' + tituloIA + '". ';
  resposta += sorteia(['Quer mais pesado? Mais rápido? Com voz falando alguma coisa?', 'Gostou? Fala o que mudar!', 'Ficou da hora? Posso deixar mais grave, mais rápido ou trocar o instrumento.', 'Quer que a voz fale alguma coisa? É só pedir: fala "bora"!']);
  return resposta.charAt(0).toUpperCase() + resposta.slice(1);
}
function pedir(txt) {
  txt = String(txt || '').trim();
  if (!txt) return;
  falaEu(txt);
  $('ia-input').value = '';
  $('ia-msgs').closest('.ia').classList.add('pensando');
  setTimeout(() => { $('ia-msgs').closest('.ia').classList.remove('pensando'); falaRobo(cerebro(txt)); }, 650);
}
$('ia-form').addEventListener('submit', e => { e.preventDefault(); pedir($('ia-input').value); });
for (const sug of ['Faz um funk pesado 🔥', 'Música triste 😢', 'De videogame 👾', 'Trap com voz falando "bora"', 'Mais rápido 🐇', 'Muda a melodia 🎵', 'Música de terror 👻', 'Me surpreenda 🎲']) {
  const b = document.createElement('button'); b.type = 'button'; b.textContent = sug; b.onclick = () => pedir(sug.replace(/[^\p{L}\p{N}"\s]/gu, '').trim()); $('ia-sug').appendChild(b);
}
falaRobo('Oi! Eu sou o DJ ROBÔ 🤖🎧 Me fala que música você quer, do seu jeito! Pode ser "funk pesado", "música triste", "de videogame"... ou toca num botão aí embaixo.');

modo = 'dificil';   // agora o estúdio é só no difícil
carregaModo();
$('b-entendi').onclick = () => $('aviso').classList.add('fechado');
monta();
montaInstrumentos();
lista();
// primeira vez no fácil: já começa com um ritmo pra brincar
if (modo === 'facil' && !dados.atual) { aplicaRitmo(RITMOS[0]); pintaTudo(); }
})();
</script>
