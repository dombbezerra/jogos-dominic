<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0e0c33">
<title>Juiz 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root { --tinta: #0e0c33; --creme: #fff6dc; --sol: #ffd23f; --rosa: #ff5d8f; --verde: #2fd15a; --agua: #3fe0d0;
    --display: 'Bungee', 'Arial Black', Impact, sans-serif; --texto: 'Baloo 2', 'Segoe UI', Arial, sans-serif; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: #0e0c33; color: var(--creme); font-family: var(--texto); -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; touch-action: none; }
  canvas { display: block; }
  #back-link { position: fixed; top: calc(env(safe-area-inset-top) + 10px); left: 10px; z-index: 30; text-decoration: none; font-weight: 800; background: var(--sol); color: var(--tinta); border: 3px solid var(--tinta); border-radius: 12px; padding: 4px 12px 2px; box-shadow: 0 4px 0 var(--tinta); }
  body.jogando #back-link { display: none; }
  .tela { position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 60px 16px 20px; text-align: center; overflow-y: auto; }
  .tela.hidden { display: none; }
  #menu { background: radial-gradient(circle at 50% 30%, #1f7a3a 0%, #0e3a1e 60%, #06180c 100%); }
  h1 { font-family: var(--display); font-weight: 400; font-size: clamp(34px, 9vw, 70px); line-height: .95; text-shadow: 4px 4px 0 var(--tinta); transform: rotate(-3deg); }
  h1 span { color: var(--sol); display: block; font-size: .6em; }
  .sub { font-weight: 700; margin-top: 10px; opacity: .9; max-width: 520px; }
  .btn { font-family: var(--texto); font-weight: 800; font-size: 18px; cursor: pointer; border: 3px solid var(--tinta); border-radius: 16px; padding: 10px 24px 7px; color: var(--tinta); background: var(--creme); box-shadow: 0 5px 0 var(--tinta); }
  .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--tinta); }
  .btn.grande { font-family: var(--display); font-weight: 400; font-size: clamp(22px, 5vw, 30px); background: var(--verde); color: #fff; padding: 10px 40px 6px; margin-top: 16px; }
  .carreira { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; margin-top: 16px; }
  .etapa { background: rgba(0,0,0,.3); border: 3px solid rgba(255,255,255,.2); border-radius: 14px; padding: 6px 10px 4px; font-weight: 800; font-size: 13px; min-width: 90px; }
  .etapa.on { background: var(--sol); color: var(--tinta); border-color: var(--tinta); }
  .etapa.trava { opacity: .45; }
  .etapa b { display: block; font-size: 22px; }
  .dica { font-size: 13px; opacity: .8; margin-top: 12px; max-width: 520px; }

  /* Placar e avisos */
  #hud { position: fixed; top: calc(env(safe-area-inset-top) + 8px); left: 50%; transform: translateX(-50%); z-index: 10; display: none; gap: 8px; align-items: center; }
  body.jogando #hud { display: flex; }
  .placar { background: var(--tinta); border: 3px solid #fff; border-radius: 12px; padding: 3px 12px 1px; font-family: var(--display); font-size: 18px; white-space: nowrap; }
  .placar .a { color: #ff5d5d; } .placar .b { color: #5cb8ff; }
  .pill { background: rgba(14,12,51,.85); border: 2px solid rgba(255,255,255,.3); border-radius: 10px; padding: 2px 10px 0; font-weight: 800; white-space: nowrap; }
  #aviso { position: fixed; left: 50%; top: 22%; transform: translateX(-50%); z-index: 12; font-family: var(--display); font-size: clamp(26px, 7vw, 48px); text-shadow: 3px 3px 0 var(--tinta); text-align: center; pointer-events: none; opacity: 0; transition: opacity .25s; white-space: nowrap; }
  #aviso.on { opacity: 1; }
  #aviso small { display: block; font-family: var(--texto); font-weight: 800; font-size: 18px; }
  #longe { position: fixed; left: 50%; bottom: 120px; transform: translateX(-50%); z-index: 11; background: rgba(255,80,80,.85); color: #fff; font-weight: 800; padding: 3px 12px 1px; border-radius: 10px; display: none; }

  /* Decisão */
  #decisao { position: fixed; left: 0; right: 0; bottom: 0; z-index: 15; padding: 12px 10px calc(env(safe-area-inset-bottom) + 14px); background: linear-gradient(transparent, rgba(5,5,20,.9) 30%); display: none; text-align: center; }
  #decisao.on { display: block; }
  #decisao h2 { font-family: var(--display); font-weight: 400; font-size: clamp(20px, 5vw, 30px); color: var(--sol); text-shadow: 3px 3px 0 var(--tinta); margin-bottom: 8px; }
  .opcoes { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .op { font-family: var(--texto); font-weight: 800; font-size: 17px; cursor: pointer; border: 3px solid var(--tinta); border-radius: 14px; padding: 9px 14px 6px; box-shadow: 0 5px 0 var(--tinta); min-width: 104px; }
  .op:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--tinta); }
  .op.siga { background: #e6edf5; color: var(--tinta); } .op.falta { background: #5cb8ff; color: var(--tinta); }
  .op.amarelo { background: #ffd23f; color: var(--tinta); } .op.vermelho { background: #ff3b3b; color: #fff; } .op.penalti { background: #2fd15a; color: #fff; }
  #replay { margin-top: 8px; font-weight: 800; font-size: 14px; background: none; border: 2px solid rgba(255,255,255,.5); color: #fff; border-radius: 10px; padding: 3px 12px 1px; cursor: pointer; font-family: inherit; }

  /* Celular */
  #toque { position: fixed; inset: 0; z-index: 9; pointer-events: none; display: none; }
  body.touch.jogando #toque { display: block; }
  #stick { position: absolute; left: calc(env(safe-area-inset-left) + 22px); bottom: calc(env(safe-area-inset-bottom) + 26px); width: 130px; height: 130px; border-radius: 50%; background: rgba(255,255,255,.12); border: 3px solid rgba(255,255,255,.4); pointer-events: auto; }
  #knob { position: absolute; left: 50%; top: 50%; width: 56px; height: 56px; margin: -28px 0 0 -28px; border-radius: 50%; background: rgba(255,255,255,.55); }
  #correr { position: absolute; right: calc(env(safe-area-inset-right) + 24px); bottom: calc(env(safe-area-inset-bottom) + 40px); width: 96px; height: 96px; border-radius: 50%; border: 4px solid var(--tinta); background: var(--sol); color: var(--tinta); font-family: var(--display); font-size: 15px; pointer-events: auto; box-shadow: 0 5px 0 var(--tinta); }
  #correr.on { transform: translateY(4px); box-shadow: 0 1px 0 var(--tinta); }
  #fim { background: rgba(5,5,20,.88); }
  #fim h2 { font-family: var(--display); font-weight: 400; font-size: clamp(28px, 7vw, 50px); color: var(--sol); text-shadow: 3px 3px 0 var(--tinta); }
  .nota { font-family: var(--display); font-size: 70px; line-height: 1; margin: 6px 0; }
  #fim p { font-weight: 800; font-size: 17px; margin: 3px 0; }
  .botoes { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 14px; }
</style>
</head>
<body>
<a href="../index.html" id="back-link">← Menu</a>
<div id="hud"><span class="placar"><span class="a">🔴 <b id="ga">0</b></span> x <span class="b"><b id="gb">0</b> 🔵</span></span><span class="pill">⏱ <b id="tempo">3:00</b></span><span class="pill">✅ <b id="acertos">0</b></span></div>
<div id="aviso"></div>
<div id="longe">📏 Chegue mais perto do lance!</div>
<div id="decisao"><h2>🧑‍⚖️ O QUE VOCÊ MARCA?</h2><div class="opcoes" id="opcoes"></div><button id="replay">🔁 Ver de novo</button></div>
<div id="toque"><div id="stick"><div id="knob"></div></div><button id="correr">CORRER</button></div>

<div class="tela" id="menu">
  <h1>JUIZ<span>DE FUTEBOL 3D</span></h1>
  <p class="sub">Você é o juiz! Corra atrás do lance e decida: falta, cartão, pênalti... ou foi cai-cai? 🎭</p>
  <div class="carreira" id="carreira"></div>
  <button class="btn grande" id="b-jogar">APITAR! 📣</button>
  <p class="dica" id="dica"></p>
</div>
<div class="tela hidden" id="fim">
  <h2 id="fim-titulo">FIM DE JOGO</h2>
  <div class="nota" id="fim-nota">10</div>
  <p id="fim-info"></p>
  <p id="fim-msg"></p>
  <div class="botoes"><button class="btn" id="b-menu">MENU</button><button class="btn grande" id="b-denovo" style="margin-top:0">DE NOVO</button></div>
</div>

<script src="../mundo-blocos/three.min.js"></script>
<script>
(() => {
const $ = id => document.getElementById(id);
const sorteia = l => l[Math.floor(Math.random() * l.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const TOUCH = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
if (TOUCH) document.body.classList.add('touch');
$('dica').textContent = TOUCH ? 'Mexa o juiz com o joystick. Segure CORRER pra correr mais rápido.' : 'Mexa o juiz com as setas ou W A S D. Segure Shift pra correr.';

// ── Carreira (guardada por perfil) ──
const PERFIL = new URLSearchParams(location.search).get('perfil');
const KEY = 'juiz3d' + (PERFIL ? ':' + PERFIL : '');
let save; try { save = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { save = {}; }
save = Object.assign({ liberado: 0, escolhido: 0, melhores: {} }, save);
const isAdm = (() => { try { const m = JSON.parse(localStorage.getItem('aventuraConta' + (PERFIL ? ':' + PERFIL : ''))); return ['endrick', 'dominic'].includes(String(m && m.user && m.user.nome || '').trim().toLowerCase()); } catch (e) { return false; } })();
if (isAdm) save.liberado = 4;   // ADM: carreira toda liberada
const grava = () => { try { localStorage.setItem(KEY, JSON.stringify(save)); } catch (e) { /* ok */ } };
const ETAPAS = [
  { nome: 'Várzea', ic: '🌳', torcida: 0.25, vel: 0.85, lances: 6, precisa: 6 },
  { nome: 'Estadual', ic: '🏟️', torcida: 0.5, vel: 0.95, lances: 7, precisa: 6.5 },
  { nome: 'Brasileirão', ic: '🇧🇷', torcida: 0.75, vel: 1.05, lances: 8, precisa: 7 },
  { nome: 'Libertadores', ic: '🏆', torcida: 0.9, vel: 1.12, lances: 9, precisa: 7.5 },
  { nome: 'Copa do Mundo', ic: '🌍', torcida: 1, vel: 1.2, lances: 10, precisa: 8 },
];
function mostraCarreira() {
  const c = $('carreira'); c.innerHTML = '';
  ETAPAS.forEach((e, i) => {
    const d = document.createElement('button');
    d.className = 'etapa' + (i === save.escolhido ? ' on' : '') + (i > save.liberado ? ' trava' : '');
    d.innerHTML = '<b></b><span></span>';
    d.querySelector('b').textContent = i > save.liberado ? '🔒' : e.ic;
    d.querySelector('span').textContent = e.nome + (save.melhores[i] != null ? ' · ' + save.melhores[i] : '');
    d.onclick = () => { if (i > save.liberado) { $('dica').textContent = 'Tire nota ' + ETAPAS[i - 1].precisa + ' ou mais na ' + ETAPAS[i - 1].nome + ' pra liberar!'; return; } save.escolhido = i; grava(); mostraCarreira(); };
    c.appendChild(d);
  });
}

// ══════════════ 3D ══════════════
const renderer = new THREE.WebGLRenderer({ antialias: !TOUCH });
renderer.setPixelRatio(Math.min(2, devicePixelRatio || 1));
renderer.shadowMap.enabled = !TOUCH;
document.body.appendChild(renderer.domElement);
const cena = new THREE.Scene();
cena.background = new THREE.Color('#7fc8ff');
cena.fog = new THREE.Fog('#7fc8ff', 120, 220);
const camera = new THREE.PerspectiveCamera(48, 1, 0.5, 400);
function ajusta() { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
addEventListener('resize', ajusta); ajusta();
cena.add(new THREE.HemisphereLight('#ffffff', '#3a6a3a', 0.9));
const sol = new THREE.DirectionalLight('#ffffff', 1.1);
sol.position.set(30, 60, 20); sol.castShadow = !TOUCH;
sol.shadow.camera.left = -60; sol.shadow.camera.right = 60; sol.shadow.camera.top = 40; sol.shadow.camera.bottom = -40; sol.shadow.mapSize.set(1024, 1024);
cena.add(sol);

// Campo: 100 x 64, com listras e linhas desenhadas numa textura
const CW = 100, CH = 64;
(() => {
  const cv = document.createElement('canvas'); cv.width = 1000; cv.height = 640;
  const g = cv.getContext('2d');
  for (let i = 0; i < 10; i++) { g.fillStyle = i % 2 ? '#3a9a48' : '#33893f'; g.fillRect(i * 100, 0, 100, 640); }
  g.strokeStyle = '#fff'; g.lineWidth = 5;
  g.strokeRect(20, 20, 960, 600); g.beginPath(); g.moveTo(500, 20); g.lineTo(500, 620); g.stroke();
  g.beginPath(); g.arc(500, 320, 90, 0, 7); g.stroke();
  for (const x of [20, 980]) { const d = x === 20 ? 1 : -1; g.strokeRect(Math.min(x, x + d * 165), 320 - 200, 165, 400); g.strokeRect(Math.min(x, x + d * 55), 320 - 90, 55, 180); g.beginPath(); g.arc(x + d * 110, 320, 6, 0, 7); g.fillStyle = '#fff'; g.fill(); }
  const tx = new THREE.CanvasTexture(cv); tx.anisotropy = 4;
  const campo = new THREE.Mesh(new THREE.PlaneGeometry(CW + 4, CH + 4), new THREE.MeshLambertMaterial({ map: tx }));
  campo.rotation.x = -Math.PI / 2; campo.receiveShadow = true; cena.add(campo);
  const fora = new THREE.Mesh(new THREE.PlaneGeometry(180, 140), new THREE.MeshLambertMaterial({ color: '#2a6a32' }));
  fora.rotation.x = -Math.PI / 2; fora.position.y = -0.05; cena.add(fora);
})();
// Gols
function gol(x) {
  const g = new THREE.Group(), m = new THREE.MeshLambertMaterial({ color: '#ffffff' });
  for (const z of [-3.7, 3.7]) { const p = new THREE.Mesh(new THREE.BoxGeometry(0.3, 2.6, 0.3), m); p.position.set(0, 1.3, z); g.add(p); }
  const t = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.3, 7.7), m); t.position.y = 2.6; g.add(t);
  const rede = new THREE.Mesh(new THREE.BoxGeometry(2, 2.6, 7.4), new THREE.MeshLambertMaterial({ color: '#ffffff', transparent: true, opacity: 0.25 }));
  rede.position.set(Math.sign(x) * 1, 1.3, 0); g.add(rede);
  g.position.set(x, 0, 0); cena.add(g);
}
gol(-CW / 2 - 0.2); gol(CW / 2 + 0.2);
// Arquibancadas com torcida (pontinhos coloridos)
const arquib = [];
function arquibancada(w, d, x, z, rot) {
  const cv = document.createElement('canvas'); cv.width = 512; cv.height = 128;
  const g = cv.getContext('2d'); g.fillStyle = '#4a4a5a'; g.fillRect(0, 0, 512, 128);
  for (let i = 0; i < 900; i++) { g.fillStyle = sorteia(['#ff5d5d', '#ff5d5d', '#5cb8ff', '#5cb8ff', '#ffd23f', '#ffffff', '#2fd15a']); g.fillRect(Math.random() * 512, Math.random() * 128, 4, 5); }
  const tx = new THREE.CanvasTexture(cv);
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, 10, d), [new THREE.MeshLambertMaterial({ color: '#3a3a4a' }), new THREE.MeshLambertMaterial({ color: '#3a3a4a' }), new THREE.MeshLambertMaterial({ color: '#3a3a4a' }), new THREE.MeshLambertMaterial({ color: '#3a3a4a' }), new THREE.MeshLambertMaterial({ map: tx }), new THREE.MeshLambertMaterial({ color: '#3a3a4a' })]);
  m.position.set(x, 5, z); m.rotation.y = rot; m.rotation.x = 0;
  const grupo = new THREE.Group(); grupo.add(m); grupo.position.set(0, 0, 0);
  m.geometry.translate(0, 0, 0);
  cena.add(m); arquib.push(m);
}
arquibancada(120, 8, 0, -48, 0); arquibancada(120, 8, 0, 48, Math.PI); arquibancada(80, 8, -66, 0, Math.PI / 2); arquibancada(80, 8, 66, 0, -Math.PI / 2);

// ── Bonequinhos (corpo de bloquinhos) ──
function boneco(cor, cor2, pele = '#f2c18d') {
  const g = new THREE.Group();
  const mat = c => new THREE.MeshLambertMaterial({ color: c });
  const corpo = new THREE.Mesh(new THREE.BoxGeometry(0.9, 1.1, 0.55), mat(cor)); corpo.position.y = 1.55; corpo.castShadow = true; g.add(corpo);
  const cab = new THREE.Mesh(new THREE.SphereGeometry(0.38, 12, 10), mat(pele)); cab.position.y = 2.42; cab.castShadow = true; g.add(cab);
  const cabelo = new THREE.Mesh(new THREE.SphereGeometry(0.4, 12, 10, 0, Math.PI * 2, 0, Math.PI / 2.2), mat(sorteia(['#2a1a10', '#3b2414', '#f0c040', '#111111']))); cabelo.position.y = 2.48; g.add(cabelo);
  const pernas = [], bracos = [];
  for (const s of [-1, 1]) {
    const p = new THREE.Group(); p.position.set(s * 0.22, 1.0, 0);
    const pm = new THREE.Mesh(new THREE.BoxGeometry(0.3, 1, 0.3), mat(cor2)); pm.position.y = -0.5; pm.castShadow = true; p.add(pm);
    const meia = new THREE.Mesh(new THREE.BoxGeometry(0.32, 0.25, 0.42), mat('#111')); meia.position.set(0, -0.95, 0.06); p.add(meia);
    g.add(p); pernas.push(p);
    const b = new THREE.Group(); b.position.set(s * 0.6, 2.0, 0);
    const bm = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.9, 0.25), mat(cor)); bm.position.y = -0.45; b.add(bm);
    g.add(b); bracos.push(b);
  }
  g.userData = { pernas, bracos, corpo, cab };
  cena.add(g);
  return g;
}
function anda(b, vel, t) {
  const a = Math.sin(t * 10) * Math.min(1, vel * 3) * 0.7;
  b.userData.pernas[0].rotation.x = a; b.userData.pernas[1].rotation.x = -a;
  b.userData.bracos[0].rotation.x = -a; b.userData.bracos[1].rotation.x = a;
}
// cartão em cima da cabeça
function mostraCartao(alvo, cor) {
  const c = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.85, 0.05), new THREE.MeshBasicMaterial({ color: cor }));
  c.position.set(0, 3.6, 0); alvo.add(c);
  setTimeout(() => alvo.remove(c), 2500);
}

// ══════════════ JOGO ══════════════
let M = null, modo = 'menu';
const teclas = {};
addEventListener('keydown', e => { teclas[e.key.toLowerCase()] = true; if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', ' '].includes(e.key.toLowerCase())) e.preventDefault(); });
addEventListener('keyup', e => { teclas[e.key.toLowerCase()] = false; });
const joy = { x: 0, y: 0, id: null };
const stick = $('stick'), knob = $('knob');
function joyMove(t) { const r = stick.getBoundingClientRect(); let dx = t.clientX - (r.left + r.width / 2), dy = t.clientY - (r.top + r.height / 2); const l = Math.hypot(dx, dy), max = 50; if (l > max) { dx = dx / l * max; dy = dy / l * max; } joy.x = dx / max; joy.y = dy / max; knob.style.transform = `translate(${dx}px, ${dy}px)`; }
stick.addEventListener('touchstart', e => { e.preventDefault(); joy.id = e.changedTouches[0].identifier; joyMove(e.changedTouches[0]); }, { passive: false });
stick.addEventListener('touchmove', e => { e.preventDefault(); for (const t of e.changedTouches) if (t.identifier === joy.id) joyMove(t); }, { passive: false });
const joyFim = e => { for (const t of e.changedTouches) if (t.identifier === joy.id) { joy.id = null; joy.x = joy.y = 0; knob.style.transform = ''; } };
stick.addEventListener('touchend', joyFim); stick.addEventListener('touchcancel', joyFim);
let correndo = false;
$('correr').addEventListener('touchstart', e => { e.preventDefault(); correndo = true; $('correr').classList.add('on'); }, { passive: false });
$('correr').addEventListener('touchend', e => { e.preventDefault(); correndo = false; $('correr').classList.remove('on'); }, { passive: false });

// ── Sons ──
let ac = null;
function som(tipo) {
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const t = ac.currentTime;
    const nota = (f, d, tp = 'sine', v = 0.08, at = 0) => { const o = ac.createOscillator(), g = ac.createGain(); o.type = tp; o.frequency.value = f; g.gain.setValueAtTime(v, t + at); g.gain.exponentialRampToValueAtTime(0.0008, t + at + d); o.connect(g); g.connect(ac.destination); o.start(t + at); o.stop(t + at + d + 0.02); };
    const ruido = (d, v, f = 800) => { const n = ac.createBufferSource(), b = ac.createBuffer(1, ac.sampleRate * d, ac.sampleRate), c = b.getChannelData(0); for (let i = 0; i < c.length; i++) c[i] = (Math.random() * 2 - 1) * Math.sin(Math.PI * i / c.length); const fl = ac.createBiquadFilter(); fl.type = 'bandpass'; fl.frequency.value = f; const g = ac.createGain(); g.gain.value = v; n.buffer = b; n.connect(fl); fl.connect(g); g.connect(ac.destination); n.start(); };
    if (tipo === 'apito') { nota(2800, 0.35, 'sine', 0.09); nota(2850, 0.35, 'sine', 0.05); }
    if (tipo === 'apito3') { for (let i = 0; i < 3; i++) nota(2800, i === 2 ? 0.8 : 0.25, 'sine', 0.09, i * 0.35); }
    if (tipo === 'aplauso') ruido(1.6, 0.35, 1800);
    if (tipo === 'vaia') { ruido(1.4, 0.3, 300); nota(140, 1.2, 'sawtooth', 0.03); }
    if (tipo === 'gol') { ruido(2.2, 0.45, 1200); [523, 659, 784].forEach((f, i) => nota(f, 0.3, 'triangle', 0.06, i * 0.12)); }
    if (tipo === 'chute') nota(160, 0.08, 'square', 0.06);
  } catch (e) { /* sem som */ }
}
function aviso(txt, sub, ms = 1800) {
  const a = $('aviso'); a.innerHTML = ''; a.appendChild(document.createTextNode(txt));

  { id: 'caicai', certo: 'siga', peso: 2 },
  { id: 'empurrao', certo: 'falta', peso: 3 },
  { id: 'carrinho', certo: 'amarelo', peso: 2.5 },

// ── Atualizar o jogo ──
function atualiza() {
  if (!M || modo !== 'jogando') return;
  const passo = M.lento;
  M.t += passo;
  // juiz anda (você controla)
  let mx = (teclas.arrowright || teclas.d ? 1 : 0) - (teclas.arrowleft || teclas.a ? 1 : 0);
  let mz = (teclas.arrowdown || teclas.s ? 1 : 0) - (teclas.arrowup || teclas.w ? 1 : 0);
  if (joy.x || joy.y) { mx = joy.x; mz = joy.y; }
  const l = Math.hypot(mx, mz); if (l > 1) { mx /= l; mz /= l; }
  const vj = (teclas.shift || correndo ? 0.32 : 0.2) * (M.lance ? 0.5 : 1);
  M.ref.x = clamp(M.ref.x + mx * vj, -CW / 2 - 2, CW / 2 + 2); M.ref.z = clamp(M.ref.z + mz * vj, -CH / 2 - 2, CH / 2 + 2);

  // bola
  const b = M.bola;
  if (b.dono) {
    const d = b.dono, a = Math.atan2(d.vz, d.vx) || (meta(d.time) > 0 ? 0 : Math.PI);
    b.x = d.x + Math.cos(a) * 0.8; b.z = d.z + Math.sin(a) * 0.8; b.y = 0.35;
  } else {
    b.x += b.vx; b.z += b.vz; b.y += b.vy; b.vy -= 0.02;

    b.vx *= 0.975; b.vz *= 0.975;
    // gol?
    if (Math.abs(b.x) > CW / 2 && Math.abs(b.z) < 3.6 && b.y < 2.6) {

      M.placar[time]++; hud(); som('gol'); aviso('⚽ GOOOOL!', time ? 'do time azul 🔵' : 'do time vermelho 🔴', 2200);

  $('fim-nota').textContent = nota.toFixed(1);
  $('fim-nota').style.color = nota >= 7 ? '#2fd15a' : nota >= 5 ? '#ffd23f' : '#ff5d5d';
  $('fim-info').textContent = 'Placar 🔴 ' + M.placar[0] + ' x ' + M.placar[1] + ' 🔵 · Acertou ' + M.acertos + ' de ' + M.max + ' lances';
  $('fim-msg').textContent = msg;
  document.body.classList.remove('jogando');
  $('fim').classList.remove('hidden');
}
$('b-jogar').onclick = novoJogo;
$('b-denovo').onclick = novoJogo;
$('b-menu').onclick = () => { limpa(); modo = 'menu'; $('fim').classList.add('hidden'); $('menu').classList.remove('hidden'); mostraCarreira(); };

// câmera do menu: passeia pelo estádio vazio
let ang = 0;
function loop() {
  if (M) atualiza();
  else { ang += 0.002; camera.position.set(Math.cos(ang) * 70, 35, Math.sin(ang) * 50); camera.lookAt(0, 0, 0); }
  renderer.render(cena, camera);
  requestAnimationFrame(loop);
}
mostraCarreira();
loop();
window.__juiz = { get M() { return M; }, get modo() { return modo; }, decide, novoJogo };
})();
</script>
