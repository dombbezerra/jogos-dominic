<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0a0a1a">
  <title>Avisos</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif; color: #fff;
      background: radial-gradient(ellipse at top, #1a1a3e 0%, #0a0a1a 60%) #0a0a1a;
      display: flex; align-items: center; justify-content: center; padding: 20px; min-height: 100vh;
    }
    .card {
      width: 100%; max-width: 420px; background: rgba(20, 20, 40, 0.9); border: 2px solid rgba(255, 204, 0, 0.4);
      border-radius: 16px; padding: 24px 20px; display: flex; flex-direction: column; gap: 12px;
    }
    h1 { color: #ffcc00; font-size: 22px; text-align: center; }
    p { font-size: 13px; opacity: 0.75; text-align: center; line-height: 1.5; }
    input, textarea {
      width: 100%; padding: 12px; border-radius: 10px; border: 2px solid rgba(255, 255, 255, 0.15);
      background: rgba(0, 0, 0, 0.35); color: #fff; font: inherit; font-size: 16px; outline: none; resize: none;
    }
    input:focus, textarea:focus { border-color: #ffcc00; }
    button {
      padding: 13px; border: none; border-radius: 30px; background: #ffcc00; color: #0a0a1a;
      font-weight: bold; font-size: 15px; letter-spacing: 1px; cursor: pointer;
    }
    button:disabled { opacity: 0.6; }
    .msg { min-height: 20px; font-size: 14px; text-align: center; }
    .hidden { display: none !important; }
    body { flex-direction: column; gap: 16px; }
    .users { list-style: none; display: flex; flex-direction: column; gap: 6px; }
    .users li { display: flex; align-items: center; justify-content: space-between; gap: 8px; background: rgba(0, 0, 0, 0.3); border-radius: 10px; padding: 8px 12px; font-weight: bold; }
    .users li button { padding: 6px 12px; font-size: 13px; letter-spacing: 0; background: #ff5a5a; color: #fff; }
    a { color: rgba(255, 255, 255, 0.5); font-size: 13px; text-align: center; text-decoration: none; }
  </style>
</head>
<body>
  <!-- Página escondida: manda o aviso de jogo novo pra todos que ligaram as notificações -->
  <form class="card" id="loginForm" autocomplete="off">
    <h1>📣 AVISOS</h1>
    <p>Só pra quem tem o login da Base Secreta.</p>
    <input id="name" placeholder="Nome" autocapitalize="off" autocorrect="off" spellcheck="false" required>
    <input id="pass" type="password" placeholder="Senha" required>
    <button type="submit" id="loginBtn">ENTRAR</button>
    <div class="msg" id="loginMsg"></div>
    <a href="../">← Menu</a>
  </form>

  <form class="card hidden" id="sendForm">
    <h1>📣 AVISO DE JOGO NOVO</h1>
    <p>Vai como notificação no celular de todo mundo que tocou em <b>"Avisar de jogos novos"</b> no menu.</p>
    <input id="title" maxlength="60" value="Jogo novo! 🎮">
    <textarea id="text" rows="3" maxlength="200">Tem jogo novo nos Jogos do Dominic! Vem jogar!</textarea>
    <button type="submit" id="sendBtn">ENVIAR PRA TODOS</button>
    <div class="msg" id="sendMsg"></div>
    <a href="#" id="logout">Sair</a>
  </form>

  <!-- Usuários da Aventura Elemental: dá pra apagar quem não deve estar lá -->
  <div class="card hidden" id="usersCard">
    <h1>👤 USUÁRIOS</h1>
    <p>Quem tem usuário na Aventura Elemental. Toque no 🗑️ e depois em <b>Apagar?</b> pra tirar alguém.</p>
    <ul id="usersList" class="users"></ul>
    <div class="msg" id="usersMsg"></div>
  </div>

  <script>
    const $ = id => document.getElementById(id);
    const store = {
      get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
      set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
      del(k) { try { localStorage.removeItem(k); } catch (e) {} },
    };
    let token = store.get('avisos_token');
    const show = logged => {
      $('loginForm').classList.toggle('hidden', logged);
      $('sendForm').classList.toggle('hidden', !logged);
      $('usersCard').classList.toggle('hidden', !logged);
      if (logged) loadUsers();
    };

    const COLORS = { verde: '#5df07a', azul: '#5ccfff', vermelho: '#ff5a5a', laranja: '#ff9a2e', roxo: '#b06cff', rosa: '#ff6ad5', dourado: '#ffd23a', arcoiris: '#ffd23a' };
    async function usersApi(body) {
      const r = await fetch('/api/conta/', { method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token }, body: JSON.stringify(body) });
      const data = await r.json().catch(() => ({}));
      if (r.status === 401) { token = null; store.del('avisos_token'); show(false); throw new Error(data.error || 'Entre de novo.'); }
      if (!r.ok) throw new Error(data.error || 'Erro ' + r.status);
      return data;
    }
    function renderUsers(list) {
      const ul = $('usersList');
      ul.innerHTML = '';
      if (!list.length) { ul.innerHTML = '<li>Ninguém tem usuário ainda.</li>'; return; }
      for (const u of list) {
        const li = document.createElement('li');
        const name = document.createElement('span');
        name.textContent = u.nome;
        name.style.color = COLORS[u.cor] || '#fff';
        const btn = document.createElement('button');
        btn.textContent = '🗑️';
        btn.title = 'Apagar ' + u.nome;
        // Primeiro toque pergunta, segundo apaga
        btn.addEventListener('click', async () => {
          if (btn.dataset.armed !== '1') {
            btn.dataset.armed = '1'; btn.textContent = 'Apagar?';
            setTimeout(() => { btn.dataset.armed = ''; btn.textContent = '🗑️'; }, 4000);
            return;
          }
          btn.disabled = true;
          try {
            const data = await usersApi({ action: 'admin-apagar', nome: u.nome });
            $('usersMsg').textContent = '✅ ' + u.nome + ' foi apagado.';
            renderUsers(data.usuarios || []);
          } catch (err) { $('usersMsg').textContent = 'Não deu: ' + err.message; btn.disabled = false; }
        });
        li.append(name, btn);
        ul.appendChild(li);
      }
    }
    async function loadUsers() {
      $('usersMsg').textContent = 'Carregando...';
      try { renderUsers((await usersApi({ action: 'admin-lista' })).usuarios || []); $('usersMsg').textContent = ''; }
      catch (err) { $('usersMsg').textContent = 'Não deu: ' + err.message; }
    }
    show(!!token);

    // Entra com o mesmo nome e senha da Base Secreta
    $('loginForm').addEventListener('submit', async e => {
      e.preventDefault();
      $('loginBtn').disabled = true; $('loginMsg').textContent = '';
      try {
        const r = await fetch('/api/chat/', { method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'login', name: $('name').value, password: $('pass').value }) });
        const data = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(data.error || 'Erro ' + r.status);
        token = data.token; store.set('avisos_token', token);
        $('pass').value = '';
        show(true);
        $('sendMsg').textContent = '✅ Pronto! Agora o 📣 do menu manda o aviso com 1 toque, sem senha.';
      } catch (err) { $('loginMsg').textContent = err.message; }
      $('loginBtn').disabled = false;
    });

    // Confirma com um segundo clique (a janelinha do confirm() não aparece em alguns navegadores)
    let armed = false, armTimer = null;
    $('sendForm').addEventListener('submit', async e => {
      e.preventDefault();
      if (!armed) {
        armed = true;
        $('sendBtn').textContent = 'CLIQUE DE NOVO PRA CONFIRMAR';
        $('sendMsg').textContent = 'Vai mandar pra todo mundo que ligou os avisos.';
        clearTimeout(armTimer);
        armTimer = setTimeout(() => { armed = false; $('sendBtn').textContent = 'ENVIAR PRA TODOS'; $('sendMsg').textContent = ''; }, 6000);
        return;
      }
      armed = false; clearTimeout(armTimer);
      $('sendBtn').textContent = 'ENVIAR PRA TODOS';
      $('sendBtn').disabled = true; $('sendMsg').textContent = 'Enviando...';
      try {
        const r = await fetch('/api/push/', { method: 'POST',
          headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
          body: JSON.stringify({ action: 'enviar', titulo: $('title').value, texto: $('text').value, url: '/' }) });
        const data = await r.json().catch(() => ({}));
        if (r.status === 401) { token = null; store.del('avisos_token'); show(false); throw new Error(data.error || 'Entre de novo.'); }
        if (!r.ok) throw new Error(data.error || 'Erro ' + r.status);
        if (data.token) { token = data.token; store.set('avisos_token', token); }   // login renovado
        $('sendMsg').textContent = data.total ? `Enviado pra ${data.enviados} de ${data.total} aparelhos ✅` : 'Ninguém ligou os avisos ainda.';
      } catch (err) { $('sendMsg').textContent = 'Não deu: ' + err.message; }
      $('sendBtn').disabled = false;
    });

    $('logout').addEventListener('click', e => { e.preventDefault(); token = null; store.del('avisos_token'); show(false); });
  </script>
</body>
</html>
