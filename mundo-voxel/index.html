<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#87CEEB">
  <title>Mundo Voxel</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #87CEEB; }
    canvas { display: block; }

    #back-link {
      position: fixed;
      top: calc(env(safe-area-inset-top) + 8px);
      left: calc(env(safe-area-inset-left) + 8px);
      background: rgba(60,160,60,0.92);
      color: white;
      padding: 6px 12px;
      font-size: 13px;
      font-weight: bold;
      text-decoration: none;
      border-radius: 6px;
      z-index: 100;
      font-family: Arial, sans-serif;
    }

    #overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.82);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: white;
      z-index: 50;
      font-family: 'Courier New', monospace;
    }
    #overlay h1 {
      font-size: clamp(28px, 6vw, 56px);
      color: #55ff55;
      text-shadow: 4px 4px #003300;
      margin-bottom: 20px;
      letter-spacing: 3px;
    }
    .ctrl-table { border-collapse: collapse; margin-bottom: 24px; font-size: clamp(11px, 2vw, 14px); }
    .ctrl-table td { padding: 4px 12px; }
    .ctrl-table td:first-child { color: #ffdd55; font-weight: bold; text-align: right; }
    .ctrl-table td:last-child { color: #ccc; }
    #start-btn {
      padding: 14px 48px;
      background: #2d6a2d;
      color: #55ff55;
      border: 3px solid #55ff55;
      font-size: clamp(16px, 3vw, 22px);
      font-weight: bold;
      font-family: 'Courier New', monospace;
      cursor: pointer;
      border-radius: 4px;
      letter-spacing: 3px;
      transition: all 0.15s;
    }
    #start-btn:hover { background: #3d8a3d; transform: scale(1.05); }

    #crosshair {
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      font-size: 30px;
      line-height: 1;
      pointer-events: none;
      z-index: 10;
      text-shadow: 1px 1px 3px black;
      display: none;
    }

    #hotbar {
      position: fixed;
      bottom: max(16px, env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 4px;
      z-index: 10;
    }
    .slot {
      width: clamp(44px, 9vw, 56px);
      height: clamp(44px, 9vw, 56px);
      background: rgba(0,0,0,0.6);
      border: 2px solid rgba(255,255,255,0.35);
      border-radius: 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: clamp(18px, 4vw, 26px);
      user-select: none;
      cursor: pointer;
    }
    .slot.active { border-color: #fff; border-width: 3px; }
    .slot-num { font-size: 9px; color: rgba(255,255,255,0.5); font-family: Arial, sans-serif; }

    #selected-name {
      position: fixed;
      bottom: max(80px, calc(env(safe-area-inset-bottom) + 64px));
      left: 50%;
      transform: translateX(-50%);
      color: white;
      font-family: Arial, sans-serif;
      font-size: 13px;
      text-shadow: 1px 1px 3px black;
      z-index: 10;
      display: none;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <a href="../index.html" id="back-link"
     onclick="if(window!==window.top){event.preventDefault();window.parent.postMessage({type:'closeGame'},'*');}">← Menu</a>

  <div id="overlay">
    <h1>MUNDO VOXEL</h1>
    <table class="ctrl-table">
      <tr><td>WASD</td><td>Mover</td></tr>
      <tr><td>Mouse</td><td>Olhar</td></tr>
      <tr><td>Espaço</td><td>Pular</td></tr>
      <tr><td>Clique Esq</td><td>Quebrar bloco</td></tr>
      <tr><td>Clique Dir</td><td>Colocar bloco</td></tr>
      <tr><td>1–6 / Scroll</td><td>Selecionar bloco</td></tr>
      <tr><td>ESC</td><td>Pausar</td></tr>
    </table>
    <button id="start-btn">▶ JOGAR</button>
  </div>

  <div id="crosshair">+</div>

  <div id="hotbar">
    <div class="slot active" data-slot="1">🟫<span class="slot-num">1</span></div>
    <div class="slot" data-slot="2">🟩<span class="slot-num">2</span></div>
    <div class="slot" data-slot="3">⬜<span class="slot-num">3</span></div>
    <div class="slot" data-slot="4">🟨<span class="slot-num">4</span></div>
    <div class="slot" data-slot="5">🪵<span class="slot-num">5</span></div>
    <div class="slot" data-slot="6">🌿<span class="slot-num">6</span></div>
  </div>

  <div id="selected-name"></div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  <script src="game.js"></script>
</body>
</html>
