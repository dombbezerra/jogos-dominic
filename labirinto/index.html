<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#8fd3ff">
<title>Fuga do Labirinto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root { --tinta: #0e0c33; --creme: #fff6dc; --sol: #ffd23f; --rosa: #ff5d8f; --verde: #2fd15a; --roxo: #9b5cff;
    --display: 'Bungee', 'Arial Black', Impact, sans-serif; --texto: 'Baloo 2', 'Segoe UI', Arial, sans-serif; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: #0a0a1a; color: var(--creme); font-family: var(--texto); -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; touch-action: none; }
  canvas { display: block; }
  #back-link { position: fixed; top: calc(env(safe-area-inset-top) + 10px); left: 10px; z-index: 30; text-decoration: none; font-weight: 800; background: var(--sol); color: var(--tinta); border: 3px solid var(--tinta); border-radius: 12px; padding: 4px 12px 2px; box-shadow: 0 4px 0 var(--tinta); }
  body.jogando #back-link { display: none; }
  .tela { position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 60px 16px 20px; text-align: center; overflow-y: auto; }
  .tela.hidden { display: none; }
  #menu { background: linear-gradient(#8fd3ff 0%, #bfe6ff 45%, #5cae4a 46%, #2e7d32 100%); }
  h1 { font-family: var(--display); font-weight: 400; font-size: clamp(36px, 9vw, 72px); line-height: .95; text-shadow: 4px 4px 0 #000; transform: rotate(-3deg); }
  h1 span { color: var(--sol); display: block; font-size: .6em; }
  .sub { font-weight: 700; margin-top: 12px; max-width: 520px; opacity: .92; }
  .btn { font-family: var(--texto); font-weight: 800; font-size: 18px; cursor: pointer; border: 3px solid var(--tinta); border-radius: 16px; padding: 10px 24px 7px; color: var(--tinta); background: var(--creme); box-shadow: 0 5px 0 var(--tinta); }
  .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--tinta); }
  .btn.grande { font-family: var(--display); font-weight: 400; font-size: clamp(22px, 6vw, 32px); background: var(--roxo); color: #fff; padding: 10px 40px 6px; margin-top: 18px; }
  .dica { font-size: 13px; opacity: .85; margin-top: 12px; max-width: 540px; }
  .botoes { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 14px; }

  #hud { position: fixed; inset: 0; z-index: 10; pointer-events: none; display: none; }
  body.jogando #hud { display: block; }
  .caixa { position: absolute; background: rgba(10,10,26,.8); border: 2px solid rgba(255,255,255,.4); border-radius: 12px; padding: 3px 12px 1px; font-weight: 800; }
  #info { left: 50%; transform: translateX(-50%); top: calc(env(safe-area-inset-top) + 10px); white-space: nowrap; font-size: 17px; }
  #mapa { position: absolute; right: 10px; top: calc(env(safe-area-inset-top) + 10px); width: 140px; height: 140px; border: 2px solid rgba(255,255,255,.4); border-radius: 10px; background: rgba(10,10,26,.8); }
  #folego { left: 50%; transform: translateX(-50%); top: calc(env(safe-area-inset-top) + 48px); width: 140px; height: 10px; padding: 0; overflow: hidden; }
  #folego i { display: block; height: 100%; width: 100%; background: var(--verde); }
  #susto { position: fixed; inset: 0; z-index: 9; pointer-events: none; box-shadow: inset 0 0 0 0 rgba(255,0,60,0); transition: box-shadow .3s; }
  #aviso { position: fixed; left: 50%; top: 30%; transform: translate(-50%, -50%); z-index: 12; font-family: var(--display); font-size: clamp(30px, 8vw, 60px); text-shadow: 4px 4px 0 #000; text-align: center; pointer-events: none; opacity: 0; transition: opacity .25s; white-space: nowrap; }
  #aviso.on { opacity: 1; }
  #aviso small { display: block; font-family: var(--texto); font-weight: 800; font-size: 19px; }
  #seta { position: fixed; left: 50%; top: 42%; z-index: 11; font-size: 70px; pointer-events: none; display: none; filter: drop-shadow(0 0 10px #ffd23f); }
  #b-pausa { position: fixed; top: calc(env(safe-area-inset-top) + 10px); left: 10px; z-index: 14; display: none; width: 46px; height: 42px; font-size: 20px; cursor: pointer; border: 3px solid var(--tinta); border-radius: 12px; background: var(--sol); color: var(--tinta); box-shadow: 0 4px 0 var(--tinta); }
  body.jogando #b-pausa { display: block; }
  #b-bussola { position: fixed; z-index: 14; display: none; right: 14px; top: calc(env(safe-area-inset-top) + 160px); font-weight: 800; font-size: 16px; cursor: pointer; border: 3px solid var(--tinta); border-radius: 14px; background: var(--sol); color: var(--tinta); box-shadow: 0 4px 0 var(--tinta); padding: 6px 10px 3px; font-family: var(--texto); }
  body.jogando #b-bussola { display: block; }
  /* celular */
  #toque { position: fixed; inset: 0; z-index: 11; pointer-events: none; display: none; }
  body.touch.jogando #toque { display: block; }
  #stick { position: absolute; left: calc(env(safe-area-inset-left) + 22px); bottom: calc(env(safe-area-inset-bottom) + 26px); width: 130px; height: 130px; border-radius: 50%; background: rgba(255,255,255,.12); border: 3px solid rgba(255,255,255,.4); pointer-events: auto; }
  #knob { position: absolute; left: 50%; top: 50%; width: 56px; height: 56px; margin: -28px 0 0 -28px; border-radius: 50%; background: rgba(255,255,255,.55); }
  #correr { position: absolute; right: calc(env(safe-area-inset-right) + 24px); bottom: calc(env(safe-area-inset-bottom) + 40px); width: 92px; height: 92px; border-radius: 50%; border: 4px solid var(--tinta); background: var(--verde); color: #fff; font-family: var(--display); font-size: 14px; pointer-events: auto; box-shadow: 0 5px 0 var(--tinta); }
  #correr.on { transform: translateY(4px); box-shadow: 0 1px 0 var(--tinta); }
  #pausa, #fim { background: rgba(5,5,16,.86); z-index: 25; }
  #fim h2, #pausa h2 { font-family: var(--display); font-weight: 400; font-size: clamp(30px, 8vw, 56px); color: var(--sol); text-shadow: 3px 3px 0 #000; }
  #fim p { font-weight: 800; font-size: 18px; margin-top: 6px; }
</style>
</head>
<body>
<a href="../index.html" id="back-link">← Menu</a>
<div id="susto"></div>
<div id="hud">
  <div class="caixa" id="info">🔑 0/3 · ❤️❤️❤️ · Fase 1</div>
  <div class="caixa" id="folego"><i></i></div>
  <canvas id="mapa" width="140" height="140"></canvas>
</div>
<div id="aviso"></div>
<div id="seta">⬆️</div>
<button id="b-pausa" aria-label="Pausar">⏸</button>
<button id="b-bussola">🧭 x3</button>
<div id="toque"><div id="stick"><div id="knob"></div></div><button id="correr">CORRER</button></div>

<div class="tela" id="menu">
  <h1>FUGA DO<span>LABIRINTO</span></h1>
  <p class="sub">Um labirinto de jardim bem difícil! Pegue todas as chaves 🔑 e saia pela porta 🚪 o mais rápido que conseguir ⏱</p>
  <button class="btn grande" id="b-jogar">ENTRAR 🌀</button>
  <p class="dica" id="dica"></p>
  <p class="dica" id="recorde"></p>
</div>
<div class="tela hidden" id="pausa">
  <h2>⏸ PAUSADO</h2>
  <div class="botoes"><button class="btn" id="b-sair">SAIR</button><button class="btn grande" id="b-continuar" style="margin-top:0">▶ CONTINUAR</button></div>
</div>
<div class="tela hidden" id="fim">
  <h2 id="fim-titulo">👾 TE PEGOU!</h2>
  <p id="fim-info"></p>
  <div class="botoes"><button class="btn" id="b-menu">MENU</button><button class="btn grande" id="b-denovo" style="margin-top:0">TENTAR DE NOVO</button></div>
</div>

<script src="../mundo-blocos/three.min.js"></script>
<script>
(() => {
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const TOUCH = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
if (TOUCH) document.body.classList.add('touch');
$('dica').textContent = TOUCH
  ? 'Joystick anda · arraste o dedo na tela pra olhar · CORRER gasta fôlego · 🧭 mostra o caminho'
  : 'W A S D ou setas andam · arraste o mouse pra olhar · Shift corre · B = 🧭 bússola · P pausa';

// ── Perfil (maior fase) ──
const PERFIL = new URLSearchParams(location.search).get('perfil');
const KEY = 'fugaLabirinto' + (PERFIL ? ':' + PERFIL : '');
let save; try { save = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { save = {}; }
save = Object.assign({ melhor: 0 }, save);
const grava = () => { try { localStorage.setItem(KEY, JSON.stringify(save)); } catch (e) { /* ok */ } };
const mostraRecorde = () => { $('recorde').textContent = save.melhor ? '🏆 Sua melhor fase: ' + save.melhor : ''; };
mostraRecorde();

// ══════════════ 3D ══════════════
const renderer = new THREE.WebGLRenderer({ antialias: !TOUCH });
renderer.setPixelRatio(Math.min(TOUCH ? 1.5 : 2, devicePixelRatio || 1));
document.body.appendChild(renderer.domElement);
const cena = new THREE.Scene();
cena.background = new THREE.Color('#8fd3ff');
cena.fog = new THREE.Fog('#bfe6ff', 30, 110);
const camera = new THREE.PerspectiveCamera(72, 1, 0.05, 200);
cena.add(camera);
function ajusta() { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
addEventListener('resize', ajusta); ajusta();
cena.add(new THREE.HemisphereLight('#ffffff', '#6a8a4a', 1.5));
const sol = new THREE.DirectionalLight('#fff4d6', 2.2); sol.position.set(40, 80, 25); cena.add(sol);   // dia de sol

function texParede() {   // arbusto cheio de folhinhas
  const cv = document.createElement('canvas'); cv.width = cv.height = 128;
  const g = cv.getContext('2d'); g.fillStyle = '#2e7d32'; g.fillRect(0, 0, 128, 128);
  for (let i = 0; i < 900; i++) {
    const v = Math.random();
    g.fillStyle = v < 0.33 ? '#1b5e20' : v < 0.66 ? '#43a047' : '#66bb6a';
    g.beginPath(); g.ellipse(Math.random() * 128, Math.random() * 128, 2 + Math.random() * 3, 1.5 + Math.random() * 2, Math.random() * 3, 0, 7); g.fill();
  }
  const t = new THREE.CanvasTexture(cv); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.colorSpace = THREE.SRGBColorSpace; return t;
}
function texChao() {   // grama com caminho de terra batida
  const cv = document.createElement('canvas'); cv.width = cv.height = 64;
  const g = cv.getContext('2d'); g.fillStyle = '#c8a46a'; g.fillRect(0, 0, 64, 64);
  for (let i = 0; i < 160; i++) { g.fillStyle = Math.random() < 0.5 ? 'rgba(120,80,40,.25)' : 'rgba(255,240,200,.25)'; g.fillRect(Math.random() * 64, Math.random() * 64, 2, 2); }
  const t = new THREE.CanvasTexture(cv); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.colorSpace = THREE.SRGBColorSpace; return t;
}
const MAT_PAREDE = new THREE.MeshLambertMaterial({ map: texParede() });
// grama fora do labirinto
const GRAMA = new THREE.Mesh(new THREE.PlaneGeometry(600, 600), new THREE.MeshLambertMaterial({ color: '#5cae4a' }));
GRAMA.rotation.x = -Math.PI / 2; GRAMA.position.y = -0.02; cena.add(GRAMA);
const TEX_CHAO = texChao();

// ── Labirinto ──
const CS = 4, ALT = 3.4, ESP = 0.4;   // tamanho da casinha, altura e grossura da parede
let L = null;   // labirinto da fase
function geraLabirinto(w, h) {
  // cada casinha começa com as 4 paredes; o "cavador" vai abrindo caminho
  const cel = [];
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) cel.push({ x, y, n: true, s: true, l: true, o: true, vis: false });
  const c = (x, y) => cel[y * w + x];
  const pilha = [c(0, 0)]; c(0, 0).vis = true;
  while (pilha.length) {
    const a = pilha[pilha.length - 1];
    const viz = [[0, -1, 'n', 's'], [0, 1, 's', 'n'], [1, 0, 'l', 'o'], [-1, 0, 'o', 'l']]
      .map(([dx, dy, p, q]) => [a.x + dx, a.y + dy, p, q]).filter(([x, y]) => x >= 0 && y >= 0 && x < w && y < h && !c(x, y).vis);
    if (!viz.length) { pilha.pop(); continue; }
    const [x, y, p, q] = viz[Math.floor(Math.random() * viz.length)];
    a[p] = false; c(x, y)[q] = false; c(x, y).vis = true; pilha.push(c(x, y));
  }
  // abre poucas paredes a mais (quase todo caminho errado é beco sem saída)
  for (let i = 0; i < Math.floor(w * h * 0.025); i++) {
    const x = 1 + Math.floor(Math.random() * (w - 2)), y = 1 + Math.floor(Math.random() * (h - 2));
    if (Math.random() < 0.5) { c(x, y).l = false; c(x + 1, y).o = false; } else { c(x, y).s = false; c(x, y + 1).n = false; }
  }
  return { w, h, cel, c };
}
function vizinhos(a) {
  const r = [];
  if (!a.n) r.push(L.c(a.x, a.y - 1)); if (!a.s) r.push(L.c(a.x, a.y + 1));
  if (!a.l) r.push(L.c(a.x + 1, a.y)); if (!a.o) r.push(L.c(a.x - 1, a.y));
  return r;
}
function distancias(origem) {   // quantos passos de cada casinha até a origem
  const d = new Map([[origem, 0]]), fila = [origem];
  while (fila.length) { const a = fila.shift(); for (const b of vizinhos(a)) if (!d.has(b)) { d.set(b, d.get(a) + 1); fila.push(b); } }
  return d;
}
const centro = a => ({ x: (a.x + 0.5) * CS, z: (a.y + 0.5) * CS });
const celDe = (x, z) => L.c(clamp(Math.floor(x / CS), 0, L.w - 1), clamp(Math.floor(z / CS), 0, L.h - 1));

let mundo = null;
function montaFase(fase) {
  if (mundo) cena.remove(mundo);
  mundo = new THREE.Group(); cena.add(mundo);
  const w = 8 + fase * 2, h = 8 + fase * 2;
  L = geraLabirinto(w, h);
  // começo em (0,0); a saída é a casinha da borda mais longe
  const inicio = L.c(0, 0), dIni = distancias(inicio);
  const saida = L.cel.filter(a => a.x === L.w - 1 || a.y === L.h - 1).sort((a, b) => dIni.get(b) - dIni.get(a))[0];
  const ladoSaida = saida.x === L.w - 1 ? 'l' : 's';
  L.inicio = inicio; L.saida = saida; L.ladoSaida = ladoSaida;
  L.caixas = [];   // paredes como retângulos (pra bater nelas)
  const geo = new THREE.BoxGeometry(1, 1, 1), lista = [];
  const parede = (x0, z0, x1, z1) => { lista.push([x0, z0, x1, z1]); L.caixas.push({ x0, z0, x1, z1 }); };
  for (const a of L.cel) {
    const X = a.x * CS, Z = a.y * CS;
    if (a.n) parede(X - ESP / 2, Z - ESP / 2, X + CS + ESP / 2, Z + ESP / 2);
    if (a.o) parede(X - ESP / 2, Z - ESP / 2, X + ESP / 2, Z + CS + ESP / 2);
    if (a.y === L.h - 1 && a.s && !(a === saida && ladoSaida === 's')) parede(X - ESP / 2, Z + CS - ESP / 2, X + CS + ESP / 2, Z + CS + ESP / 2);
    if (a.x === L.w - 1 && a.l && !(a === saida && ladoSaida === 'l')) parede(X + CS - ESP / 2, Z - ESP / 2, X + CS + ESP / 2, Z + CS + ESP / 2);
  }
  const inst = new THREE.InstancedMesh(geo, MAT_PAREDE, lista.length), m4 = new THREE.Matrix4();
  lista.forEach(([x0, z0, x1, z1], i) => { m4.makeScale(x1 - x0, ALT, z1 - z0); m4.setPosition((x0 + x1) / 2, ALT / 2, (z0 + z1) / 2); inst.setMatrixAt(i, m4); });
  mundo.add(inst);
  // florzinhas coloridas no pé dos arbustos
  const nFlores = lista.length * 7, flores = new THREE.InstancedMesh(new THREE.SphereGeometry(0.11, 8, 6), new THREE.MeshLambertMaterial(), nFlores);
  const corF = new THREE.Color(), CORES_F = ['#ff5d8f', '#ffd23f', '#ffffff', '#b06cff', '#ff8a3d', '#5cb8ff'];
  for (let i = 0; i < nFlores; i++) {
    const [x0, z0, x1, z1] = lista[i % lista.length], deitada = x1 - x0 > z1 - z0, lado = Math.random() < 0.5 ? -1 : 1, t = Math.random();
    const x = deitada ? x0 + (x1 - x0) * t : (x0 + x1) / 2 + lado * (ESP / 2 + 0.12);
    const z = deitada ? (z0 + z1) / 2 + lado * (ESP / 2 + 0.12) : z0 + (z1 - z0) * t;
    m4.makeScale(1, 1, 1); m4.setPosition(x, 0.12 + Math.random() * 0.5, z); flores.setMatrixAt(i, m4);
    flores.setColorAt(i, corF.set(CORES_F[i % CORES_F.length]));
  }
  mundo.add(flores);
  const tc = TEX_CHAO.clone(); tc.needsUpdate = true; tc.repeat.set(w * 2, h * 2);
  const chao = new THREE.Mesh(new THREE.PlaneGeometry(w * CS, h * CS), new THREE.MeshLambertMaterial({ map: tc }));
  chao.rotation.x = -Math.PI / 2; chao.position.set(w * CS / 2, 0, h * CS / 2); mundo.add(chao);
  // porta (fechada até pegar todas as chaves)
  const pc = centro(saida), porta = new THREE.Group();
  const madeira = new THREE.Mesh(new THREE.BoxGeometry(CS - ESP, ALT - 0.4, 0.3), new THREE.MeshLambertMaterial({ color: '#8a3a1a', emissive: '#3a0a00' }));
  madeira.position.y = (ALT - 0.4) / 2; porta.add(madeira);
  const placa = new THREE.Mesh(new THREE.PlaneGeometry(1.6, 0.6), new THREE.MeshBasicMaterial({ map: textoTex('SAÍDA', '#ff3b3b') }));
  placa.position.set(0, ALT - 0.25, 0.2); porta.add(placa);
  const placa2 = placa.clone(); placa2.rotation.y = Math.PI; placa2.position.z = -0.2; porta.add(placa2);
  if (ladoSaida === 'l') { porta.position.set((saida.x + 1) * CS, 0, pc.z); porta.rotation.y = Math.PI / 2; }
  else { porta.position.set(pc.x, 0, (saida.y + 1) * CS); }
  mundo.add(porta); L.porta = porta; L.madeira = madeira;
  // a porta fechada também é parede
  L.caixaPorta = ladoSaida === 'l' ? { x0: (saida.x + 1) * CS - ESP / 2, z0: saida.y * CS, x1: (saida.x + 1) * CS + ESP / 2, z1: (saida.y + 1) * CS }
    : { x0: saida.x * CS, z0: (saida.y + 1) * CS - ESP / 2, x1: (saida.x + 1) * CS, z1: (saida.y + 1) * CS + ESP / 2 };
  L.caixas.push(L.caixaPorta);
  // luz verde lá fora (aparece quando a porta abre)
  // chaves: nas casinhas sem saída mais longe do começo, espalhadas
  const nChaves = Math.min(3 + Math.floor((fase - 1) / 2), 6);
  const becos = L.cel.filter(a => a !== inicio && a !== saida && vizinhos(a).length === 1).sort((a, b) => dIni.get(b) - dIni.get(a));
  const escolhidas = [];
  for (const a of becos) { if (escolhidas.length >= nChaves) break; if (escolhidas.every(b => Math.abs(a.x - b.x) + Math.abs(a.y - b.y) > Math.max(3, w / 3))) escolhidas.push(a); }
  for (const a of becos) { if (escolhidas.length >= nChaves) break; if (!escolhidas.includes(a)) escolhidas.push(a); }
  L.chaves = escolhidas.map(a => {
    const g = fazChave(), c = centro(a); g.position.set(c.x, 1.2, c.z); mundo.add(g);
    const luz = new THREE.PointLight('#ffd23f', 3, 5, 1.3); luz.position.set(c.x, 1.6, c.z); mundo.add(luz);
    return { a, g, luz, pegou: false };
  });
  L.visto = new Set();
  return fase;
}
function textoTex(txt, cor) {
  const cv = document.createElement('canvas'); cv.width = 256; cv.height = 96; const g = cv.getContext('2d');
  g.fillStyle = '#111'; g.fillRect(0, 0, 256, 96); g.fillStyle = cor; g.font = '900 60px Arial Black, Arial'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(txt, 128, 52);
  const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace; return t;
}
function fazChave() {
  const g = new THREE.Group(), ouro = new THREE.MeshStandardMaterial({ color: '#ffd23f', emissive: '#a07000', metalness: 0.6, roughness: 0.3 });
  const anel = new THREE.Mesh(new THREE.TorusGeometry(0.28, 0.08, 10, 20), ouro); anel.position.y = 0.35; g.add(anel);
  const haste = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.7, 0.1), ouro); haste.position.y = -0.1; g.add(haste);
  for (const y of [-0.35, -0.2]) { const d = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.08, 0.1), ouro); d.position.set(0.12, y, 0); g.add(d); }
  return g;
}
// ══════════════ JOGO ══════════════
let J = null, modo = 'menu';
const tecla = {};
addEventListener('keydown', e => {
  const k = e.key.toLowerCase(); tecla[k] = true;
  if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', ' '].includes(k)) e.preventDefault();
  if (k === 'b') bussola();
  if (k === 'p' || k === 'escape') modo === 'pausa' ? continua() : pausa();
});
addEventListener('keyup', e => { tecla[e.key.toLowerCase()] = false; });
const joy = { x: 0, y: 0, id: null };
