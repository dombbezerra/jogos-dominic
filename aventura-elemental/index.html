<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#10141f">
  <title>Aventura Elemental</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overscroll-behavior: none; }
    body {
      background: #10141f;
      color: #fff;
      font-family: 'Courier New', monospace;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: none;
    }
    #game {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      background: #000;
      border: 3px solid #000;
      box-shadow: 0 0 40px rgba(80, 160, 255, 0.25);
      /* cresce até caber na tela, mantendo a proporção 320 x 208 */
      width: min(100vw, calc(100vh * 320 / 208));
      height: auto;
      aspect-ratio: 320 / 208;
    }
    #back-link {
      position: fixed;
      top: calc(env(safe-area-inset-top) + 8px);
      left: calc(env(safe-area-inset-left) + 8px);
      background: rgba(0, 0, 0, 0.8);
      color: #ffcc33;
      border: 2px solid #ffcc33;
      padding: 5px 10px;
      font-family: inherit;
      font-size: 13px;
      font-weight: bold;
      text-decoration: none;
      border-radius: 4px;
      z-index: 50;
    }
    #sound-btn {
      position: fixed;
      top: calc(env(safe-area-inset-top) + 8px);
      right: calc(env(safe-area-inset-right) + 8px);
      background: rgba(0, 0, 0, 0.8);
      color: #ffcc33;
      border: 2px solid #ffcc33;
      padding: 5px 9px;
      font-size: 14px;
      border-radius: 4px;
      z-index: 50;
      cursor: pointer;
    }

    /* ── Controles de toque ── */
    #touch { position: fixed; inset: 0; pointer-events: none; z-index: 20; display: none; }
    body.touch #touch { display: block; }
    #stick-zone { position: absolute; left: 0; top: 0; bottom: 0; width: 50%; pointer-events: auto; }
    #stick {
      position: absolute; width: 120px; height: 120px; margin: -60px 0 0 -60px;
      border-radius: 50%; border: 3px solid rgba(255, 255, 255, 0.35); background: rgba(0, 0, 0, 0.25);
      display: none;
    }
    #stick-knob {
      position: absolute; left: 50%; top: 50%; width: 50px; height: 50px; margin: -25px 0 0 -25px;
      border-radius: 50%; background: rgba(255, 255, 255, 0.55);
    }
    .tbtn {
      position: absolute; pointer-events: auto; border-radius: 50%;
      border: 4px solid #000; font-family: inherit; font-weight: bold; color: #000;
      display: flex; align-items: center; justify-content: center; text-align: center;
      box-shadow: 0 4px 0 rgba(0, 0, 0, 0.5);
    }
    .tbtn.on { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0, 0, 0, 0.5); filter: brightness(1.3); }
    #btn-attack {
      right: calc(env(safe-area-inset-right) + 24px); bottom: calc(env(safe-area-inset-bottom) + 30px);
      width: 96px; height: 96px; background: #ffcc33; font-size: 15px;
    }
    #menu-btn {
      position: fixed;
      top: calc(env(safe-area-inset-top) + 8px);
      right: calc(env(safe-area-inset-right) + 52px);
      background: rgba(0, 0, 0, 0.8);
      color: #ffcc33;
      border: 2px solid #ffcc33;
      padding: 5px 9px;
      font-size: 14px;
      border-radius: 4px;
      z-index: 30;
      cursor: pointer;
    }
    body.in-menu #menu-btn, body.in-menu #touch { display: none; }

    /* ── Menu (igual ao da Luta Elemental) ── */
    #menu {
      position: fixed; inset: 0; z-index: 40; display: none;
      align-items: center; justify-content: center; padding: 12px;
      background: rgba(10, 12, 26, 0.92);
      font-family: Arial, Helvetica, sans-serif;
    }
    body.in-menu #menu { display: flex; }
    .panel {
      position: relative; width: min(720px, 100%); max-height: 100%; overflow-y: auto;
      padding: 18px 16px 16px; text-align: center;
      border: 3px solid #f5c518; border-radius: 10px;
      background: radial-gradient(ellipse at center, #3b2a7a 0%, #241a52 55%, #160f36 100%);
      box-shadow: 0 0 40px rgba(245, 197, 24, 0.15);
    }
    .wallet { position: absolute; top: 10px; right: 14px; font-size: 16px; font-weight: bold; }
    .wallet .coin { color: #f5c518; }
    .user-tag { position: absolute; top: 12px; left: 14px; font-size: 12px; color: #c9b8ff; max-width: 45%; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .friends {
      position: absolute; top: 36px; right: 14px; width: 130px; text-align: left;
      background: rgba(20, 14, 50, 0.85); border: 2px solid #4a3a8a; border-radius: 6px; overflow: hidden;
    }
    .friends-title { background: #4a3a8a; color: #fff; font-weight: 900; font-size: 12px; letter-spacing: 1px; padding: 4px 8px; }
    #friends-list { list-style: none; min-height: 60px; max-height: 150px; overflow-y: auto; padding: 4px 0; font-size: 12px; }
    #friends-list li { padding: 3px 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #friends-list li::before { content: '● '; color: #2fd15a; }
    /* Só mostra na tela inicial; em tela estreita fica em cima, antes do título */
    .panel:not(:has(#page-main.on)) .friends { display: none; }
    @media (max-width: 620px) {
      .friends { position: static; width: auto; margin: 22px 0 4px; }
      #friends-list { min-height: 28px; max-height: 80px; }
    }
    .page { display: none; }
    .page.on { display: block; }
    h1 { margin: 14px 0 6px; line-height: 1; }
    h1 .t1 { display: block; color: #f5c518; font-size: clamp(30px, 8vw, 52px); font-weight: 900; }
    h1 .t2 { display: block; color: #ff6ad5; font-size: clamp(34px, 9vw, 60px); font-weight: 900; }
    h2 { color: #f5c518; font-size: 26px; margin: 8px 0 14px; }
    #hero { width: 96px; height: 96px; image-rendering: pixelated; display: block; margin: 8px auto 0; }
    .hero-shadow { width: 70px; height: 12px; margin: -8px auto 0; border-radius: 50%; background: rgba(0, 0, 0, 0.45); }
    .hero-name { font-weight: bold; font-size: 18px; margin-top: 6px; }
    .hero-sub { font-size: 12px; color: #c9c3e6; margin-top: 2px; }
    .row { display: flex; gap: 8px; justify-content: center; align-items: stretch; margin-top: 16px; flex-wrap: wrap; }
    .mbtn {
      border: 3px solid rgba(0, 0, 0, 0.35); border-radius: 4px; padding: 12px 10px; min-width: 120px;
      font-weight: bold; font-size: 13px; color: #10101a; cursor: pointer; font-family: inherit;
      box-shadow: inset 0 -4px 0 rgba(0, 0, 0, 0.2);
    }
    .mbtn:active { transform: translateY(2px); }
    .mbtn.big { font-size: 20px; min-width: 140px; }
    .cyan { background: #5ccfff; } .orange { background: #ff9a2e; } .green { background: #2fd15a; color: #fff; }
    .purple { background: #b06cff; color: #fff; } .yellow { background: #f5c518; }
    .back { margin-top: 14px; min-width: 140px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
    .card {
      background: rgba(20, 14, 50, 0.85); border: 2px solid #4a3a8a; border-radius: 8px; padding: 10px 6px;
      display: flex; flex-direction: column; align-items: center; gap: 4px;
    }
    .card.sel { border-color: #5ccfff; box-shadow: 0 0 0 2px #5ccfff; }
    .card canvas { width: 64px; height: 64px; image-rendering: pixelated; }
    .card .icon { font-size: 34px; line-height: 64px; height: 64px; }
    .card b { font-size: 14px; }
    .card small { font-size: 11px; color: #c9c3e6; min-height: 28px; }
    .card button { width: 100%; padding: 6px; border-radius: 4px; border: 2px solid rgba(0,0,0,0.35); font-weight: bold; cursor: pointer; font-family: inherit; }
    .card button:disabled { opacity: 0.45; cursor: default; }
    .pips { letter-spacing: 2px; color: #f5c518; font-size: 12px; }
    .rar-head { grid-column: 1 / -1; text-align: left; font-weight: 900; font-size: 15px; margin-top: 6px; padding-bottom: 2px; border-bottom: 2px solid currentColor; }
    .rar-tag { font-size: 10px; font-weight: 900; letter-spacing: 1px; padding: 1px 6px; border-radius: 3px; color: #10101a; background: currentColor; }
    .rar-tag { color: inherit; }
    .rar-raro { color: #7ddf64; } .rar-super { color: #5ccfff; } .rar-lenda { color: #ffb02e; } .rar-divino { color: #ff6ad5; }
    .rar-ultra { color: #fff; }
    .card.rar-raro, .card.rar-super, .card.rar-lenda, .card.rar-divino, .card.rar-ultra { color: #fff; }
    .card.rar-raro { border-color: #4f9a3e; } .card.rar-super { border-color: #2f8fc0; } .card.rar-lenda { border-color: #c07a10; }
    .card.rar-divino { border-color: #c03a9a; box-shadow: 0 0 12px rgba(255, 106, 213, 0.35); }
    .card.rar-ultra { border-color: transparent; background:
      linear-gradient(rgba(20, 14, 50, 0.92), rgba(20, 14, 50, 0.92)) padding-box,
      linear-gradient(90deg, #ff4a4a, #ffb02e, #ffe94a, #7ddf64, #5ccfff, #b06cff) border-box;
      box-shadow: 0 0 16px rgba(255, 255, 255, 0.3); }
    .card.sel { box-shadow: 0 0 0 3px #5ccfff; }
    .card .rar-tag { background: none; padding: 0; }
    .card.rar-raro .rar-tag { color: #7ddf64; } .card.rar-super .rar-tag { color: #5ccfff; } .card.rar-lenda .rar-tag { color: #ffb02e; }
    .card.rar-divino .rar-tag { color: #ff6ad5; }
    .card.rar-ultra .rar-tag, .rar-head.rar-ultra { background: linear-gradient(90deg, #ff4a4a, #ffb02e, #ffe94a, #7ddf64, #5ccfff, #b06cff); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .rar-head.rar-ultra { border-bottom-color: #fff; }
    .perks { list-style: none; font-size: 11px; color: #e6e0ff; min-height: 30px; }
    .perks li::before { content: '★ '; color: #f5c518; }
    #user-form { display: flex; flex-direction: column; gap: 12px; max-width: 360px; margin: 0 auto; text-align: left; }
    #user-form label { display: flex; flex-direction: column; gap: 4px; font-weight: bold; font-size: 14px; }
    #user-form input {
      padding: 12px; border-radius: 6px; border: 2px solid #4a3a8a; background: #120c30; color: #fff; font-size: 16px; outline: none;
    }
    #user-form input:focus { border-color: #5ccfff; }
    #u-msg { min-height: 18px; font-size: 13px; text-align: center; }
    #u-msg.err { color: #ff6a6a; } #u-msg.ok { color: #2fd15a; }

    #btn-swap {
      right: calc(env(safe-area-inset-right) + 132px); bottom: calc(env(safe-area-inset-bottom) + 24px);
      width: 66px; height: 66px; background: #66ccff; font-size: 12px;
    }
  </style>
</head>
<body class="in-menu">
  <a href="../index.html" id="back-link">← Menu</a>
  <button id="sound-btn" title="Som">🔊</button>
  <canvas id="game" width="320" height="208"></canvas>

  <button id="menu-btn" title="Menu">☰</button>

  <div id="touch">
    <div id="stick-zone"><div id="stick"><div id="stick-knob"></div></div></div>
    <button class="tbtn" id="btn-swap">TROCAR</button>
    <button class="tbtn" id="btn-attack">ATACAR</button>
  </div>

  <!-- Tela inicial no estilo da Luta Elemental -->
  <div id="menu">
    <div class="panel">
      <div class="wallet"><span class="coin">●</span> <b id="m-coins">0</b></div>
      <div id="m-user" class="user-tag"></div>
      <!-- Amigos online (a lista vai ser preenchida quando tiver o sistema de amigos) -->
      <div class="friends">
        <div class="friends-title">AMIGOS</div>
        <ul id="friends-list"></ul>
      </div>

      <div class="page" id="page-main">
        <h1><span class="t1">AVENTURA</span><span class="t2">ELEMENTAL</span></h1>
        <canvas id="hero" width="32" height="32"></canvas>
        <div class="hero-shadow"></div>
        <div class="hero-name" id="m-skin">EXPLORADOR</div>
        <div class="hero-sub" id="m-progress">Nova aventura</div>
        <div class="row">
          <button class="mbtn cyan" data-go="skins">PERSONAGENS</button>
          <button class="mbtn orange" data-go="shop">LOJA</button>
          <button class="mbtn green big" id="m-play">JOGAR</button>
          <button class="mbtn purple" data-go="user">USUÁRIO</button>
        </div>
      </div>

      <div class="page" id="page-skins">
        <h2>PERSONAGENS</h2>
        <div class="grid" id="skin-grid"></div>
        <button class="mbtn yellow back" data-go="main">◀ VOLTAR</button>
      </div>

      <div class="page" id="page-shop">
        <h2>LOJA</h2>
        <div class="grid" id="shop-grid"></div>
        <button class="mbtn yellow back" data-go="main">◀ VOLTAR</button>
      </div>

      <div class="page" id="page-user">
        <h2>USUÁRIO</h2>
        <form id="user-form" autocomplete="on" novalidate>
          <label>E-mail<input id="u-email" type="email" inputmode="email" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="seu@email.com" required></label>
          <label>Nome como quer ficar<input id="u-name" type="text" placeholder="Seu nome no jogo" required></label>
          <div id="u-msg"></div>
          <button class="mbtn green" type="submit">SALVAR</button>
        </form>
        <button class="mbtn yellow back" data-go="main">◀ VOLTAR</button>
      </div>
    </div>
  </div>

  <script src="game.js?v=6"></script>
</body>
</html>
