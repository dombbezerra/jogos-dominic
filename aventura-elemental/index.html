<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#10141f">
  <title>Aventura Elemental</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overscroll-behavior: none; }
    body {
      background: #10141f;
      color: #fff;
      font-family: 'Courier New', monospace;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: none;
    }
    #game {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      background: #000;
      border: 3px solid #000;
      box-shadow: 0 0 40px rgba(80, 160, 255, 0.25);
      /* cresce até caber na tela, mantendo a proporção 320 x 208 */
      width: min(100vw, calc(100vh * 320 / 208));
      height: auto;
      aspect-ratio: 320 / 208;
    }
    #back-link {
      position: fixed;
      top: calc(env(safe-area-inset-top) + 8px);
      left: calc(env(safe-area-inset-left) + 8px);
      background: rgba(0, 0, 0, 0.8);
      color: #ffcc33;
      border: 2px solid #ffcc33;
      padding: 5px 10px;
      font-family: inherit;
      font-size: 13px;
      font-weight: bold;
      text-decoration: none;
      border-radius: 4px;
      z-index: 30;
    }
    #sound-btn {
      position: fixed;
      top: calc(env(safe-area-inset-top) + 8px);
      right: calc(env(safe-area-inset-right) + 8px);
      background: rgba(0, 0, 0, 0.8);
      color: #ffcc33;
      border: 2px solid #ffcc33;
      padding: 5px 9px;
      font-size: 14px;
      border-radius: 4px;
      z-index: 30;
      cursor: pointer;
    }

    /* ── Controles de toque ── */
    #touch { position: fixed; inset: 0; pointer-events: none; z-index: 20; display: none; }
    body.touch #touch { display: block; }
    #stick-zone { position: absolute; left: 0; top: 0; bottom: 0; width: 50%; pointer-events: auto; }
    #stick {
      position: absolute; width: 120px; height: 120px; margin: -60px 0 0 -60px;
      border-radius: 50%; border: 3px solid rgba(255, 255, 255, 0.35); background: rgba(0, 0, 0, 0.25);
      display: none;
    }
    #stick-knob {
      position: absolute; left: 50%; top: 50%; width: 50px; height: 50px; margin: -25px 0 0 -25px;
      border-radius: 50%; background: rgba(255, 255, 255, 0.55);
    }
    .tbtn {
      position: absolute; pointer-events: auto; border-radius: 50%;
      border: 4px solid #000; font-family: inherit; font-weight: bold; color: #000;
      display: flex; align-items: center; justify-content: center; text-align: center;
      box-shadow: 0 4px 0 rgba(0, 0, 0, 0.5);
    }
    .tbtn.on { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0, 0, 0, 0.5); filter: brightness(1.3); }
    #btn-attack {
      right: calc(env(safe-area-inset-right) + 24px); bottom: calc(env(safe-area-inset-bottom) + 30px);
      width: 96px; height: 96px; background: #ffcc33; font-size: 15px;
    }
    #btn-swap {
      right: calc(env(safe-area-inset-right) + 132px); bottom: calc(env(safe-area-inset-bottom) + 24px);
      width: 66px; height: 66px; background: #66ccff; font-size: 12px;
    }
  </style>
</head>
<body>
  <a href="../index.html" id="back-link">← Menu</a>
  <button id="sound-btn" title="Som">🔊</button>
  <canvas id="game" width="320" height="208"></canvas>

  <div id="touch">
    <div id="stick-zone"><div id="stick"><div id="stick-knob"></div></div></div>
    <button class="tbtn" id="btn-swap">TROCAR</button>
    <button class="tbtn" id="btn-attack">ATACAR</button>
  </div>

  <script src="game.js?v=2"></script>
</body>
</html>
