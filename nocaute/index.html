<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#2a1d14">
  <title>Nocaute!</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: #2a1d14;
      font-family: Georgia, 'Times New Roman', serif;
      -webkit-user-select: none; user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: none;
      overscroll-behavior: none;
    }
    body {
      display: flex; align-items: center; justify-content: center;
      padding: max(6px, env(safe-area-inset-top)) max(6px, env(safe-area-inset-right))
               max(6px, env(safe-area-inset-bottom)) max(6px, env(safe-area-inset-left));
    }
    #wrap { position: relative; width: 100%; max-width: 1000px; }
    canvas {
      display: block; width: 100%; height: auto;
      aspect-ratio: 16 / 9;
      border: 6px solid #1a1410;
      border-radius: 4px;
      box-shadow: 0 0 0 3px #c9a227, 0 14px 40px rgba(0,0,0,.6);
      background: #e8d9b5;
      image-rendering: auto;
    }
    #back-link {
      position: fixed;
      top: calc(env(safe-area-inset-top) + 8px);
      left: calc(env(safe-area-inset-left) + 8px);
      background: #c9342b; color: #f4ead2;
      padding: 6px 13px; font-size: 13px; font-weight: bold;
      text-decoration: none; border-radius: 4px;
      border: 2px solid #1a1410;
      z-index: 100; font-family: Georgia, serif;
      letter-spacing: 1px;
    }

    /* ── Controles touch ──────────────────────────────────── */
    #touch { display: none; }
    body.touch #touch { display: block; }
    .tb {
      position: fixed; z-index: 40;
      display: flex; align-items: center; justify-content: center;
      border: 3px solid #1a1410; border-radius: 50%;
      background: #f4ead2; color: #1a1410;
      font: bold 13px Georgia, serif;
      box-shadow: 0 3px 0 #1a1410;
      text-align: center; line-height: 1.05;
    }
    .tb:active { transform: translateY(3px); box-shadow: none; }
    .mv { width: 58px; height: 58px; font-size: 22px; bottom: calc(env(safe-area-inset-bottom) + 18px); }
    #t-left  { left: calc(env(safe-area-inset-left) + 14px); }
    #t-right { left: calc(env(safe-area-inset-left) + 82px); }
    #t-soco  { right: calc(env(safe-area-inset-right) + 96px); bottom: calc(env(safe-area-inset-bottom) + 88px); width: 64px; height: 64px; background:#c9342b; color:#f4ead2; }
    #t-chute { right: calc(env(safe-area-inset-right) + 18px); bottom: calc(env(safe-area-inset-bottom) + 96px); width: 64px; height: 64px; background:#2f5fa8; color:#f4ead2; }
    #t-block { right: calc(env(safe-area-inset-right) + 22px); bottom: calc(env(safe-area-inset-bottom) + 18px); width: 60px; height: 60px; background:#e8b53a; }
    #t-pause { right: calc(env(safe-area-inset-right) + 20px); top: calc(env(safe-area-inset-top) + 10px); width: 44px; height: 44px; font-size: 18px; }
  </style>
</head>
<body>
  <a href="../index.html" id="back-link"
     onclick="if(window!==window.top){event.preventDefault();window.parent.postMessage({type:'closeGame'},'*');}">← Menu</a>

  <div id="wrap">
    <canvas id="tela" width="960" height="540"></canvas>
  </div>

  <div id="touch">
    <div class="tb mv" id="t-left">◀</div>
    <div class="tb mv" id="t-right">▶</div>
    <div class="tb" id="t-soco">SOCO</div>
    <div class="tb" id="t-chute">CHUTE</div>
    <div class="tb" id="t-block">DEFESA</div>
    <div class="tb" id="t-pause">⏸</div>
  </div>

  <script src="game.js?v=3"></script>
</body>
</html>
