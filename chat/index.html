<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Chat de Amigos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --tinta: #0e0c33; --noite: #15134a; --noite-2: #2a2380; --creme: #fff6dc;
      --sol: #ffd23f; --rosa: #ff5d8f; --agua: #3fe0d0; --roxo: #b06cff; --verde: #2fd15a;
      --display: 'Bungee', 'Arial Black', Impact, sans-serif;
      --texto: 'Baloo 2', 'Segoe UI', Arial, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: var(--texto); color: var(--creme); -webkit-tap-highlight-color: transparent;
      background: radial-gradient(circle at 50% -10%, var(--noite-2) 0%, transparent 60%), var(--noite);
      display: flex; flex-direction: column; align-items: center;
    }
    #back-link {
      position: fixed; top: 10px; left: 10px; z-index: 10; text-decoration: none;
      font-weight: 800; background: var(--sol); color: var(--tinta); border: 3px solid var(--tinta);
      border-radius: 12px; padding: 4px 12px; box-shadow: 0 4px 0 var(--tinta);
    }
    #back-link:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--tinta); }
    .app { width: min(720px, 100%); height: 100%; display: flex; flex-direction: column; padding: 56px 10px 10px; }
    h1 { font-family: var(--display); font-weight: 400; text-align: center; font-size: clamp(26px, 6vw, 38px); line-height: 1; }
    h1 span { color: var(--sol); }
    .eu { text-align: center; font-size: 14px; opacity: 0.85; margin: 4px 0 10px; min-height: 20px; }

    #list {
      flex: 1; min-height: 0; overflow-y: auto; list-style: none; padding: 10px;
      background: rgba(0, 0, 0, 0.25); border: 3px solid var(--tinta); border-radius: 18px; box-shadow: inset 0 2px 10px rgba(0,0,0,0.4);
      display: flex; flex-direction: column; gap: 8px;
    }
    #list li { max-width: 82%; align-self: flex-start; background: #2e2366; border: 2px solid #4a3a8a; border-radius: 16px 16px 16px 4px; padding: 6px 10px 8px; }
    #list li.mine { align-self: flex-end; background: #1f6a4a; border-color: #2fa070; border-radius: 16px 16px 4px 16px; }
    #list li.info { align-self: center; max-width: 100%; background: none; border: none; text-align: center; opacity: 0.85; }
    .who { display: flex; align-items: center; gap: 6px; font-weight: 800; font-size: 14px; }
    .bola { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: 15px; color: var(--tinta); font-weight: 800; flex: none; background: #3a2f80; overflow: hidden; line-height: 1; }
    .bola svg { width: 118%; height: 118%; }
    .hora { font-weight: 500; font-size: 11px; opacity: 0.6; }
    .txt { font-size: 16px; line-height: 1.3; overflow-wrap: anywhere; margin-top: 2px; }
    .arco { background: linear-gradient(90deg, #ff5d5d, #ffb02e, #ffe36b, #5fe08a, #5cb8ff, #b06cff); -webkit-background-clip: text; background-clip: text; color: transparent; }

    form { display: flex; gap: 6px; margin-top: 10px; }
    #input { flex: 1; min-width: 0; padding: 10px 12px; font-size: 16px; border-radius: 14px; border: 3px solid var(--tinta); background: var(--creme); color: var(--tinta); font-family: inherit; font-weight: 700; }
    .btn { font-family: var(--texto); font-weight: 800; font-size: 16px; cursor: pointer; border: 3px solid var(--tinta); border-radius: 14px; padding: 0 14px; color: #fff; box-shadow: 0 4px 0 var(--tinta); }
    .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--tinta); }
    #gif-btn { background: var(--roxo); } #send { background: var(--verde); font-size: 20px; }
    #audio-btn { background: var(--sol); color: var(--tinta); font-size: 20px; white-space: nowrap; }
    #audio-btn.gravando { background: #ff3b3b; color: #fff; font-size: 15px; animation: gravando 1s ease-in-out infinite; }
    @keyframes gravando { 50% { box-shadow: 0 4px 0 var(--tinta), 0 0 0 6px rgba(255, 59, 59, 0.35); } }
    .audio { display: inline-flex; align-items: center; gap: 8px; margin-top: 4px; font-family: inherit; font-weight: 800; font-size: 15px; cursor: pointer;
      background: var(--creme); color: var(--tinta); border: 3px solid var(--tinta); border-radius: 999px; padding: 4px 14px 2px 8px; }
    .audio .onda { letter-spacing: 1px; opacity: 0.7; }
    .audio.tocando { background: var(--sol); }
    #perso-btn {
      position: fixed; top: 10px; right: 10px; z-index: 10; font-family: var(--texto); font-weight: 800; font-size: 15px; cursor: pointer;
      background: var(--agua); color: var(--tinta); border: 3px solid var(--tinta); border-radius: 12px; padding: 4px 12px; box-shadow: 0 4px 0 var(--tinta);
    }
    #perso-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--tinta); }
    #perso { position: fixed; inset: 0; z-index: 20; background: rgba(5, 4, 25, 0.75); display: none; align-items: center; justify-content: center; padding: 12px; }
    #perso.on { display: flex; }
    .caixa { width: min(560px, 100%); max-height: 100%; overflow-y: auto; background: var(--noite); border: 4px solid var(--tinta); border-radius: 22px; box-shadow: 0 0 0 3px var(--sol), 0 8px 0 var(--tinta); padding: 16px; }
    .caixa h2 { font-family: var(--display); font-weight: 400; text-align: center; font-size: 24px; color: var(--sol); }
    .previa { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 12px 0; font-weight: 800; font-size: 22px; background: #2e2366; border-radius: 16px; padding: 10px; }
    .previa .bola { width: 56px; height: 56px; font-size: 32px; }
    .caixa .sec { margin-top: 12px; }
    .fotos { display: flex; flex-wrap: wrap; gap: 6px; }
    .fotos button { width: 50px; height: 50px; border-radius: 50%; background: #2e2366; border: 3px solid #4a3a8a; font-size: 26px; cursor: pointer; display: grid; place-items: center; padding: 0; overflow: hidden; }
    .fotos button.on, .cores button.on { border-color: var(--sol); box-shadow: 0 0 0 3px var(--sol); }
    .fotos button svg { width: 100%; height: 100%; }
    #p-nome { width: 100%; padding: 10px 12px; font-size: 18px; border-radius: 14px; border: 3px solid var(--tinta); background: var(--creme); color: var(--tinta); font-family: inherit; font-weight: 800; }
    .aviso-adm { font-size: 13px; color: #b9f5d0; margin-top: 4px; }
    .cores { display: flex; flex-wrap: wrap; gap: 8px; }
    .cores button { font-family: inherit; font-weight: 800; font-size: 15px; padding: 6px 12px; border-radius: 12px; background: #2e2366; border: 3px solid #4a3a8a; cursor: pointer; }
    .cores button:disabled { opacity: 0.45; cursor: default; }
    .botoes { display: flex; gap: 10px; justify-content: center; margin-top: 16px; }
    .botoes .btn { padding: 8px 18px; }
    #p-salvar { background: var(--verde); } #p-fechar { background: var(--rosa); }
    #p-msg { text-align: center; min-height: 20px; margin-top: 8px; font-weight: 700; color: var(--sol); }
    .limpar { align-self: center; margin-bottom: 8px; background: none; border: 2px solid #e04848; color: #ff8a8a; border-radius: 10px; padding: 3px 12px; font-weight: 800; font-size: 13px; cursor: pointer; font-family: inherit; }
    .limpar.armado { background: #e04848; color: #fff; }
    #msg { min-height: 20px; font-size: 13px; color: #ff9a9a; margin-top: 4px; text-align: center; }

    #picker { display: none; max-height: 42vh; overflow-y: auto; margin-top: 8px; padding: 8px; background: rgba(0,0,0,0.3); border: 3px solid var(--tinta); border-radius: 16px; }
    #picker.on { display: block; }
    .sec { font-family: var(--display); font-size: 14px; color: var(--sol); margin: 6px 2px; }
    .grade { display: flex; flex-wrap: wrap; gap: 6px; }
    .grade button { background: #2e2366; border: 2px solid #4a3a8a; border-radius: 12px; width: 58px; height: 58px; cursor: pointer; display: grid; place-items: center; }
    .grade button:active { transform: scale(0.92); }
    .dica { font-size: 13px; opacity: 0.8; margin: 4px 2px; }
    .dica a { color: var(--sol); }

    /* GIFs: emojis grandes que se mexem (os mesmos do chat da Aventura) */
    .gif { display: inline-block; font-size: 32px; line-height: 1; }
    .txt .gif { font-size: 56px; margin: 4px 4px 0; }
    .gif-pula { animation: gif-pula 0.6s ease-in-out infinite alternate; }
    .gif-treme { animation: gif-treme 0.25s linear infinite; }
    .gif-gira { animation: gif-gira 1.2s linear infinite; }
    .gif-bate { animation: gif-bate 0.8s ease-in-out infinite; }
    .gif-balanca { animation: gif-balanca 0.9s ease-in-out infinite alternate; }
    .gif-pisca { animation: gif-pisca 0.5s steps(2) infinite; }
    .gif-arco { animation: gif-arco 1.5s linear infinite; }
    @keyframes gif-pula { from { transform: translateY(0); } to { transform: translateY(-10px); } }
    @keyframes gif-treme { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-3px) rotate(-5deg); } 75% { transform: translateX(3px) rotate(5deg); } }
    @keyframes gif-gira { to { transform: rotate(360deg); } }
    @keyframes gif-bate { 0%, 100% { transform: scale(1); } 30% { transform: scale(1.3); } 60% { transform: scale(0.95); } }
    @keyframes gif-balanca { from { transform: rotate(-15deg); } to { transform: rotate(15deg); } }
    @keyframes gif-pisca { 50% { opacity: 0.2; } }
    @keyframes gif-arco {
      0% { filter: hue-rotate(0deg) drop-shadow(0 0 4px #ff4a4a); } 33% { filter: hue-rotate(120deg) drop-shadow(0 0 4px #7ddf64); }
      66% { filter: hue-rotate(240deg) drop-shadow(0 0 4px #5ccfff); } 100% { filter: hue-rotate(360deg) drop-shadow(0 0 4px #ff4a4a); }
    }
    /* Emojis do Monta Emoji */
    .gif-emoji { width: 1.3em; height: 1.3em; vertical-align: middle; }
    .gif-emoji svg { width: 100%; height: 100%; display: block; animation: gif-emoji 1.2s ease-in-out infinite; }
    .txt .gif-emoji { font-size: 76px; }
    @keyframes gif-emoji { 0%, 100% { transform: translateY(0) rotate(0); } 25% { transform: translateY(-8%) rotate(-7deg); } 75% { transform: translateY(-4%) rotate(7deg); } }
    @media (prefers-reduced-motion: reduce) { .gif, .gif * , .gif-emoji svg { animation: none !important; } }
  </style>
</head>
<body>
  <a href="../index.html" id="back-link">← Menu</a>
  <button id="perso-btn" style="display:none">✏️ PERSONALIZAR</button>
  <div id="perso">
    <div class="caixa">
      <h2>✏️ PERSONALIZAR</h2>
      <div class="previa" id="p-previa"></div>
      <div class="sec">📸 FOTO</div>
      <div class="fotos" id="p-fotos"></div>
      <div class="sec">✍️ NOME</div>
      <input id="p-nome" maxlength="20" autocomplete="off">
      <div class="aviso-adm" id="p-aviso"></div>
      <div class="sec">🎨 COR DO NOME</div>
      <div class="cores" id="p-cores"></div>
      <div class="dica" id="p-dica"></div>
      <div class="botoes">
        <button class="btn" id="p-fechar">CANCELAR</button>
        <button class="btn" id="p-salvar">💾 SALVAR</button>
      </div>
      <div id="p-msg"></div>
    </div>
  </div>
  <div class="app">
    <h1>💬 CHAT DE <span>AMIGOS</span></h1>
    <div class="eu" id="eu"></div>
    <button class="limpar" id="limpar" style="display:none">🗑️ APAGAR CONVERSAS</button>
    <ul id="list"></ul>
    <div id="picker"></div>
    <form id="form" style="display:none">
      <button type="button" class="btn" id="audio-btn" title="Mandar áudio">🎤</button>
      <button type="button" class="btn" id="gif-btn" title="Os emojis que você montou">GIF</button>
      <input id="input" maxlength="200" placeholder="Escreva aqui..." autocomplete="off">
      <button class="btn" id="send" title="Mandar">➤</button>
    </form>
    <div id="msg"></div>
  </div>

  <script src="../monta-emoji/emoji.js?v=1"></script>
  <script>
  (() => {
    const $ = id => document.getElementById(id);
    const el = (tag, text, cls) => { const e = document.createElement(tag); if (text != null) e.textContent = text; if (cls) e.className = cls; return e; };
    const PERFIL = new URLSearchParams(location.search).get('perfil');
    const KEY = 'aventuraConta' + (PERFIL ? ':' + PERFIL : '');   // a mesma conta da Aventura Elemental
    const conta = () => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } };
    const eu = () => conta().user;

    // GIFs antigos do chat da Aventura (só pra mostrar mensagens de antes): [id, emoji, jeito de mexer, preço, moeda, arco-íris]
    const GIFS = [
      ['rindo', '😂', 'pula'], ['fogo', '🔥', 'treme'], ['festa', '🎉', 'gira'], ['joinha', '👍', 'bate'],
      ['oculos', '😎', 'balanca'], ['caveira', '💀', 'treme'], ['coracao', '❤️', 'bate'], ['trofeu', '🏆', 'pula'],
      ['raio', '⚡', 'pisca'], ['chorando', '😭', 'treme'], ['susto', '😱', 'bate'], ['danca', '🕺', 'balanca'],
      ['dragao', '🐉', 'balanca', 60], ['foguete', '🚀', 'pula', 60], ['alien', '👽', 'treme', 60],
      ['robo', '🤖', 'balanca', 60], ['unicornio', '🦄', 'pula', 100], ['coroa', '👑', 'bate', 100],
      ['diamante', '💎', 'gira', 100], ['ninja', '🥷', 'treme', 100],
      ['rindoarco', '😂', 'pula', 30, 1, true], ['fogoarco', '🔥', 'treme', 30, 1, true],
      ['coracaoarco', '❤️', 'bate', 30, 1, true], ['joinhaarco', '👍', 'bate', 30, 1, true],
      ['estrelaarco', '⭐', 'gira', 40, 1, true], ['oculosarco', '😎', 'balanca', 40, 1, true],
      ['arcoiris', '🌈', 'pula', 40, 1, true], ['dragaoarco', '🐉', 'balanca', 60, 1, true],
      ['coroaarco', '👑', 'bate', 60, 1, true],
    ];
    function gifEl(id) {
      const g = GIFS.find(x => x[0] === id);
      if (!g) return el('span', '');
      const inner = el('span', g[1], 'gif gif-' + g[2]);
      if (!g[5]) return inner;
      const wrap = el('span', null, 'gif gif-arco');
      wrap.appendChild(inner);
      return wrap;
    }
    function emojiEl(e) {
      const sp = el('span', null, 'gif gif-emoji');
      if (window.MontaEmoji) sp.innerHTML = MontaEmoji.desenha(MontaEmoji.limpa(e));
      else sp.textContent = '😀';
      return sp;
    }
    const CORES = { branco: '#ffffff', verde: '#5df07a', azul: '#5ccfff', vermelho: '#ff5a5a', laranja: '#ff9a2e', roxo: '#b06cff', rosa: '#ff6ad5', dourado: '#ffd23a' };
    function nomeEl(nome, cor) {
      const s = el('span', nome);
      if (cor === 'arcoiris') s.className = 'arco'; else s.style.color = CORES[cor] || '#fff';
      return s;
    }

    // Foto do chat: um emoji, um emoji montado, ou a primeira letra do nome
    function fotoEl(f, nome, cor) {
      const b = el('span', null, 'bola');
      if (f && f.e) b.textContent = f.e;
      else if (f && f.m && window.MontaEmoji) b.innerHTML = MontaEmoji.desenha(MontaEmoji.limpa(f.m));
      else { b.textContent = (nome || '?').slice(0, 1).toUpperCase(); b.style.background = CORES[cor] || '#ffd23f'; }
      return b;
    }

    async function api(body) {
      const r = await fetch('/api/conta/', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(d.error || 'Não deu agora.');
      return d;
    }

    // ── Mensagens ──
    let msgs = [], ultimo = 0, membro = null, ocupado = false;
    function info(t) { const l = $('list'); l.innerHTML = ''; l.appendChild(el('li', t, 'info')); }
    function render() {
      const u = eu();
      $('form').style.display = u && membro ? '' : 'none';
      if (!u) {
        $('eu').textContent = '';
        const l = $('list'); l.innerHTML = '';
        const li = el('li', null, 'info');
        li.innerHTML = 'Pra usar o chat, entre com seu e-mail na <a href="../aventura-elemental/' + (PERFIL ? '?perfil=' + encodeURIComponent(PERFIL) : '') + '" style="color:#ffd23f">Aventura Elemental</a> (botão USUÁRIO).';
        l.appendChild(li);
        return;
      }
      $('eu').textContent = 'Você é ';
      $('eu').appendChild(nomeEl(meuNomeChat || u.nome, conta().nameColor));
      if (membro === null) return info('Carregando...');
      if (!membro) return info('🔒 O chat é só pra convidados. Peça pro ADM te convidar!');
      const l = $('list');
      const noFim = l.scrollHeight - l.scrollTop - l.clientHeight < 60;
      l.innerHTML = '';
      if (!msgs.length) l.appendChild(el('li', 'Ninguém falou nada ainda. Diga oi! 👋', 'info'));
      for (const m of msgs) {
        const li = el('li', null, m.nome === u.nome || m.nome === meuNomeChat ? 'mine' : '');
        const who = el('div', null, 'who');
        const bola = fotoEl(m.fotoChat, m.nome, m.cor);
        const d = new Date(m.t);
        who.append(bola, nomeEl(m.nome, m.cor), el('span', String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'), 'hora'));
        const txt = el('div', m.texto || null, 'txt');
        if (m.gif) txt.appendChild(gifEl(m.gif));
        if (m.emoji) txt.appendChild(emojiEl(m.emoji));
        if (m.audio) txt.appendChild(audioEl(m.audio));
        li.append(who, txt);
        l.appendChild(li);
      }
      if (noFim || ocupado) l.scrollTop = l.scrollHeight;
      botaoLimpar();
    }
    function junta(d) {
      membro = !!(d && d.membro);
      if (d && d.limpo) msgs = msgs.filter(m => m.id > d.limpo);   // o ADM apagou as conversas
      for (const m of (d && d.msgs) || []) if (m.id > ultimo) { msgs.push(m); ultimo = m.id; }
      msgs = msgs.slice(-100);
    }
    async function ler() {
      const u = eu();
      if (!u) return render();
      try { junta(await api({ action: 'chatLer', email: u.email, desde: ultimo })); } catch (e) { return; }
      render();
    }
    async function mandar(texto, gif, emoji, audio) {
      const u = eu();
      if (!u || ocupado) return;
      ocupado = true;
      $('msg').textContent = '';
      try {
        if (audio) $('msg').textContent = '📤 Mandando áudio...';
        junta(await api({ action: 'chatEnviar', email: u.email, texto, gif, emoji, audio, desde: ultimo }));
        $('msg').textContent = '';
        $('input').value = '';
        $('picker').classList.remove('on');
        render();
      } catch (e) { $('msg').textContent = e.message; }
      ocupado = false;
    }
    $('form').addEventListener('submit', e => { e.preventDefault(); const t = $('input').value.trim(); if (t) mandar(t, null, null); });

    // ── GIFs: os emojis que você montou no Monta Emoji (se mexem igual GIF) ──
    function picker() {
      const p = $('picker');
      if (p.classList.contains('on')) { p.classList.remove('on'); return; }
      p.innerHTML = '';
      p.classList.add('on');
      p.appendChild(el('div', '🎞️ MEUS GIFS', 'sec'));
      const g = el('div', 'Carregando...', 'dica');
      p.appendChild(g);
      const link = '../monta-emoji/' + (PERFIL ? '?perfil=' + encodeURIComponent(PERFIL) : '');
      api({ action: 'figurinhas', email: eu().email }).then(d => {
        const figs = d.figurinhas || [];
        g.textContent = '';
        if (!figs.length) {
          g.innerHTML = 'Você ainda não tem GIFs. Monte um emoji no <a href="' + link + '">MONTA EMOJI</a> e aperte 💬 SALVAR GIF!';
          return;
        }
        g.className = 'grade';
        for (const e of figs) {
          const b = el('button'); b.type = 'button'; b.appendChild(emojiEl(e));
          b.onclick = () => mandar('', null, e);
          g.appendChild(b);
        }
        const mais = el('div', null, 'dica');
        mais.innerHTML = '<a href="' + link + '">➕ Fazer mais GIFs</a>';
        p.appendChild(mais);
      }).catch(() => { g.textContent = 'Não deu pra carregar seus GIFs.'; });
    }
    $('gif-btn').onclick = picker;

    // ── Áudio: toca no 🎤 pra gravar, toca de novo pra mandar (até 20 segundos) ──
    let grava = null;
    const tipoAudio = () => ['audio/webm;codecs=opus', 'audio/mp4', 'audio/webm', 'audio/ogg'].find(t => window.MediaRecorder && MediaRecorder.isTypeSupported(t)) || '';
    async function comecaGravar() {
      if (!navigator.mediaDevices || !window.MediaRecorder) { $('msg').textContent = 'Esse aparelho não grava áudio.'; return; }
      let stream;
      try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
      catch (e) { $('msg').textContent = '🎤 Precisa deixar o site usar o microfone.'; return; }
      const tipo = tipoAudio();
      const rec = new MediaRecorder(stream, tipo ? { mimeType: tipo, audioBitsPerSecond: 32000 } : { audioBitsPerSecond: 32000 });
      const partes = [];
      grava = { rec, stream, inicio: Date.now(), cancela: false };
      rec.ondataavailable = e => { if (e.data && e.data.size) partes.push(e.data); };
      rec.onstop = async () => {
        stream.getTracks().forEach(t => t.stop());
        const g = grava; grava = null; botaoAudio();
        if (g.cancela) return;
        const dur = (Date.now() - g.inicio) / 1000;
        if (dur < 0.7) { $('msg').textContent = 'Muito curtinho! Toque no 🎤, fale e toque de novo.'; return; }
        const blob = new Blob(partes, { type: rec.mimeType || tipo || 'audio/webm' });
        const dados = await new Promise(ok => { const fr = new FileReader(); fr.onload = () => ok(String(fr.result).split(',')[1] || ''); fr.readAsDataURL(blob); });
        mandar('', null, null, { dados, tipo: (rec.mimeType || tipo || 'audio/webm').split(';')[0], dur });
      };
      rec.start();
      botaoAudio();
      grava.timer = setInterval(() => {
        if (!grava) return;
        const t = (Date.now() - grava.inicio) / 1000;
        if (t >= 20) grava.rec.stop(); else botaoAudio();
      }, 250);
    }
    function botaoAudio() {
      const b = $('audio-btn');
      if (grava) {
        const t = Math.floor((Date.now() - grava.inicio) / 1000);
        b.classList.add('gravando'); b.textContent = '⏹ 0:' + String(t).padStart(2, '0');
      } else { b.classList.remove('gravando'); b.textContent = '🎤'; }
    }
    $('audio-btn').onclick = () => {
      if (grava) { clearInterval(grava.timer); grava.rec.stop(); }
      else { $('picker').classList.remove('on'); comecaGravar(); }
    };
    // Tocar um áudio que chegou
    const audios = {};
    let tocandoAgora = null;
    function audioEl(a) {
      const b = el('button', null, 'audio');
      b.type = 'button';
      const seg = Math.round(a.dur || 1);
      b.append(el('span', '▶️'), el('span', '▮▯▮▮▯▮▯▮▮', 'onda'), el('span', '0:' + String(seg).padStart(2, '0')));
      b.onclick = async () => {
        if (tocandoAgora) { tocandoAgora.pause(); tocandoAgora.botao.classList.remove('tocando'); tocandoAgora.botao.firstChild.textContent = '▶️'; if (tocandoAgora.botao === b) { tocandoAgora = null; return; } }
        try {
          if (!audios[a.id]) { const d = await api({ action: 'chatAudio', email: eu().email, id: a.id }); audios[a.id] = 'data:' + d.tipo + ';base64,' + d.dados; }
          const som = new Audio(audios[a.id]);
          som.botao = b; tocandoAgora = som;
          b.classList.add('tocando'); b.firstChild.textContent = '🔊';
          som.onended = () => { b.classList.remove('tocando'); b.firstChild.textContent = '▶️'; if (tocandoAgora === som) tocandoAgora = null; };
          await som.play();
        } catch (e) { b.classList.remove('tocando'); b.firstChild.textContent = '▶️'; $('msg').textContent = e.message || 'Não deu pra tocar esse áudio.'; }
      };
      return b;
    }

    // ── PERSONALIZAR: foto, nome e cor do nome ──
    const FOTOS = ['😀', '😎', '🤩', '😜', '🥳', '😇', '🤠', '👻', '🤖', '👽', '😈', '🤡', '🐶', '🐱', '🦊', '🐼', '🐸', '🦁', '🐯', '🐵',
      '🦄', '🐲', '🦖', '🐙', '🦈', '⚽', '🏆', '🎮', '🚀', '⭐', '🔥', '💎', '👑', '🌈', '⚡', '🍕', '🍩', '🎃', '❄️', '💀'];
    const NOMES_COR = { branco: 'Branco', verde: 'Verde', azul: 'Azul', vermelho: 'Vermelho', laranja: 'Laranja', roxo: 'Roxo', rosa: 'Rosa', dourado: 'Dourado', arcoiris: 'Arco-íris' };
    let minhaFoto = null, meuNomeChat = null, nomeConta = null, pFoto = null, pCor = 'branco';
    const minhasCores = () => adm ? Object.keys(NOMES_COR) : ['branco', ...(conta().colors || [])];
    function previa() {
      const p = $('p-previa');
      p.innerHTML = '';
      const n = $('p-nome').value.trim() || eu().nome;
      p.append(fotoEl(pFoto, n, pCor), nomeEl(n, pCor));
    }
    function abrirPerso() {
      const u = eu();
      pFoto = minhaFoto; pCor = conta().nameColor || 'branco';
      $('p-nome').value = meuNomeChat || u.nome;
      $('p-msg').textContent = '';
      $('p-aviso').textContent = 'Esse nome aparece só no chat. Na Aventura você continua ' + (nomeConta || u.nome) + (adm ? ' e continua ADM 👑' : '') + '.';
      const fotos = $('p-fotos');
      fotos.innerHTML = '';
      const botaoFoto = (f, conteudo) => {
        const b = el('button'); b.type = 'button';
        if (typeof conteudo === 'string') b.textContent = conteudo; else b.appendChild(conteudo);
        if (JSON.stringify(f) === JSON.stringify(pFoto)) b.classList.add('on');
        b.onclick = () => { pFoto = f; fotos.querySelectorAll('button').forEach(x => x.classList.remove('on')); b.classList.add('on'); previa(); };
        fotos.appendChild(b);
      };
      botaoFoto(null, 'Aa');
      for (const e of FOTOS) botaoFoto({ e }, e);
      // Os emojis que você montou também viram foto
      api({ action: 'figurinhas', email: u.email }).then(d => {
        for (const m of (d.figurinhas || []).slice(0, 20)) {
          const sp = el('span'); sp.innerHTML = MontaEmoji.desenha(MontaEmoji.limpa(m));
          botaoFoto({ m: MontaEmoji.limpa(m) }, sp.firstChild);
        }
      }).catch(() => {});
      const cores = $('p-cores');
      cores.innerHTML = '';
      const tenho = minhasCores();
      for (const id of Object.keys(NOMES_COR)) {
        const b = el('button'); b.type = 'button';
        const t = nomeEl(NOMES_COR[id], id);
        b.appendChild(t);
        if (!tenho.includes(id)) { b.disabled = true; b.appendChild(document.createTextNode(' 🔒')); }
        if (id === pCor) b.classList.add('on');
        b.onclick = () => { pCor = id; cores.querySelectorAll('button').forEach(x => x.classList.remove('on')); b.classList.add('on'); previa(); };
        cores.appendChild(b);
      }
      $('p-dica').textContent = tenho.length < Object.keys(NOMES_COR).length ? '🔒 As outras cores você compra na loja da Aventura Elemental.' : '';
      previa();
      $('perso').classList.add('on');
    }
    $('p-nome').addEventListener('input', previa);
    $('perso-btn').onclick = abrirPerso;
    $('p-fechar').onclick = () => $('perso').classList.remove('on');
    $('perso').addEventListener('click', e => { if (e.target.id === 'perso') $('perso').classList.remove('on'); });
    $('p-salvar').onclick = async () => {
      const u = eu(), c = conta();
      const nome = $('p-nome').value.trim().slice(0, 20);
      if (!nome) { $('p-msg').textContent = 'Escreva um nome!'; return; }
      $('p-salvar').disabled = true;
      $('p-msg').textContent = 'Salvando...';
      try {
        // Cor: a mesma do usuário da Aventura (o nome, a foto e a moldura de lá continuam iguais)
        // (usa o nome da conta que está no servidor, pra nunca trocar o nome da conta sem querer)
        if (pCor !== (c.nameColor || 'branco')) await api({ email: u.email, nome: nomeConta || u.nome, cor: pCor, foto: c.avatar || 'skin:gotinha', moldura: c.frame || 'nenhuma' });
        // Foto e nome: só do chat
        const d = await api({ action: 'fotoChat', email: u.email, fotoChat: pFoto, nomeChat: nome });
        minhaFoto = d.fotoChat; meuNomeChat = d.nomeChat;
        const novo = conta();
        novo.nameColor = pCor;
        try { localStorage.setItem(KEY, JSON.stringify(novo)); } catch (e) { /* ok */ }
        $('p-msg').textContent = '✅ Pronto! As próximas mensagens vão com o seu visual novo.';
        render();
        setTimeout(() => $('perso').classList.remove('on'), 1200);
      } catch (e) { $('p-msg').textContent = e.message; }
      $('p-salvar').disabled = false;
    };

    // ADM: só ele vê o botão de apagar todas as conversas (toca duas vezes)
    let adm = false;
    function botaoLimpar() { $('limpar').style.display = adm && membro && msgs.length ? '' : 'none'; }
    if (eu()) {
      $('perso-btn').style.display = '';
      api({ action: 'online', email: eu().email }).then(d => { adm = !!d.adm; botaoLimpar(); }).catch(() => {});
      // A foto do chat que eu já escolhi
      api({ action: 'fotoChat', email: eu().email, ler: true }).then(d => { minhaFoto = d.fotoChat || null; meuNomeChat = d.nomeChat || null; nomeConta = d.nome || null; render(); }).catch(() => {});
    }
    $('limpar').onclick = async () => {
      const b = $('limpar');
      if (!b.classList.contains('armado')) {
        b.classList.add('armado'); b.textContent = '🗑️ APAGAR TUDO? Toque de novo';
        setTimeout(() => { b.classList.remove('armado'); b.textContent = '🗑️ APAGAR CONVERSAS'; }, 4000);
        return;
      }
      b.disabled = true;
      try { await api({ action: 'admin-limpar-chat', email: eu().email }); msgs = []; render(); }
      catch (e) { $('msg').textContent = 'Não deu pra apagar agora.'; }
      b.disabled = false; b.classList.remove('armado'); b.textContent = '🗑️ APAGAR CONVERSAS';
    };

    render();
    ler();
    // Olha mensagem nova a cada 2,5 segundos (só com a página aberta na tela)
    setInterval(() => { if (!document.hidden) ler(); }, 2500);
  })();
  </script>
</body>
