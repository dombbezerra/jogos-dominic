<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Chat de Amigos</title>
  <!-- pra dar pra pôr na tela de início (no iPhone o aviso só funciona assim) -->
  <link rel="manifest" id="manifesto" href="/manifest.json">
  <script>if (new URLSearchParams(location.search).get('sala') === 'amigos') document.getElementById('manifesto').href = '/chat/amigos.webmanifest';</script>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --tinta: #0e0c33; --noite: #15134a; --noite-2: #2a2380; --creme: #fff6dc;
      --sol: #ffd23f; --rosa: #ff5d8f; --agua: #3fe0d0; --roxo: #b06cff; --verde: #2fd15a;
      --display: 'Bungee', 'Arial Black', Impact, sans-serif;
      --texto: 'Baloo 2', 'Segoe UI', Arial, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: var(--texto); color: var(--creme); -webkit-tap-highlight-color: transparent;
      background: radial-gradient(circle at 50% -10%, var(--noite-2) 0%, transparent 60%), var(--noite);
      display: flex; flex-direction: column; align-items: center;
    }
    #back-link {
      position: fixed; top: 10px; left: 10px; z-index: 10; text-decoration: none;
      font-weight: 800; background: var(--sol); color: var(--tinta); border: 3px solid var(--tinta);
      border-radius: 12px; padding: 4px 12px; box-shadow: 0 4px 0 var(--tinta);
    }
    #back-link:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--tinta); }
    .app { width: min(720px, 100%); height: 100%; display: flex; flex-direction: column; padding: 56px 10px 10px; }
    h1 { font-family: var(--display); font-weight: 400; text-align: center; font-size: clamp(26px, 6vw, 38px); line-height: 1; }
    h1 span { color: var(--sol); }
    .eu { text-align: center; font-size: 14px; opacity: 0.85; margin: 4px 0 10px; min-height: 20px; }

    #list {
      flex: 1; min-height: 0; overflow-y: auto; list-style: none; padding: 10px;
      background: rgba(0, 0, 0, 0.25); border: 3px solid var(--tinta); border-radius: 18px; box-shadow: inset 0 2px 10px rgba(0,0,0,0.4);
      display: flex; flex-direction: column; gap: 8px;
    }
    #list li { max-width: 82%; align-self: flex-start; background: #2e2366; border: 2px solid #4a3a8a; border-radius: 16px 16px 16px 4px; padding: 6px 10px 8px; }
    #list li.mine { align-self: flex-end; background: #1f6a4a; border-color: #2fa070; border-radius: 16px 16px 4px 16px; }
    #list li.info { align-self: center; max-width: 100%; background: none; border: none; text-align: center; opacity: 0.85; }
    .who { display: flex; align-items: center; gap: 6px; font-weight: 800; font-size: 14px; }
    .bola { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: 15px; color: var(--tinta); font-weight: 800; flex: none; background: #3a2f80; overflow: hidden; line-height: 1; }
    .bola svg { width: 118%; height: 118%; }
    .hora { font-weight: 500; font-size: 11px; opacity: 0.6; }
    .txt { font-size: 16px; line-height: 1.3; overflow-wrap: anywhere; margin-top: 2px; }
    .arco { background: linear-gradient(90deg, #ff5d5d, #ffb02e, #ffe36b, #5fe08a, #5cb8ff, #b06cff); -webkit-background-clip: text; background-clip: text; color: transparent; }

    form { display: flex; gap: 6px; margin-top: 10px; }
    #input { flex: 1; min-width: 0; padding: 10px 12px; font-size: 16px; border-radius: 14px; border: 3px solid var(--tinta); background: var(--creme); color: var(--tinta); font-family: inherit; font-weight: 700; }
    .btn { font-family: var(--texto); font-weight: 800; font-size: 16px; cursor: pointer; border: 3px solid var(--tinta); border-radius: 14px; padding: 0 14px; color: #fff; box-shadow: 0 4px 0 var(--tinta); }
    .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--tinta); }
    #foto-btn { background: var(--roxo); font-size: 20px; } #send { background: var(--verde); font-size: 20px; }
    #audio-btn { background: var(--sol); color: var(--tinta); font-size: 20px; white-space: nowrap; }
    #audio-btn.gravando { background: #ff3b3b; color: #fff; font-size: 15px; animation: gravando 1s ease-in-out infinite; }
    @keyframes gravando { 50% { box-shadow: 0 4px 0 var(--tinta), 0 0 0 6px rgba(255, 59, 59, 0.35); } }
    .audio { display: inline-flex; align-items: center; gap: 8px; margin-top: 4px; font-family: inherit; font-weight: 800; font-size: 15px; cursor: pointer;
      background: var(--creme); color: var(--tinta); border: 3px solid var(--tinta); border-radius: 999px; padding: 4px 14px 2px 8px; }
    .audio .onda { letter-spacing: 1px; opacity: 0.7; }
    .audio.tocando { background: var(--sol); }
    #perso-btn {
      position: fixed; top: 10px; right: 10px; z-index: 10; font-family: var(--texto); font-weight: 800; font-size: 15px; cursor: pointer;
      background: var(--agua); color: var(--tinta); border: 3px solid var(--tinta); border-radius: 12px; padding: 4px 12px; box-shadow: 0 4px 0 var(--tinta);
    }
    #perso-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--tinta); }
    #perso { position: fixed; inset: 0; z-index: 20; background: rgba(5, 4, 25, 0.75); display: none; align-items: center; justify-content: center; padding: 12px; }
    #perso.on { display: flex; }
    .caixa { width: min(560px, 100%); max-height: 100%; overflow-y: auto; background: var(--noite); border: 4px solid var(--tinta); border-radius: 22px; box-shadow: 0 0 0 3px var(--sol), 0 8px 0 var(--tinta); padding: 16px; }
    .caixa h2 { font-family: var(--display); font-weight: 400; text-align: center; font-size: 24px; color: var(--sol); }
    .previa { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 12px 0; font-weight: 800; font-size: 22px; background: #2e2366; border-radius: 16px; padding: 10px; }
    .previa .bola { width: 56px; height: 56px; font-size: 32px; }
    .caixa .sec { margin-top: 12px; }
    .fotos { display: flex; flex-wrap: wrap; gap: 6px; }
    .fotos button { width: 50px; height: 50px; border-radius: 50%; background: #2e2366; border: 3px solid #4a3a8a; font-size: 26px; cursor: pointer; display: grid; place-items: center; padding: 0; overflow: hidden; }
    .fotos button.on, .cores button.on { border-color: var(--sol); box-shadow: 0 0 0 3px var(--sol); }
    .fotos button svg { width: 100%; height: 100%; }
    #p-nome { width: 100%; padding: 10px 12px; font-size: 18px; border-radius: 14px; border: 3px solid var(--tinta); background: var(--creme); color: var(--tinta); font-family: inherit; font-weight: 800; }
    .aviso-adm { font-size: 13px; color: #b9f5d0; margin-top: 4px; }
    .cores { display: flex; flex-wrap: wrap; gap: 8px; }
    .cores button { font-family: inherit; font-weight: 800; font-size: 15px; padding: 6px 12px; border-radius: 12px; background: #2e2366; border: 3px solid #4a3a8a; cursor: pointer; }
    .cores button:disabled { opacity: 0.45; cursor: default; }
    .botoes { display: flex; gap: 10px; justify-content: center; margin-top: 16px; }
    .botoes .btn { padding: 8px 18px; }
    #p-salvar { background: var(--verde); } #p-fechar { background: var(--rosa); }
    #p-msg { text-align: center; min-height: 20px; margin-top: 8px; font-weight: 700; color: var(--sol); }
    .limpar { align-self: center; margin-bottom: 8px; background: none; border: 2px solid #e04848; color: #ff8a8a; border-radius: 10px; padding: 3px 12px; font-weight: 800; font-size: 13px; cursor: pointer; font-family: inherit; }
    .limpar.armado { background: #e04848; color: #fff; }
    #msg { min-height: 20px; font-size: 13px; color: #ff9a9a; margin-top: 4px; text-align: center; }

    /* Amigos do lado (só no App de Amigos): clica numa bolinha e abre a conversa com ela */
    .meio { flex: 1; min-height: 0; display: flex; gap: 8px; }
    .meio #list { flex: 1; min-width: 0; }
    #contatos { display: none; flex: none; width: 84px; overflow-y: auto; background: rgba(0, 0, 0, 0.25); border: 3px solid var(--tinta); border-radius: 18px; padding: 8px 4px; flex-direction: column; gap: 8px; align-items: stretch; }
    .com-contatos #contatos { display: flex; }
    .contato { background: none; border: 2px solid transparent; border-radius: 14px; color: var(--creme); font-family: inherit; font-weight: 800; font-size: 12px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 4px 2px; }
    .contato .bola { width: 46px; height: 46px; font-size: 24px; }
    .contato .nm { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .contato.on { border-color: var(--sol); background: rgba(255, 210, 63, 0.14); }
    @media (min-width: 640px) {
      .com-contatos .app { width: min(940px, 100%); }
      #contatos { width: 190px; }
      .contato { flex-direction: row; font-size: 15px; padding: 6px 8px; text-align: left; }
    }

    /* Fotos do chat */
    .foto { display: block; margin-top: 4px; max-width: min(260px, 100%); border-radius: 12px; border: 2px solid var(--tinta); background: #1b1550; cursor: zoom-in; object-fit: cover; }
    #ver-foto { position: fixed; inset: 0; z-index: 40; background: rgba(5, 4, 25, 0.92); display: none; align-items: center; justify-content: center; padding: 12px; cursor: zoom-out; }
    #ver-foto.on { display: flex; }
    #ver-foto img { max-width: 100%; max-height: 100%; border-radius: 12px; }

    /* Ligação */
    .acoes { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin: -4px 0 8px; }
    #ligar-btn { display: none; background: var(--verde); padding: 4px 16px 2px; font-size: 15px; }
    #avisos-btn { display: none; background: var(--sol); color: var(--tinta); padding: 4px 14px 2px; font-size: 15px; }
    #ligacao { position: fixed; inset: 0; z-index: 30; background: rgba(5, 4, 25, 0.88); display: none; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 20px; text-align: center; }
    #ligacao.on { display: flex; }
    #lig-icone { font-size: 74px; line-height: 1; }
    /* Chamada de vídeo: o rosto do amigo grande e o seu pequeno no canto */
    #video-btn { display: none; background: var(--roxo); padding: 4px 16px 2px; font-size: 15px; }
    #lig-videos { display: none; position: relative; width: min(94vw, 560px); height: min(58vh, 620px); background: #000; border: 4px solid var(--tinta); border-radius: 18px; overflow: hidden; }
    #ligacao.video #lig-videos { display: block; }
    #ligacao.video #lig-icone { display: none; }
    #lig-video-outro { width: 100%; height: 100%; object-fit: cover; }
    #lig-video-eu { position: absolute; right: 10px; bottom: 10px; width: 30%; max-width: 150px; aspect-ratio: 3 / 4; object-fit: cover; border: 3px solid #fff; border-radius: 12px; background: #222; transform: scaleX(-1); }
    #lig-camera { background: #4a3a8a; }
    #ligacao.tocando #lig-icone { animation: gif-treme 0.25s linear infinite; }
    #lig-nome { font-family: var(--display); font-size: clamp(22px, 6vw, 32px); color: var(--sol); }
    #lig-status { font-size: 18px; font-weight: 700; min-height: 24px; }
    #lig-botoes { display: flex; gap: 14px; margin-top: 8px; }
    #lig-botoes .btn { padding: 10px 20px 8px; font-size: 18px; }
    #lig-atender { background: var(--verde); } #lig-desligar { background: #e04848; } #lig-mudo { background: #4a3a8a; }

    #picker { display: none; max-height: 42vh; overflow-y: auto; margin-top: 8px; padding: 8px; background: rgba(0,0,0,0.3); border: 3px solid var(--tinta); border-radius: 16px; }
    #picker.on { display: block; }
    .sec { font-family: var(--display); font-size: 14px; color: var(--sol); margin: 6px 2px; }
    .grade { display: flex; flex-wrap: wrap; gap: 6px; }
    .grade button { background: #2e2366; border: 2px solid #4a3a8a; border-radius: 12px; width: 58px; height: 58px; cursor: pointer; display: grid; place-items: center; }
    .grade button:active { transform: scale(0.92); }
    .dica { font-size: 13px; opacity: 0.8; margin: 4px 2px; }
    .dica a { color: var(--sol); }

    /* GIFs: emojis grandes que se mexem (os mesmos do chat da Aventura) */
    .gif { display: inline-block; font-size: 32px; line-height: 1; }
    .txt .gif { font-size: 56px; margin: 4px 4px 0; }
    .gif-pula { animation: gif-pula 0.6s ease-in-out infinite alternate; }
    .gif-treme { animation: gif-treme 0.25s linear infinite; }
    .gif-gira { animation: gif-gira 1.2s linear infinite; }
    .gif-bate { animation: gif-bate 0.8s ease-in-out infinite; }
    .gif-balanca { animation: gif-balanca 0.9s ease-in-out infinite alternate; }
    .gif-pisca { animation: gif-pisca 0.5s steps(2) infinite; }
    .gif-arco { animation: gif-arco 1.5s linear infinite; }
    @keyframes gif-pula { from { transform: translateY(0); } to { transform: translateY(-10px); } }
    @keyframes gif-treme { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-3px) rotate(-5deg); } 75% { transform: translateX(3px) rotate(5deg); } }
    @keyframes gif-gira { to { transform: rotate(360deg); } }
    @keyframes gif-bate { 0%, 100% { transform: scale(1); } 30% { transform: scale(1.3); } 60% { transform: scale(0.95); } }
    @keyframes gif-balanca { from { transform: rotate(-15deg); } to { transform: rotate(15deg); } }
    @keyframes gif-pisca { 50% { opacity: 0.2; } }
    @keyframes gif-arco {
      0% { filter: hue-rotate(0deg) drop-shadow(0 0 4px #ff4a4a); } 33% { filter: hue-rotate(120deg) drop-shadow(0 0 4px #7ddf64); }
      66% { filter: hue-rotate(240deg) drop-shadow(0 0 4px #5ccfff); } 100% { filter: hue-rotate(360deg) drop-shadow(0 0 4px #ff4a4a); }
    }
    /* Emojis do Monta Emoji */
    .gif-emoji { width: 1.3em; height: 1.3em; vertical-align: middle; }
    .gif-emoji svg { width: 100%; height: 100%; display: block; animation: gif-emoji 1.2s ease-in-out infinite; }
    .txt .gif-emoji { font-size: 76px; }
    @keyframes gif-emoji { 0%, 100% { transform: translateY(0) rotate(0); } 25% { transform: translateY(-8%) rotate(-7deg); } 75% { transform: translateY(-4%) rotate(7deg); } }
    @media (prefers-reduced-motion: reduce) { .gif, .gif * , .gif-emoji svg { animation: none !important; } }
  </style>
</head>
<body>
  <a href="../index.html" id="back-link">← Menu</a>
  <button id="perso-btn" style="display:none">✏️ PERSONALIZAR</button>
  <div id="perso">
    <div class="caixa">
      <h2>✏️ PERSONALIZAR</h2>
      <div class="previa" id="p-previa"></div>
      <div class="sec">📸 FOTO</div>
      <div class="fotos" id="p-fotos"></div>
      <div class="sec">✍️ NOME</div>
      <input id="p-nome" maxlength="20" autocomplete="off">
      <div class="aviso-adm" id="p-aviso"></div>
      <div class="sec">🎨 COR DO NOME</div>
      <div class="cores" id="p-cores"></div>
      <div class="dica" id="p-dica"></div>
      <div class="botoes">
        <button class="btn" id="p-fechar">CANCELAR</button>
        <button class="btn" id="p-salvar">💾 SALVAR</button>
      </div>
      <div id="p-msg"></div>
    </div>
  </div>
  <div class="app">
    <h1>💬 CHAT DE <span>AMIGOS</span></h1>
    <div class="eu" id="eu"></div>
    <button class="limpar" id="limpar" style="display:none">🗑️ APAGAR CONVERSAS</button>
    <div class="acoes">
      <button type="button" class="btn" id="ligar-btn">📞 LIGAR</button>
      <button type="button" class="btn" id="video-btn">🎥 VÍDEO</button>
      <button type="button" class="btn" id="avisos-btn">🔔 AVISOS</button>
    </div>
    <div class="meio">
      <aside id="contatos"></aside>
      <ul id="list"></ul>
    </div>
    <form id="form" style="display:none">
      <button type="button" class="btn" id="audio-btn" title="Mandar áudio">🎤</button>
      <button type="button" class="btn" id="foto-btn" title="Mandar foto">📷</button>
      <input type="file" id="foto-arq" accept="image/*" hidden>
      <input id="input" maxlength="200" placeholder="Escreva aqui..." autocomplete="off">
      <button class="btn" id="send" title="Mandar">➤</button>
    </form>
    <div id="msg"></div>
  </div>
  <div id="ver-foto"><img alt="Foto"></div>
  <div id="ligacao">
    <div id="lig-icone">📞</div>
    <div id="lig-videos">
      <video id="lig-video-outro" autoplay playsinline></video>
      <video id="lig-video-eu" autoplay playsinline muted></video>
    </div>
    <div id="lig-nome"></div>
    <div id="lig-status"></div>
    <div id="lig-botoes">
      <button type="button" class="btn" id="lig-atender">✅ ATENDER</button>
      <button type="button" class="btn" id="lig-mudo">🔇 MUDO</button>
      <button type="button" class="btn" id="lig-camera">📷 CÂMERA</button>
      <button type="button" class="btn" id="lig-desligar">❌ DESLIGAR</button>
    </div>
  </div>
  <audio id="lig-som" autoplay playsinline></audio>

  <script src="../monta-emoji/emoji.js?v=1"></script>
  <script>
  (() => {
    const $ = id => document.getElementById(id);
    const el = (tag, text, cls) => { const e = document.createElement(tag); if (text != null) e.textContent = text; if (cls) e.className = cls; return e; };
    const PERFIL = new URLSearchParams(location.search).get('perfil');
    const SALA = new URLSearchParams(location.search).get('sala') === 'amigos' ? 'amigos' : undefined;   // sala do App de Amigos
    let com = (SALA && new URLSearchParams(location.search).get('com')) || null, contatos = [];   // conversa aberta: null = Todos, ou o número de um amigo
    if (SALA) $('back-link').href = 'https://app-de-amigos.vercel.app/';   // voltar leva pro App de Amigos
    const KEY = 'aventuraConta' + (PERFIL ? ':' + PERFIL : '');   // a mesma conta da Aventura Elemental
    const conta = () => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } };
    const eu = () => conta().user;

    // GIFs antigos do chat da Aventura (só pra mostrar mensagens de antes): [id, emoji, jeito de mexer, preço, moeda, arco-íris]
    const GIFS = [
      ['rindo', '😂', 'pula'], ['fogo', '🔥', 'treme'], ['festa', '🎉', 'gira'], ['joinha', '👍', 'bate'],
      ['oculos', '😎', 'balanca'], ['caveira', '💀', 'treme'], ['coracao', '❤️', 'bate'], ['trofeu', '🏆', 'pula'],
      ['raio', '⚡', 'pisca'], ['chorando', '😭', 'treme'], ['susto', '😱', 'bate'], ['danca', '🕺', 'balanca'],
      ['dragao', '🐉', 'balanca', 60], ['foguete', '🚀', 'pula', 60], ['alien', '👽', 'treme', 60],
      ['robo', '🤖', 'balanca', 60], ['unicornio', '🦄', 'pula', 100], ['coroa', '👑', 'bate', 100],
      ['diamante', '💎', 'gira', 100], ['ninja', '🥷', 'treme', 100],
      ['rindoarco', '😂', 'pula', 30, 1, true], ['fogoarco', '🔥', 'treme', 30, 1, true],
      ['coracaoarco', '❤️', 'bate', 30, 1, true], ['joinhaarco', '👍', 'bate', 30, 1, true],
      ['estrelaarco', '⭐', 'gira', 40, 1, true], ['oculosarco', '😎', 'balanca', 40, 1, true],
      ['arcoiris', '🌈', 'pula', 40, 1, true], ['dragaoarco', '🐉', 'balanca', 60, 1, true],
      ['coroaarco', '👑', 'bate', 60, 1, true],
    ];
    function gifEl(id) {
      const g = GIFS.find(x => x[0] === id);
      if (!g) return el('span', '');
      const inner = el('span', g[1], 'gif gif-' + g[2]);
      if (!g[5]) return inner;
      const wrap = el('span', null, 'gif gif-arco');
      wrap.appendChild(inner);
      return wrap;
    }
    function emojiEl(e) {
      const sp = el('span', null, 'gif gif-emoji');
      if (window.MontaEmoji) sp.innerHTML = MontaEmoji.desenha(MontaEmoji.limpa(e));
      else sp.textContent = '😀';
      return sp;
    }
    const CORES = { branco: '#ffffff', verde: '#5df07a', azul: '#5ccfff', vermelho: '#ff5a5a', laranja: '#ff9a2e', roxo: '#b06cff', rosa: '#ff6ad5', dourado: '#ffd23a' };
    function nomeEl(nome, cor) {
      const s = el('span', nome);
      if (cor === 'arcoiris') s.className = 'arco'; else s.style.color = CORES[cor] || '#fff';
      return s;
    }

    // Foto do chat: um emoji, um emoji montado, ou a primeira letra do nome
    function fotoEl(f, nome, cor) {
      const b = el('span', null, 'bola');
      if (f && f.e) b.textContent = f.e;
      else if (f && f.m && window.MontaEmoji) b.innerHTML = MontaEmoji.desenha(MontaEmoji.limpa(f.m));
      else { b.textContent = (nome || '?').slice(0, 1).toUpperCase(); b.style.background = CORES[cor] || '#ffd23f'; }
      return b;
    }

    async function api(body) {
      const r = await fetch('/api/conta/', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ ...body, sala: SALA, com: com || undefined }) });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(d.error || 'Não deu agora.');
      return d;
    }

    // ── Mensagens ──
    let msgs = [], ultimo = 0, membro = null, ocupado = false;
    function info(t) { const l = $('list'); l.innerHTML = ''; l.appendChild(el('li', t, 'info')); }
    function render() {
      const u = eu();
      document.body.classList.toggle('com-contatos', !!(SALA && u && membro));
      $('form').style.display = u && membro ? '' : 'none';
      if (!u) {
        $('eu').textContent = '';
        const l = $('list'); l.innerHTML = '';
        const li = el('li', null, 'info');
        li.innerHTML = 'Pra usar o chat, entre com seu e-mail na <a href="../aventura-elemental/' + (PERFIL ? '?perfil=' + encodeURIComponent(PERFIL) : '') + '" style="color:#ffd23f">Aventura Elemental</a> (botão USUÁRIO).';
        l.appendChild(li);
        return;

      $('eu').textContent = 'Você é ';
      $('eu').appendChild(nomeEl(meuNomeChat || u.nome, conta().nameColor));
      if (membro === null) return info('Carregando...');
      if (!membro) return info('🔒 O chat é só pra convidados. Peça pro ADM te convidar!');
      const l = $('list');
      const noFim = l.scrollHeight - l.scrollTop - l.clientHeight < 60;
      l.innerHTML = '';
      const amigo = contatos.find(c => c.id === com);
      if (!msgs.length) l.appendChild(el('li', amigo ? '🔒 Conversa só entre você e ' + amigo.nome + '. Diga oi! 👋' : 'Ninguém falou nada ainda. Diga oi! 👋', 'info'));
      for (const m of msgs) {
        const li = el('li', null, m.nome === u.nome || m.nome === meuNomeChat ? 'mine' : '');
        const who = el('div', null, 'who');
        const bola = fotoEl(m.fotoChat, m.nome, m.cor);
        const d = new Date(m.t);
        who.append(bola, nomeEl(m.nome, m.cor), el('span', String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'), 'hora'));
        const txt = el('div', m.texto || null, 'txt');
        if (m.gif) txt.appendChild(gifEl(m.gif));
        if (m.emoji) txt.appendChild(emojiEl(m.emoji));
        if (m.audio) txt.appendChild(audioEl(m.audio));
        if (m.imagem) txt.appendChild(fotoMsgEl(m.imagem));
        li.append(who, txt);
        l.appendChild(li);
      }
      if (noFim || ocupado) l.scrollTop = l.scrollHeight;
      botaoLimpar();
      telaLigacao();
      botaoAvisos();
    }
    function junta(d) {
      membro = !!(d && d.membro);
      if (d) recados(d);
      if (d && d.limpo) msgs = msgs.filter(m => m.id > d.limpo);   // o ADM apagou as conversas
      for (const m of (d && d.msgs) || []) if (m.id > ultimo) { msgs.push(m); ultimo = m.id; }
      msgs = msgs.slice(-100);
    }
    async function ler() {
      const u = eu();
      if (!u) return render();
      const aberta = com;
      let d;
      try { d = await api({ action: 'chatLer', email: u.email, desde: ultimo, cliente: CLIENTE, sinalDesde }); } catch (e) { return; }
      if (aberta !== com) return recados(d);
      junta(d);
      render();
    }
    async function mandar(texto, gif, emoji, audio, foto) {
      const u = eu();
      if (!u || ocupado) return;
      ocupado = true;
      $('msg').textContent = '';
      try {
        if (audio) $('msg').textContent = '📤 Mandando áudio...';
        if (foto) $('msg').textContent = '📤 Mandando foto...';
        const aberta = com;
        const d = await api({ action: 'chatEnviar', email: u.email, texto, gif, emoji, audio, foto, desde: ultimo, cliente: CLIENTE, sinalDesde });
        if (aberta === com) junta(d); else recados(d);
        $('msg').textContent = '';
        if (!audio && !foto) $('input').value = '';
        render();
      } catch (e) { $('msg').textContent = e.message; }
      ocupado = false;
    }
    $('form').addEventListener('submit', e => { e.preventDefault(); const t = $('input').value.trim(); if (t) mandar(t, null, null); });

    // ── Foto: escolhe uma foto do aparelho, ela fica menor (pra ir rápido) e vai pro chat ──
    $('foto-btn').onclick = () => $('foto-arq').click();
    $('foto-arq').onchange = async () => {
      const arq = $('foto-arq').files[0];
      $('foto-arq').value = '';
      if (!arq) return;
      try {
        const img = await new Promise((ok, erro) => { const i = new Image(); i.onload = () => ok(i); i.onerror = erro; i.src = URL.createObjectURL(arq); });
        let foto = null;
        for (const [lado, q] of [[1280, 0.75], [960, 0.65], [720, 0.55]]) {
          const k = Math.min(1, lado / Math.max(img.naturalWidth, img.naturalHeight));
          const c = document.createElement('canvas');
          c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
          c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
          const dados = c.toDataURL('image/jpeg', q).split(',')[1] || '';
          foto = { dados, w: c.width, h: c.height };
          if (dados.length <= 600000) break;
        }
        URL.revokeObjectURL(img.src);
        mandar('', null, null, null, foto);
      } catch (e) { $('msg').textContent = 'Não deu pra abrir essa foto.'; }
    };
    // Mostrar uma foto que chegou (guarda a imagem pra não buscar de novo a cada olhada)
    const fotos = {};
    function fotoMsgEl(f) {
      if (fotos[f.id]) return fotos[f.id];
      const img = el('img', null, 'foto');
      img.alt = 'Foto';
      img.style.aspectRatio = f.w + ' / ' + f.h;
      img.style.width = Math.min(260, f.w) + 'px';
      img.onclick = () => { if (img.src) { $('ver-foto').querySelector('img').src = img.src; $('ver-foto').classList.add('on'); } };
      fotos[f.id] = img;
      api({ action: 'chatFoto', email: eu().email, id: f.id })
        .then(d => { img.src = 'data:' + d.tipo + ';base64,' + d.dados; })
        .catch(() => { img.replaceWith(el('span', '🖼️ Essa foto já sumiu.')); delete fotos[f.id]; });
      return img;
    }
    $('ver-foto').onclick = () => $('ver-foto').classList.remove('on');

    // ── Áudio: toca no 🎤 pra gravar, toca de novo pra mandar (até 20 segundos) ──
    let grava = null;
    const tipoAudio = () => ['audio/webm;codecs=opus', 'audio/mp4', 'audio/webm', 'audio/ogg'].find(t => window.MediaRecorder && MediaRecorder.isTypeSupported(t)) || '';
    async function comecaGravar() {
      if (!navigator.mediaDevices || !window.MediaRecorder) { $('msg').textContent = 'Esse aparelho não grava áudio.'; return; }
      let stream;
      try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
      catch (e) { $('msg').textContent = '🎤 Precisa deixar o site usar o microfone.'; return; }
      const tipo = tipoAudio();
      const rec = new MediaRecorder(stream, tipo ? { mimeType: tipo, audioBitsPerSecond: 32000 } : { audioBitsPerSecond: 32000 });
      const partes = [];
      grava = { rec, stream, inicio: Date.now(), cancela: false };
      rec.ondataavailable = e => { if (e.data && e.data.size) partes.push(e.data); };
      rec.onstop = async () => {
        stream.getTracks().forEach(t => t.stop());
        const g = grava; grava = null; botaoAudio();
        if (g.cancela) return;
        const dur = (Date.now() - g.inicio) / 1000;
        if (dur < 0.7) { $('msg').textContent = 'Muito curtinho! Toque no 🎤, fale e toque de novo.'; return; }
        const blob = new Blob(partes, { type: rec.mimeType || tipo || 'audio/webm' });
        const dados = await new Promise(ok => { const fr = new FileReader(); fr.onload = () => ok(String(fr.result).split(',')[1] || ''); fr.readAsDataURL(blob); });
        mandar('', null, null, { dados, tipo: (rec.mimeType || tipo || 'audio/webm').split(';')[0], dur });
      };
      rec.start();
      botaoAudio();
      grava.timer = setInterval(() => {
        if (!grava) return;
        const t = (Date.now() - grava.inicio) / 1000;
        if (t >= 20) grava.rec.stop(); else botaoAudio();
      }, 250);
    }
    function botaoAudio() {
      const b = $('audio-btn');
      if (grava) {
        const t = Math.floor((Date.now() - grava.inicio) / 1000);
        b.classList.add('gravando'); b.textContent = '⏹ 0:' + String(t).padStart(2, '0');
      } else { b.classList.remove('gravando'); b.textContent = '🎤'; }
    }
    $('audio-btn').onclick = () => {
      if (grava) { clearInterval(grava.timer); grava.rec.stop(); }
      else comecaGravar();
    };
    // Tocar um áudio que chegou
    const audios = {};
    let tocandoAgora = null;
    function audioEl(a) {
      const b = el('button', null, 'audio');
      b.type = 'button';
      const seg = Math.round(a.dur || 1);
      b.append(el('span', '▶️'), el('span', '▮▯▮▮▯▮▯▮▮', 'onda'), el('span', '0:' + String(seg).padStart(2, '0')));
      b.onclick = async () => {
        if (tocandoAgora) { tocandoAgora.pause(); tocandoAgora.botao.classList.remove('tocando'); tocandoAgora.botao.firstChild.textContent = '▶️'; if (tocandoAgora.botao === b) { tocandoAgora = null; return; } }
        try {
          if (!audios[a.id]) { const d = await api({ action: 'chatAudio', email: eu().email, id: a.id }); audios[a.id] = 'data:' + d.tipo + ';base64,' + d.dados; }
          const som = new Audio(audios[a.id]);
          som.botao = b; tocandoAgora = som;
          b.classList.add('tocando'); b.firstChild.textContent = '🔊';
          som.onended = () => { b.classList.remove('tocando'); b.firstChild.textContent = '▶️'; if (tocandoAgora === som) tocandoAgora = null; };
          await som.play();
        } catch (e) { b.classList.remove('tocando'); b.firstChild.textContent = '▶️'; $('msg').textContent = e.message || 'Não deu pra tocar esse áudio.'; }
      };
      return b;
    }

    // ── PERSONALIZAR: foto, nome e cor do nome ──
    const FOTOS = ['😀', '😎', '🤩', '😜', '🥳', '😇', '🤠', '👻', '🤖', '👽', '😈', '🤡', '🐶', '🐱', '🦊', '🐼', '🐸', '🦁', '🐯', '🐵',
      '🦄', '🐲', '🦖', '🐙', '🦈', '⚽', '🏆', '🎮', '🚀', '⭐', '🔥', '💎', '👑', '🌈', '⚡', '🍕', '🍩', '🎃', '❄️', '💀'];
    const NOMES_COR = { branco: 'Branco', verde: 'Verde', azul: 'Azul', vermelho: 'Vermelho', laranja: 'Laranja', roxo: 'Roxo', rosa: 'Rosa', dourado: 'Dourado', arcoiris: 'Arco-íris' };
    let minhaFoto = null, meuNomeChat = null, nomeConta = null, pFoto = null, pCor = 'branco';
    const minhasCores = () => adm ? Object.keys(NOMES_COR) : ['branco', ...(conta().colors || [])];
    function previa() {
      const p = $('p-previa');
      p.innerHTML = '';
      const n = $('p-nome').value.trim() || eu().nome;
      p.append(fotoEl(pFoto, n, pCor), nomeEl(n, pCor));
    }
    function abrirPerso() {
      const u = eu();
      pFoto = minhaFoto; pCor = conta().nameColor || 'branco';
      $('p-nome').value = meuNomeChat || u.nome;
      $('p-msg').textContent = '';
      $('p-aviso').textContent = 'Esse nome aparece só no chat. Na Aventura você continua ' + (nomeConta || u.nome) + (adm ? ' e continua ADM 👑' : '') + '.';
      const fotos = $('p-fotos');
      fotos.innerHTML = '';
      const botaoFoto = (f, conteudo) => {
        const b = el('button'); b.type = 'button';
        if (typeof conteudo === 'string') b.textContent = conteudo; else b.appendChild(conteudo);
        if (JSON.stringify(f) === JSON.stringify(pFoto)) b.classList.add('on');
        b.onclick = () => { pFoto = f; fotos.querySelectorAll('button').forEach(x => x.classList.remove('on')); b.classList.add('on'); previa(); };
        fotos.appendChild(b);
      };
      botaoFoto(null, 'Aa');
      for (const e of FOTOS) botaoFoto({ e }, e);
      // Os emojis que você montou também viram foto
      api({ action: 'figurinhas', email: u.email }).then(d => {
        for (const m of (d.figurinhas || []).slice(0, 20)) {
          const sp = el('span'); sp.innerHTML = MontaEmoji.desenha(MontaEmoji.limpa(m));
          botaoFoto({ m: MontaEmoji.limpa(m) }, sp.firstChild);
        }
      }).catch(() => {});
      const cores = $('p-cores');
      cores.innerHTML = '';
      const tenho = minhasCores();
      for (const id of Object.keys(NOMES_COR)) {
        const b = el('button'); b.type = 'button';
        const t = nomeEl(NOMES_COR[id], id);
        b.appendChild(t);
        if (!tenho.includes(id)) { b.disabled = true; b.appendChild(document.createTextNode(' 🔒')); }
        if (id === pCor) b.classList.add('on');
        b.onclick = () => { pCor = id; cores.querySelectorAll('button').forEach(x => x.classList.remove('on')); b.classList.add('on'); previa(); };
        cores.appendChild(b);
      }
      $('p-dica').textContent = tenho.length < Object.keys(NOMES_COR).length ? '🔒 As outras cores você compra na loja da Aventura Elemental.' : '';
      previa();
      $('perso').classList.add('on');
    }
    $('p-nome').addEventListener('input', previa);
    $('perso-btn').onclick = abrirPerso;
    $('p-fechar').onclick = () => $('perso').classList.remove('on');
    $('perso').addEventListener('click', e => { if (e.target.id === 'perso') $('perso').classList.remove('on'); });
    $('p-salvar').onclick = async () => {
      const u = eu(), c = conta();
      const nome = $('p-nome').value.trim().slice(0, 20);
      if (!nome) { $('p-msg').textContent = 'Escreva um nome!'; return; }
      $('p-salvar').disabled = true;
      $('p-msg').textContent = 'Salvando...';
      try {
        // Cor: a mesma do usuário da Aventura (o nome, a foto e a moldura de lá continuam iguais)
        // (usa o nome da conta que está no servidor, pra nunca trocar o nome da conta sem querer)
        if (pCor !== (c.nameColor || 'branco')) await api({ email: u.email, nome: nomeConta || u.nome, cor: pCor, foto: c.avatar || 'skin:gotinha', moldura: c.frame || 'nenhuma' });
        // Foto e nome: só do chat
        const d = await api({ action: 'fotoChat', email: u.email, fotoChat: pFoto, nomeChat: nome });
        minhaFoto = d.fotoChat; meuNomeChat = d.nomeChat;
        const novo = conta();
        novo.nameColor = pCor;
        try { localStorage.setItem(KEY, JSON.stringify(novo)); } catch (e) { /* ok */ }
        $('p-msg').textContent = '✅ Pronto! As próximas mensagens vão com o seu visual novo.';
        render();
        setTimeout(() => $('perso').classList.remove('on'), 1200);
      } catch (e) { $('p-msg').textContent = e.message; }
      $('p-salvar').disabled = false;
    };

    // ADM: só ele vê o botão de apagar todas as conversas (toca duas vezes)
    let adm = false;
    function botaoLimpar() { $('limpar').style.display = adm && membro && msgs.length && !com ? '' : 'none'; }
    if (eu()) {
      $('perso-btn').style.display = '';
      api({ action: 'online', email: eu().email }).then(d => { adm = !!d.adm; botaoLimpar(); }).catch(() => {});
      // A foto do chat que eu já escolhi
      api({ action: 'fotoChat', email: eu().email, ler: true }).then(d => { minhaFoto = d.fotoChat || null; meuNomeChat = d.nomeChat || null; nomeConta = d.nome || null; render(); }).catch(() => {});
    }
    $('limpar').onclick = async () => {
      const b = $('limpar');
      if (!b.classList.contains('armado')) {
        b.classList.add('armado'); b.textContent = '🗑️ APAGAR TUDO? Toque de novo';
        setTimeout(() => { b.classList.remove('armado'); b.textContent = '🗑️ APAGAR CONVERSAS'; }, 4000);
        return;
      }
      b.disabled = true;
      try { await api({ action: 'admin-limpar-chat', email: eu().email }); msgs = []; render(); }
      catch (e) { $('msg').textContent = 'Não deu pra apagar agora.'; }
      b.disabled = false; b.classList.remove('armado'); b.textContent = '🗑️ APAGAR CONVERSAS';
    };

    // ── 🔔 Avisos: notificação no celular quando chega mensagem ──
    const temAvisos = 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
    const ehIphone = /iPhone|iPad|iPod/.test(navigator.userAgent);
    let avisosLigados = false;
    // o 🔔 aparece sempre que os avisos ainda não estão ligados neste celular
    function botaoAvisos() { $('avisos-btn').style.display = eu() && membro && !avisosLigados && (temAvisos || ehIphone) ? 'inline-block' : 'none'; }
    const chaveBytes = k => { const b = atob(k.replace(/-/g, '+').replace(/_/g, '/') + '='.repeat((4 - k.length % 4) % 4)); return Uint8Array.from(b, c => c.charCodeAt(0)); };
    async function inscrever(pedir) {
      // pergunta na hora do toque (se esperar antes, o iPhone ignora a pergunta)
      const pergunta = pedir && Notification.permission === 'default' ? Notification.requestPermission() : null;
      const reg = await navigator.serviceWorker.register('/sw.js');
      if (pergunta && (await pergunta) !== 'granted') throw new Error('🔕 Os avisos ficaram desligados. Toque no 🔔 AVISOS pra tentar de novo.');
      if (pedir && Notification.permission === 'denied') throw new Error('🔕 Os avisos estão bloqueados. Libere nas configurações do celular: Notificações → permitir pra este site.');
      await navigator.serviceWorker.ready;
      if (Notification.permission !== 'granted') return false;
      let sub = await reg.pushManager.getSubscription();
      if (!sub) {
        const { chave } = await (await fetch('/api/push/?chave=1')).json();
        sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: chaveBytes(chave) });
      }
      await api({ action: 'chatAvisos', email: eu().email, sub: sub.toJSON() });
      return true;
    }
    $('avisos-btn').onclick = async () => {
      if (!temAvisos) {
        $('msg').textContent = ehIphone ? '📱 No iPhone: toque em Compartilhar → "Adicionar à Tela de Início", abra o chat por lá e toque no 🔔 de novo.' : 'Esse navegador não mostra avisos.';
        return;
      }
      try {
        avisosLigados = await inscrever(true);
        botaoAvisos();
        if (avisosLigados) {
          $('msg').textContent = '🔔 Avisos ligados! Quando chegar mensagem, o celular avisa.';
          // um aviso de teste, pra ver que funciona
          const reg = await navigator.serviceWorker.ready;
          reg.showNotification('🔔 Avisos ligados!', { body: 'Quando seu amigo mandar mensagem, aparece assim.', icon: '/icon-192.png' }).catch(() => {});
        }
      } catch (e) { $('msg').textContent = e.message || 'Não deu pra ligar os avisos.'; }
    };
    // Automático: quem já deixou, renova sem perguntar; quem ainda não, o celular pergunta no primeiro toque na tela
    if (temAvisos && eu() && Notification.permission === 'granted') inscrever(false).then(ok => { avisosLigados = ok; botaoAvisos(); }).catch(() => {});
    if (temAvisos && eu() && Notification.permission === 'default') {
      const primeiroToque = () => {
        if (!membro) return;   // só quem está no chat
        document.removeEventListener('pointerup', primeiroToque, true);
        inscrever(true).then(ok => { avisosLigados = ok; botaoAvisos(); if (ok) $('msg').textContent = '🔔 Pronto! Quando chegar mensagem, o celular avisa.'; }).catch(() => {});
      };
      document.addEventListener('pointerup', primeiroToque, true);
    }

    // ── Amigos do lado: Todos + uma bolinha pra cada amigo ──
    function desenhaContatos() {
      const a = $('contatos');
      a.innerHTML = '';
      const todos = el('button', null, 'contato' + (com ? '' : ' on'));
      todos.type = 'button';
      const bt = el('span', '👥', 'bola'); bt.style.background = '#b06cff';
      todos.append(bt, el('span', 'Todos', 'nm'));
      todos.onclick = () => abre(null);
      a.appendChild(todos);
      for (const c of contatos) {
        const b = el('button', null, 'contato' + (com === c.id ? ' on' : ''));
        b.type = 'button';
        b.append(fotoEl(c.fotoChat, c.nome, c.cor), el('span', c.nome, 'nm'));
        b.onclick = () => abre(c.id);
        a.appendChild(b);
      }
    }
    function abre(id) {
      if (com === id) return;
      com = id; msgs = []; ultimo = 0;
      $('msg').textContent = '';
      desenhaContatos(); render(); ler();
    }
    async function carregaContatos() {
      if (!SALA || !eu()) return;
      try { const d = await api({ action: 'chatContatos', email: eu().email }); contatos = d.contatos || []; } catch (e) { return; }
      if (com && !contatos.some(c => c.id === com)) { com = null; msgs = []; ultimo = 0; ler(); }
      desenhaContatos(); render();
    }
    carregaContatos();
    setInterval(() => { if (!document.hidden) carregaContatos(); }, 30000);

    // ── Ligação de voz (de aparelho pra aparelho; o site só leva os recados) ──
    // Quem liga toca em todo mundo da sala; o primeiro que atender conversa com ele
    const CLIENTE = Math.random().toString(36).slice(2, 12);   // este aparelho
    let sinalDesde = 0;
    let lig = null;   // { estado: 'chamando'|'tocando'|'conectando'|'falando', outro, nome, pc, stream, inicio, timer }
    const ICE = { iceServers: [{ urls: ['stun:stun.l.google.com:19302', 'stun:stun1.l.google.com:19302'] }] };
    const sinal = (tipo, para, dados, paraAmigo) => api({ action: 'chatSinal', email: eu().email, cliente: CLIENTE, tipo, para: para || null, dados: dados || null, paraAmigo: paraAmigo || null });

    // Toque do telefone (bip-bip feito no próprio aparelho)
    let toque = null;
    function tocar(liga) {
      clearInterval(toque); toque = null;
      if (!liga) return;
      const bip = () => {
        try {
          const ac = tocar.ac || (tocar.ac = new (window.AudioContext || window.webkitAudioContext)());
          [0, 0.35].forEach(t => {
            const o = ac.createOscillator(), g = ac.createGain();
            o.frequency.value = lig && lig.estado === 'chamando' ? 440 : 880;
            g.gain.setValueAtTime(0.12, ac.currentTime + t); g.gain.setValueAtTime(0, ac.currentTime + t + 0.25);
            o.connect(g); g.connect(ac.destination); o.start(ac.currentTime + t); o.stop(ac.currentTime + t + 0.26);
          });
          if (lig && lig.estado === 'tocando' && navigator.vibrate) navigator.vibrate([300, 200, 300]);
        } catch (e) { /* sem som, tudo bem */ }
      };
      bip(); toque = setInterval(bip, 2000);
    }

    function telaLigacao() {
      const t = $('ligacao');
      $('ligar-btn').style.display = eu() && membro ? 'block' : 'none';
      const amigo = contatos.find(c => c.id === com);
      $('ligar-btn').textContent = amigo ? '📞 LIGAR PRA ' + amigo.nome.toUpperCase() : SALA ? '📞 LIGAR PRA TODOS' : '📞 LIGAR';
      $('video-btn').style.display = eu() && membro ? 'block' : 'none';
      if (!lig) { t.classList.remove('on', 'tocando', 'video'); return; }
      t.classList.add('on');
      t.classList.toggle('video', !!lig.video && lig.estado !== 'tocando');
      t.classList.toggle('tocando', lig.estado === 'tocando');
      $('lig-nome').textContent = lig.nome || 'Chat de Amigos';
      const seg = lig.inicio ? Math.floor((Date.now() - lig.inicio) / 1000) : 0;
      $('lig-status').textContent = { chamando: 'Chamando... 📳', tocando: lig.video ? 'quer fazer chamada de vídeo! 🎥' : 'está te ligando!', conectando: 'Conectando...',
        falando: '🔊 ' + Math.floor(seg / 60) + ':' + String(seg % 60).padStart(2, '0') }[lig.estado] || '';
      $('lig-atender').style.display = lig.estado === 'tocando' ? '' : 'none';
      $('lig-mudo').style.display = lig.estado === 'falando' ? '' : 'none';
      $('lig-camera').style.display = lig.video && lig.estado === 'falando' ? '' : 'none';
      $('lig-desligar').textContent = lig.estado === 'tocando' ? '❌ RECUSAR' : '❌ DESLIGAR';
    }

    async function microfone(video) {
      if (!navigator.mediaDevices || !window.RTCPeerConnection) throw new Error('Esse aparelho não faz ligação.');
      try { return await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true },
        video: video ? { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } } : false }); }
      catch (e) { throw new Error(video ? '🎥 Precisa deixar o site usar a câmera e o microfone.' : '🎤 Precisa deixar o site usar o microfone.'); }
    }
    // Cria a conexão e espera juntar os caminhos (assim manda tudo num recado só)
    function novaConexao() {
      const pc = new RTCPeerConnection(ICE);
      lig.stream.getTracks().forEach(t => pc.addTrack(t, lig.stream));
      pc.ontrack = e => { const a = lig && lig.video ? $('lig-video-outro') : $('lig-som'); if (a.srcObject !== e.streams[0]) { a.srcObject = e.streams[0]; a.play().catch(() => {}); } };
      pc.onconnectionstatechange = () => {
        if (!lig || lig.pc !== pc) return;
        if (pc.connectionState === 'connected' && lig.estado !== 'falando') { lig.estado = 'falando'; lig.inicio = Date.now(); tocar(false); telaLigacao(); }
        if (pc.connectionState === 'failed') fimLigacao('Não deu pra conectar. 😕', true);
      };
      return pc;
    }
    const juntaCaminhos = pc => new Promise(ok => {
      if (pc.iceGatheringState === 'complete') return ok();
      const fim = () => { if (pc.iceGatheringState === 'complete') ok(); };
      pc.addEventListener('icegatheringstatechange', fim);
      setTimeout(ok, 3000);
    });

    function fimLigacao(aviso, avisar) {
      if (!lig) return;
      if (avisar && lig.outro) sinal('desliga', lig.outro).catch(() => {});
      else if (avisar && lig.estado === 'chamando') sinal('desliga', null, null, lig.paraAmigo).catch(() => {});
      if (lig.pc) lig.pc.close();
      if (lig.stream) lig.stream.getTracks().forEach(t => t.stop());
      clearInterval(lig.timer); clearTimeout(lig.desiste);
      $('lig-som').srcObject = null; $('lig-video-outro').srcObject = null; $('lig-video-eu').srcObject = null;
      $('lig-camera').textContent = '📷 CÂMERA';
      $('lig-mudo').textContent = '🔇 MUDO';
      tocar(false);
      lig = null;
      telaLigacao();
      if (aviso) $('msg').textContent = aviso;
      rapido(false);
    }

    async function ligar(video) {
      if (lig) return;
      $('msg').textContent = '';
      let stream;
      try { stream = await microfone(video); } catch (e) { $('msg').textContent = e.message; return; }
      const amigo = contatos.find(c => c.id === com);
      lig = { estado: 'chamando', nome: amigo ? amigo.nome : SALA ? 'Todos do App de Amigos' : 'Chat de Amigos', stream, paraAmigo: amigo ? amigo.id : null, video };
      if (video) $('lig-video-eu').srcObject = stream;
      lig.timer = setInterval(telaLigacao, 1000);
      lig.desiste = setTimeout(() => { if (lig && lig.estado === 'chamando') fimLigacao('Ninguém atendeu. 📵', true); }, 45000);
      telaLigacao(); tocar(true); rapido(true);
      try { await sinal('liga', null, video ? 'video' : null, lig.paraAmigo); } catch (e) { fimLigacao(e.message); }
    }
    $('ligar-btn').onclick = () => ligar(false);
    $('video-btn').onclick = () => ligar(true);
    $('lig-camera').onclick = () => {
      const t = lig && lig.stream && lig.stream.getVideoTracks()[0];
      if (!t) return;
      t.enabled = !t.enabled;
      $('lig-camera').textContent = t.enabled ? '📷 CÂMERA' : '🚫 SEM CÂMERA';
    };
    $('lig-atender').onclick = async () => {
      if (!lig || lig.estado !== 'tocando') return;
      tocar(false);
      try { lig.stream = await microfone(lig.video); } catch (e) { const outro = lig.outro; fimLigacao(e.message); sinal('recusa', outro).catch(() => {}); return; }
      if (lig.video) $('lig-video-eu').srcObject = lig.stream;
      lig.estado = 'conectando'; telaLigacao(); rapido(true);
      sinal('aceita', lig.outro).catch(() => fimLigacao('Não deu pra atender.'));
    };
    $('lig-desligar').onclick = () => {
      if (lig && lig.estado === 'tocando') { sinal('recusa', lig.outro).catch(() => {}); fimLigacao(); }
      else fimLigacao('Ligação encerrada.', true);
    };
    $('lig-mudo').onclick = () => {
      if (!lig || !lig.stream) return;
      const t = lig.stream.getAudioTracks()[0];
      t.enabled = !t.enabled;
      $('lig-mudo').textContent = t.enabled ? '🔇 MUDO' : '🎤 FALAR';
    };

    // Os recados que chegaram dos outros aparelhos
    async function recados(d) {
      if (!sinalDesde) { sinalDesde = d.sinalUltimo || 0; if (!sinalDesde) sinalDesde = -1; return; }
      for (const r of d.sinais || []) {
        if (r.n <= sinalDesde) continue;
        sinalDesde = Math.max(sinalDesde, r.n);
        if (Date.now() - r.t > 60000) continue;   // recado velho
        if (r.tipo === 'liga') {
          if (lig) { if (!r.para) sinal('ocupado', r.de).catch(() => {}); continue; }
          lig = { estado: 'tocando', outro: r.de, nome: r.nome, video: r.dados === 'video' };
          lig.timer = setInterval(telaLigacao, 1000);
          lig.desiste = setTimeout(() => { if (lig && lig.estado === 'tocando') fimLigacao('Você perdeu uma ligação de ' + r.nome + '. 📵'); }, 45000);
          telaLigacao(); tocar(true); rapido(true);
        } else if (!lig) {
          continue;
        } else if (r.tipo === 'aceita' && lig.estado === 'chamando') {
          // O primeiro que atendeu fala comigo; os outros param de tocar
          lig.outro = r.de; lig.nome = r.nome; lig.estado = 'conectando';
          clearTimeout(lig.desiste); tocar(false); telaLigacao();
          sinal('atendida', null).catch(() => {});
          try {
            const pc = lig.pc = novaConexao();
            await pc.setLocalDescription(await pc.createOffer());
            await juntaCaminhos(pc);
            if (lig && lig.pc === pc) await sinal('oferta', r.de, JSON.stringify(pc.localDescription));
          } catch (e) { fimLigacao('Não deu pra conectar. 😕', true); }
          lig && (lig.desiste = setTimeout(() => { if (lig && lig.estado === 'conectando') fimLigacao('Não deu pra conectar. 😕', true); }, 25000));
        } else if (r.tipo === 'aceita' && r.de !== lig.outro) {
          sinal('ocupado', r.de).catch(() => {});
        } else if (r.tipo === 'oferta' && r.de === lig.outro && lig.estado === 'conectando' && !lig.pc) {
          try {
            const pc = lig.pc = novaConexao();
            await pc.setRemoteDescription(JSON.parse(r.dados));
            await pc.setLocalDescription(await pc.createAnswer());
            await juntaCaminhos(pc);
            if (lig && lig.pc === pc) await sinal('resposta', r.de, JSON.stringify(pc.localDescription));
          } catch (e) { fimLigacao('Não deu pra conectar. 😕', true); }
        } else if (r.tipo === 'resposta' && r.de === lig.outro && lig.pc) {
          try { await lig.pc.setRemoteDescription(JSON.parse(r.dados)); } catch (e) { fimLigacao('Não deu pra conectar. 😕', true); }
        } else if (r.tipo === 'recusa' && lig.estado === 'chamando') {
          fimLigacao(r.nome + ' recusou a ligação. 📵', true);
        } else if (r.tipo === 'recusa' && r.de === lig.outro) {
          fimLigacao('Ligação recusada.');
        } else if ((r.tipo === 'atendida' || r.tipo === 'desliga') && r.de === lig.outro && lig.estado === 'tocando') {
          fimLigacao(r.tipo === 'atendida' ? 'Outra pessoa atendeu. 🙂' : 'Você perdeu uma ligação de ' + r.nome + '. 📵');
        } else if (r.tipo === 'desliga' && r.de === lig.outro) {
          fimLigacao('Ligação encerrada.');
        } else if (r.tipo === 'ocupado' && r.de === lig.outro && lig.estado === 'conectando') {
          fimLigacao('Outra pessoa já atendeu. 🙂');
        }
      }
    }
    // Durante a ligação olha os recados mais rápido
    let rapidoTimer = null;
    function rapido(liga) {
      clearInterval(rapidoTimer); rapidoTimer = null;
      if (liga) rapidoTimer = setInterval(ler, 900);
    }
    window.addEventListener('pagehide', () => { if (lig) fimLigacao(null, true); });

    render();
    ler();
    // Olha mensagem nova a cada 2,5 segundos (só com a página aberta na tela)
    setInterval(() => { if (!document.hidden && !rapidoTimer) ler(); }, 2500);
  })();
  </script>
</body>
