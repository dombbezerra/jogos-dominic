<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#05060d" />
<title>Space Shooter</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: #05060d;
    color: #e8e8f0;
    font-family: system-ui, -apple-system, sans-serif;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    overscroll-behavior: none;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    gap: 8px;
  }
  #back-link {
    position: fixed;
    top: calc(env(safe-area-inset-top) + 8px);
    left: calc(env(safe-area-inset-left) + 8px);
    background: rgba(26, 32, 80, 0.85);
    color: #8fb6ff;
    border: 1px solid #4050a0;
    padding: 6px 12px;
    font-size: 13px;
    text-decoration: none;
    border-radius: 6px;
    z-index: 20;
    backdrop-filter: blur(6px);
  }
  #game-wrap {
    position: relative;
    width: 100%;
    max-width: 800px;
    aspect-ratio: 4 / 3;
    max-height: calc(100vh - 80px);
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    background: radial-gradient(ellipse at center, #0b1030 0%, #02030a 70%);
    border: 1px solid #222a55;
    box-shadow: 0 0 40px #1a2070;
    image-rendering: pixelated;
    touch-action: none;
  }
  #hud {
    font-size: clamp(11px, 2.4vw, 14px);
    letter-spacing: 1px;
    opacity: 0.9;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 4px 12px;
    padding: 0 8px;
  }
  #hud span { white-space: nowrap; }
  #pauseBtn {
    background: #1a2050;
    color: #e8e8f0;
    border: 1px solid #4050a0;
    padding: 6px 14px;
    font-family: inherit;
    font-size: clamp(11px, 2.4vw, 13px);
    letter-spacing: 1px;
    cursor: pointer;
    border-radius: 4px;
    min-height: 36px;
  }
  #pauseBtn:hover { background: #2a3070; }
  #pauseBtn:disabled { opacity: 0.4; cursor: not-allowed; }
  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    padding: 16px;
  }
  #overlay .panel {
    background: rgba(5, 8, 20, 0.9);
    border: 1px solid #4050a0;
    padding: 20px 24px;
    text-align: center;
    border-radius: 8px;
    pointer-events: auto;
    max-width: 90%;
  }
  #overlay h1 { margin: 0 0 8px; font-size: clamp(22px, 5vw, 32px); color: #8fb6ff; }
  #overlay p { margin: 4px 0; font-size: clamp(13px, 2.5vw, 16px); }
  #overlay .start-btn {
    margin-top: 16px;
    background: #4050a0;
    color: white;
    border: none;
    padding: 14px 32px;
    font-family: inherit;
    font-size: 16px;
    letter-spacing: 2px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
  }
  #overlay .start-btn:hover { background: #5060c0; }
  .hidden { display: none !important; }

  /* Touch controls */
  #touch-ui {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 15;
    display: none;
  }
  #joystick {
    position: absolute;
    bottom: calc(env(safe-area-inset-bottom) + 24px);
    left: calc(env(safe-area-inset-left) + 24px);
    width: 130px;
    height: 130px;
    background: rgba(64, 80, 160, 0.18);
    border: 2px solid rgba(143, 182, 255, 0.4);
    border-radius: 50%;
    pointer-events: auto;
    touch-action: none;
  }
  #joystick-knob {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 56px;
    height: 56px;
    background: rgba(143, 182, 255, 0.6);
    border: 2px solid rgba(255, 255, 255, 0.5);
    border-radius: 50%;
    pointer-events: none;
    transition: background 0.1s;
  }
  #shoot-btn {
    position: absolute;
    bottom: calc(env(safe-area-inset-bottom) + 40px);
    right: calc(env(safe-area-inset-right) + 28px);
    width: 100px;
    height: 100px;
    background: rgba(255, 80, 100, 0.3);
    border: 3px solid rgba(255, 100, 120, 0.7);
    border-radius: 50%;
    color: white;
    font-size: 14px;
    font-weight: bold;
    letter-spacing: 1px;
    pointer-events: auto;
    touch-action: none;
    display: flex;
    align-items: center;
    justify-content: center;
    text-shadow: 0 1px 3px rgba(0,0,0,0.5);
  }
  #shoot-btn:active, #shoot-btn.active {
    background: rgba(255, 80, 100, 0.6);
    transform: scale(0.95);
  }
  body.touch #touch-ui { display: block; }
  @media (hover: none) and (pointer: coarse) {
    #touch-ui { display: block; }
  }
</style>
</head>
<body>
  <a href="../index.html" id="back-link" onclick="if(window!==window.top){event.preventDefault();window.parent.postMessage({type:'closeGame'},'*');}">← Menu</a>
  <div id="game-wrap">
    <canvas id="game" width="800" height="600" tabindex="0"></canvas>
    <div id="overlay">
      <div class="panel" id="panel">
        <h1>SPACE SHOOTER</h1>
        <p>Setas / WASD para mover</p>
        <p>Espaço ou X para atirar</p>
        <p>P ou Esc para pausar</p>
        <p style="margin-top:10px;opacity:0.7">No celular: use o joystick + botão</p>
        <button class="start-btn" id="startBtn">JOGAR</button>
      </div>
    </div>
  </div>
  <div id="hud">
    <span>PONTOS: <b id="score">0</b></span>
    <span>VIDAS: <b id="lives">3</b></span>
    <span>NÍVEL: <b id="level">1</b></span>
    <button id="pauseBtn" disabled>PAUSAR</button>
  </div>
  <div id="touch-ui">
    <div id="joystick"><div id="joystick-knob"></div></div>
    <button id="shoot-btn">FOGO</button>
  </div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width;
const H = canvas.height;

const scoreEl = document.getElementById('score');
const livesEl = document.getElementById('lives');
const levelEl = document.getElementById('level');
const overlay = document.getElementById('overlay');
const panel = document.getElementById('panel');
const pauseBtn = document.getElementById('pauseBtn');

const keys = {};
addEventListener('keydown', e => {
  keys[e.key.toLowerCase()] = true;
  if (e.key === 'Enter' && state.mode !== 'playing' && state.mode !== 'paused') startGame();
  if ((e.key === 'p' || e.key === 'P' || e.key === 'Escape') && (state.mode === 'playing' || state.mode === 'paused')) togglePause();
  if ([' ', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) e.preventDefault();
});
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

canvas.addEventListener('click', () => {
  canvas.focus();
  if (state.mode === 'menu' || state.mode === 'gameover') startGame();
  else if (state.mode === 'paused') togglePause();
});
document.getElementById('startBtn').addEventListener('click', e => {
  e.stopPropagation();
  if (state.mode === 'menu' || state.mode === 'gameover') startGame();
  else if (state.mode === 'paused') togglePause();
});
window.addEventListener('load', () => canvas.focus());

// ── Touch controls ──
if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
  document.body.classList.add('touch');
}

const joystick = document.getElementById('joystick');
const knob = document.getElementById('joystick-knob');
const shootBtn = document.getElementById('shoot-btn');

let joyTouchId = null;
const JOY_RADIUS = 50;
const DEAD_ZONE = 0.18;

function setMoveKeys(dx, dy) {
  const mag = Math.hypot(dx, dy);
  if (mag < DEAD_ZONE) {
    keys['arrowleft'] = keys['arrowright'] = keys['arrowup'] = keys['arrowdown'] = false;
    return;
  }
  const ang = Math.atan2(dy, dx);
  keys['arrowleft']  = Math.cos(ang) < -0.4;
  keys['arrowright'] = Math.cos(ang) > 0.4;
  keys['arrowup']    = Math.sin(ang) < -0.4;
  keys['arrowdown']  = Math.sin(ang) > 0.4;
}

function updateKnob(dx, dy) {
  const mag = Math.hypot(dx, dy);
  const max = JOY_RADIUS;
  if (mag > max) { dx = dx * max / mag; dy = dy * max / mag; }
  knob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
}

function resetKnob() {
  knob.style.transform = 'translate(-50%, -50%)';
  setMoveKeys(0, 0);
}

joystick.addEventListener('touchstart', e => {
  e.preventDefault();
  if (joyTouchId !== null) return;
  const t = e.changedTouches[0];
  joyTouchId = t.identifier;
  const r = joystick.getBoundingClientRect();
  const cx = r.left + r.width / 2;
  const cy = r.top + r.height / 2;
  const dx = t.clientX - cx, dy = t.clientY - cy;
  updateKnob(dx, dy);
  setMoveKeys(dx / JOY_RADIUS, dy / JOY_RADIUS);
}, { passive: false });

joystick.addEventListener('touchmove', e => {
  e.preventDefault();
  for (const t of e.changedTouches) {
    if (t.identifier !== joyTouchId) continue;
    const r = joystick.getBoundingClientRect();
    const cx = r.left + r.width / 2;
    const cy = r.top + r.height / 2;
    const dx = t.clientX - cx, dy = t.clientY - cy;
    updateKnob(dx, dy);
    setMoveKeys(dx / JOY_RADIUS, dy / JOY_RADIUS);
  }
}, { passive: false });

function endJoy(e) {
  for (const t of e.changedTouches) {
    if (t.identifier === joyTouchId) {
      joyTouchId = null;
      resetKnob();
    }
  }
}
joystick.addEventListener('touchend', endJoy, { passive: false });
joystick.addEventListener('touchcancel', endJoy, { passive: false });

shootBtn.addEventListener('touchstart', e => {
  e.preventDefault();
  keys[' '] = true;
  shootBtn.classList.add('active');
  if (state.mode === 'menu' || state.mode === 'gameover') startGame();
  else if (state.mode === 'paused') togglePause();
}, { passive: false });

shootBtn.addEventListener('touchend', e => {
  e.preventDefault();
  keys[' '] = false;
  shootBtn.classList.remove('active');
}, { passive: false });

shootBtn.addEventListener('touchcancel', e => {
  keys[' '] = false;
  shootBtn.classList.remove('active');
}, { passive: false });

const state = {
  mode: 'menu', // menu, playing, paused, gameover
  score: 0,
  lives: 3,
  level: 1,
  player: null,
  bullets: [],
  enemies: [],
  enemyBullets: [],
  particles: [],
  stars: [],
  spawnTimer: 0,
  shootCooldown: 0,
  invuln: 0,
};

function makeStars() {
  state.stars = [];
  for (let i = 0; i < 120; i++) {
    state.stars.push({
      x: Math.random() * W,
      y: Math.random() * H,
      v: 0.3 + Math.random() * 1.8,
      r: Math.random() * 1.4 + 0.2,
    });
  }
}

function startGame() {
  state.mode = 'playing';
  state.score = 0;
  state.lives = 3;
  state.level = 1;
  state.bullets = [];
  state.enemies = [];
  state.enemyBullets = [];
  state.particles = [];
  state.player = { x: W / 2, y: H - 60, w: 32, h: 28, speed: 5 };
  state.spawnTimer = 0;
  state.invuln = 60;
  overlay.classList.add('hidden');
  pauseBtn.disabled = false;
  pauseBtn.textContent = 'PAUSAR';
  updateHUD();
}

function togglePause() {
  if (state.mode === 'playing') {
    state.mode = 'paused';
    pauseBtn.textContent = 'RETOMAR';
    panel.innerHTML = `
      <h1>PAUSADO</h1>
      <p style="margin-top:14px;opacity:0.7">Pressione P ou clique em RETOMAR</p>
    `;
    overlay.classList.remove('hidden');
  } else if (state.mode === 'paused') {
    state.mode = 'playing';
    pauseBtn.textContent = 'PAUSAR';
    overlay.classList.add('hidden');
  }
}

pauseBtn.addEventListener('click', () => {
  togglePause();
  pauseBtn.blur();
});

function gameOver() {
  state.mode = 'gameover';
  pauseBtn.disabled = true;
  pauseBtn.textContent = 'PAUSAR';
  panel.innerHTML = `
    <h1>GAME OVER</h1>
    <p>Pontuação final: <b>${state.score}</b></p>
    <p>Nível alcançado: <b>${state.level}</b></p>
    <p style="margin-top:14px;opacity:0.7">Pressione ENTER para jogar novamente</p>
  `;
  overlay.classList.remove('hidden');
}

function updateHUD() {
  scoreEl.textContent = state.score;
  livesEl.textContent = state.lives;
  levelEl.textContent = state.level;
}

function spawnEnemy() {
  const types = ['grunt', 'zigzag', 'shooter'];
  const weights = state.level >= 3 ? [0.4, 0.3, 0.3] : state.level === 2 ? [0.55, 0.3, 0.15] : [0.8, 0.2, 0];
  const r = Math.random();
  let type, acc = 0;
  for (let i = 0; i < types.length; i++) {
    acc += weights[i];
    if (r < acc) { type = types[i]; break; }
  }
  const e = {
    type,
    x: 30 + Math.random() * (W - 60),
    y: -30,
    w: 28,
    h: 24,
    vx: 0,
    vy: 1.2 + Math.random() * 0.6 + state.level * 0.2,
    hp: type === 'shooter' ? 2 : 1,
    t: 0,
    shootTimer: 60 + Math.random() * 60,
  };
  if (type === 'zigzag') e.vx = (Math.random() < 0.5 ? -1 : 1) * 2;
  state.enemies.push(e);
}

function shoot() {
  state.bullets.push({ x: state.player.x, y: state.player.y - 14, vy: -9, w: 3, h: 10 });
}

function enemyShoot(e) {
  const dx = state.player.x - e.x;
  const dy = state.player.y - e.y;
  const d = Math.hypot(dx, dy) || 1;
  const sp = 4;
  state.enemyBullets.push({ x: e.x, y: e.y + 12, vx: (dx / d) * sp, vy: (dy / d) * sp, w: 4, h: 4 });
}

function spawnParticles(x, y, color, n = 14) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = 1 + Math.random() * 3;
    state.particles.push({
      x, y,
      vx: Math.cos(a) * s,
      vy: Math.sin(a) * s,
      life: 30 + Math.random() * 20,
      color,
    });
  }
}

function rectsHit(a, b) {
  return Math.abs(a.x - b.x) < (a.w + b.w) / 2 &&
         Math.abs(a.y - b.y) < (a.h + b.h) / 2;
}

function update() {
  // stars sempre rolam
  for (const s of state.stars) {
    s.y += s.v;
    if (s.y > H) { s.y = 0; s.x = Math.random() * W; }
  }
  if (state.mode !== 'playing') return;

  const p = state.player;
  const left = keys['arrowleft'] || keys['a'];
  const right = keys['arrowright'] || keys['d'];
  const up = keys['arrowup'] || keys['w'];
  const down = keys['arrowdown'] || keys['s'];
  if (left) p.x -= p.speed;
  if (right) p.x += p.speed;
  if (up) p.y -= p.speed;
  if (down) p.y += p.speed;
  p.x = Math.max(p.w / 2, Math.min(W - p.w / 2, p.x));
  p.y = Math.max(p.h / 2, Math.min(H - p.h / 2, p.y));

  if (state.shootCooldown > 0) state.shootCooldown--;
  if ((keys[' '] || keys['x']) && state.shootCooldown === 0) {
    shoot();
    state.shootCooldown = 10;
  }

  if (state.invuln > 0) state.invuln--;

  // dificuldade aumenta
  state.spawnTimer--;
  const spawnRate = Math.max(20, 70 - state.level * 6);
  if (state.spawnTimer <= 0) {
    spawnEnemy();
    state.spawnTimer = spawnRate;
  }

  // sobe de nível a cada 500 pontos
  const targetLevel = 1 + Math.floor(state.score / 500);
  if (targetLevel > state.level) {
    state.level = targetLevel;
    updateHUD();
  }

  for (const b of state.bullets) b.y += b.vy;
  state.bullets = state.bullets.filter(b => b.y > -20);

  for (const b of state.enemyBullets) { b.x += b.vx; b.y += b.vy; }
  state.enemyBullets = state.enemyBullets.filter(b => b.y < H + 20 && b.y > -20 && b.x > -20 && b.x < W + 20);

  for (const e of state.enemies) {
    e.t++;
    e.y += e.vy;
    if (e.type === 'zigzag') {
      e.x += e.vx;
      if (e.x < 20 || e.x > W - 20) e.vx *= -1;
    }
    if (e.type === 'shooter') {
      e.shootTimer--;
      if (e.shootTimer <= 0) {
        enemyShoot(e);
        e.shootTimer = 70 + Math.random() * 60;
      }
    }
  }

  // colisões: tiro do jogador x inimigo
  for (const b of state.bullets) {
    for (const e of state.enemies) {
      if (e.hp <= 0) continue;
      if (rectsHit(b, e)) {
        e.hp--;
        b.dead = true;
        spawnParticles(e.x, e.y, '#ffb04a', 6);
        if (e.hp <= 0) {
          spawnParticles(e.x, e.y, '#ff5050', 18);
          state.score += e.type === 'shooter' ? 30 : e.type === 'zigzag' ? 20 : 10;
          updateHUD();
        }
        break;
      }
    }
  }
  state.bullets = state.bullets.filter(b => !b.dead);
  state.enemies = state.enemies.filter(e => e.hp > 0 && e.y < H + 40);

  // colisões: inimigo/tiro inimigo x jogador
  if (state.invuln === 0) {
    for (const e of state.enemies) {
      if (rectsHit(e, p)) { hitPlayer(); e.hp = 0; spawnParticles(e.x, e.y, '#ff5050', 18); break; }
    }
    for (const b of state.enemyBullets) {
      if (rectsHit(b, p)) { hitPlayer(); b.dead = true; break; }
    }
    state.enemyBullets = state.enemyBullets.filter(b => !b.dead);
  }

  for (const pt of state.particles) {
    pt.x += pt.vx;
    pt.y += pt.vy;
    pt.vx *= 0.96;
    pt.vy *= 0.96;
    pt.life--;
  }
  state.particles = state.particles.filter(pt => pt.life > 0);
}

function hitPlayer() {
  state.lives--;
  state.invuln = 90;
  spawnParticles(state.player.x, state.player.y, '#7fb6ff', 24);
  updateHUD();
  if (state.lives <= 0) gameOver();
}

function drawShip(x, y, w, h, color, flicker = false) {
  if (flicker && Math.floor(performance.now() / 80) % 2 === 0) return;
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(x, y - h / 2);
  ctx.lineTo(x + w / 2, y + h / 2);
  ctx.lineTo(x, y + h / 4);
  ctx.lineTo(x - w / 2, y + h / 2);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = '#ffffffaa';
  ctx.fillRect(x - 2, y - 4, 4, 6);
}

function drawEnemy(e) {
  const colors = { grunt: '#ff5d5d', zigzag: '#ffb84a', shooter: '#c46bff' };
  ctx.fillStyle = colors[e.type];
  ctx.beginPath();
  ctx.moveTo(e.x, e.y + e.h / 2);
  ctx.lineTo(e.x + e.w / 2, e.y - e.h / 2);
  ctx.lineTo(e.x - e.w / 2, e.y - e.h / 2);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = '#000';
  ctx.fillRect(e.x - 3, e.y - 4, 6, 4);
}

function render() {
  ctx.clearRect(0, 0, W, H);
  // estrelas
  for (const s of state.stars) {
    ctx.fillStyle = `rgba(255,255,255,${0.3 + s.r * 0.4})`;
    ctx.fillRect(s.x, s.y, s.r, s.r);
  }

  if (state.mode === 'playing' || state.mode === 'gameover') {
    // tiros jogador
    ctx.fillStyle = '#7ff0ff';
    for (const b of state.bullets) ctx.fillRect(b.x - b.w / 2, b.y - b.h / 2, b.w, b.h);
    // tiros inimigos
    ctx.fillStyle = '#ff80c0';
    for (const b of state.enemyBullets) ctx.fillRect(b.x - b.w / 2, b.y - b.h / 2, b.w, b.h);
    // inimigos
    for (const e of state.enemies) drawEnemy(e);
    // partículas
    for (const pt of state.particles) {
      ctx.fillStyle = pt.color;
      ctx.globalAlpha = Math.max(0, pt.life / 50);
      ctx.fillRect(pt.x, pt.y, 2, 2);
    }
    ctx.globalAlpha = 1;
    // jogador
    if (state.mode === 'playing') {
      drawShip(state.player.x, state.player.y, state.player.w, state.player.h, '#7fb6ff', state.invuln > 0);
    }
  }
}

function loop() {
  update();
  render();
  requestAnimationFrame(loop);
}

makeStars();
loop();
</script>
</body>
</html>
