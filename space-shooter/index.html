<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#05060d" />
<title>Space Shooter</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: #05060d;
    color: #e8e8f0;
    font-family: system-ui, -apple-system, sans-serif;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    overscroll-behavior: none;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    gap: 8px;
  }
  #back-link {
    position: fixed;
    top: calc(env(safe-area-inset-top) + 8px);
    left: calc(env(safe-area-inset-left) + 8px);
    background: rgba(26, 32, 80, 0.85);
    color: #8fb6ff;
    border: 1px solid #4050a0;
    padding: 6px 12px;
    font-size: 13px;
    text-decoration: none;
    border-radius: 6px;
    z-index: 20;
    backdrop-filter: blur(6px);
  }
  #game-wrap {
    position: relative;
    width: 100%;
    max-width: 800px;
    aspect-ratio: 4 / 3;
    max-height: calc(100vh - 80px);
  }
  #game {
    display: block;
    width: 100%;
    height: 100%;
    background: radial-gradient(ellipse at center, #0b1030 0%, #02030a 70%);
    border: 1px solid #222a55;
    box-shadow: 0 0 40px #1a2070;
    touch-action: none;
  }
  #preview, .ship-card canvas { display: block; margin: 0 auto; background: none; border: 0; }
  #hud {
    font-size: clamp(11px, 2.4vw, 14px);
    letter-spacing: 1px;
    opacity: 0.9;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 4px 12px;
    padding: 0 8px;
  }
  #hud span { white-space: nowrap; }
  #pauseBtn {
    background: #1a2050;
    color: #e8e8f0;
    border: 1px solid #4050a0;
    padding: 6px 14px;
    font-family: inherit;
    font-size: clamp(11px, 2.4vw, 13px);
    letter-spacing: 1px;
    cursor: pointer;
    border-radius: 4px;
    min-height: 36px;
  }
  #pauseBtn:hover { background: #2a3070; }
  #pauseBtn:disabled { opacity: 0.4; cursor: not-allowed; }
  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    padding: 16px;
  }
  #overlay .panel {
    background: rgba(5, 8, 20, 0.9);
    border: 1px solid #4050a0;
    padding: 20px 24px;
    text-align: center;
    border-radius: 8px;
    pointer-events: auto;
    max-width: 90%;
  }
  #overlay h1 { margin: 0 0 8px; font-size: clamp(22px, 5vw, 32px); color: #8fb6ff; }
  #overlay p { margin: 4px 0; font-size: clamp(13px, 2.5vw, 16px); }
  #overlay .start-btn {
    margin-top: 16px;
    background: #4050a0;
    color: white;
    border: none;
    padding: 14px 32px;
    font-family: inherit;
    font-size: 16px;
    letter-spacing: 2px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
  }
  #overlay .start-btn:hover { background: #5060c0; }
  .hidden { display: none !important; }

  /* ── Menu inicial ── */
  #menu, #naves {
    position: absolute;
    inset: 0;
    z-index: 12;
    display: flex;
    flex-direction: column;
    align-items: center;
    background: radial-gradient(ellipse at 50% 36%, #3d2670 0%, #1c1036 55%, #0c0718 100%);
    padding: 12px 16px 16px;
    overflow-y: auto;
  }
  .menu-title { text-align: center; line-height: .9; margin-top: 2%; }
  .menu-title .l1 {
    display: block;
    font-size: clamp(24px, 6.5vw, 50px);
    font-weight: 900; letter-spacing: 2px; color: #ffd42a;
    text-shadow: 0 4px 0 rgba(0,0,0,.5);
  }
  .menu-title .l2 {
    display: block;
    font-size: clamp(32px, 9.5vw, 72px);
    font-weight: 900; letter-spacing: 1px; color: #ff4fd8;
    text-shadow: 0 4px 0 rgba(0,0,0,.5);
  }
  #preview-wrap {
    flex: 1;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    width: 100%;
  }
  #preview {
    width: clamp(130px, 30vw, 200px);
    height: clamp(130px, 30vw, 200px);
    animation: float 3.2s ease-in-out infinite;
  }
  @keyframes float { 0%,100% { transform: translateY(-6px); } 50% { transform: translateY(6px); } }
  .ship-name { font-size: clamp(18px, 4.4vw, 28px); font-weight: 800; letter-spacing: 1px; margin-top: 2px; }
  .ship-desc { font-size: clamp(12px, 2.8vw, 16px); opacity: .6; margin-top: 3px; }
  .menu-btns {
    display: flex; gap: clamp(8px, 2vw, 14px);
    width: 100%; max-width: 620px;
  }
  .mbtn {
    flex: 1;
    border: 3px solid #14112a;
    border-radius: 4px;
    padding: clamp(11px, 2.4vw, 17px) 4px;
    font-family: inherit;
    font-weight: 900;
    font-size: clamp(13px, 3vw, 20px);
    letter-spacing: 1px;
    color: #14112a;
    cursor: pointer;
    box-shadow: 0 5px 0 rgba(0,0,0,.5);
  }
  .mbtn:active { transform: translateY(4px); box-shadow: 0 1px 0 rgba(0,0,0,.5); }
  .mbtn.naves { background: #5bc8f5; }
  .mbtn.play  { background: #22c55e; color: #fff; flex: 1.4; font-size: clamp(16px, 3.8vw, 26px); }

  /* ── Escolha de nave ── */
  .ship-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(clamp(112px, 22vw, 150px), 1fr));
    gap: 10px;
    width: 100%; max-width: 620px;
    margin-bottom: 14px;
  }
  .ship-card {
    background: rgba(255,255,255,.05);
    border: 2px solid #3b2f6e;
    border-radius: 8px;
    padding: 10px 6px 8px;
    text-align: center;
    cursor: pointer;
    transition: transform .12s, border-color .12s;
  }
  .ship-card:hover { transform: translateY(-3px); }
  .ship-card.on { border-color: #ffd42a; background: rgba(255,212,42,.13); }
  .ship-card canvas { width: clamp(58px, 12vw, 76px); height: clamp(58px, 12vw, 76px); }
  .ship-card .n { font-weight: 800; font-size: clamp(11px, 2.4vw, 14px); margin-top: 2px; }
  .ship-card .s { font-size: clamp(9px, 2vw, 11px); opacity: .55; margin-top: 2px; }

  /* Touch controls */
  #touch-ui {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 15;
    display: none;
  }
  #joystick {
    position: absolute;
    bottom: calc(env(safe-area-inset-bottom) + 24px);
    left: calc(env(safe-area-inset-left) + 24px);
    width: 130px;
    height: 130px;
    background: rgba(64, 80, 160, 0.18);
    border: 2px solid rgba(143, 182, 255, 0.4);
    border-radius: 50%;
    pointer-events: auto;
    touch-action: none;
  }
  #joystick-knob {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 56px;
    height: 56px;
    background: rgba(143, 182, 255, 0.6);
    border: 2px solid rgba(255, 255, 255, 0.5);
    border-radius: 50%;
    pointer-events: none;
    transition: background 0.1s;
  }
  #shoot-btn {
    position: absolute;
    bottom: calc(env(safe-area-inset-bottom) + 40px);
    right: calc(env(safe-area-inset-right) + 28px);
    width: 100px;
    height: 100px;
    background: rgba(255, 80, 100, 0.3);
    border: 3px solid rgba(255, 100, 120, 0.7);
    border-radius: 50%;
    color: white;
    font-size: 14px;
    font-weight: bold;
    letter-spacing: 1px;
    pointer-events: auto;
    touch-action: none;
    display: flex;
    align-items: center;
    justify-content: center;
    text-shadow: 0 1px 3px rgba(0,0,0,0.5);
  }
  #shoot-btn:active, #shoot-btn.active {
    background: rgba(255, 80, 100, 0.6);
    transform: scale(0.95);
  }
  body.touch #touch-ui { display: block; }
  @media (hover: none) and (pointer: coarse) {
    #touch-ui { display: block; }
  }
</style>
</head>
<body>
  <a href="../index.html" id="back-link" onclick="if(window!==window.top){event.preventDefault();window.parent.postMessage({type:'closeGame'},'*');}">← Menu</a>
  <div id="game-wrap">
    <canvas id="game" width="800" height="600" tabindex="0"></canvas>

    <div id="menu">
      <div class="menu-title"><span class="l1">SPACE</span><span class="l2">SHOOTER</span></div>
      <div id="preview-wrap">
        <canvas id="preview" width="220" height="220"></canvas>
        <div class="ship-name" id="shipName">—</div>
        <div class="ship-desc" id="shipDesc">—</div>
      </div>
      <div class="menu-btns">
        <button class="mbtn naves" id="btnNaves">NAVES</button>
        <button class="mbtn play" id="btnPlay">JOGAR</button>
      </div>
    </div>

    <div id="naves" class="hidden">
      <div class="menu-title" style="margin: 6px 0 14px">
        <span class="l1" style="font-size: clamp(19px, 5vw, 34px)">ESCOLHA SUA NAVE</span>
      </div>
      <div class="ship-grid" id="shipGrid"></div>
      <div class="menu-btns">
        <button class="mbtn naves" id="btnVoltar">VOLTAR</button>
      </div>
    </div>

    <div id="overlay" class="hidden">
      <div class="panel" id="panel"></div>
    </div>
  </div>
  <div id="hud">
    <span>PONTOS: <b id="score">0</b></span>
    <span>VIDAS: <b id="lives">3</b></span>
    <span>NÍVEL: <b id="level">1</b></span>
    <button id="pauseBtn" disabled>PAUSAR</button>
  </div>
  <div id="touch-ui">
    <div id="joystick"><div id="joystick-knob"></div></div>
    <button id="shoot-btn">FOGO</button>
  </div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width;
const H = canvas.height;

const scoreEl = document.getElementById('score');
const livesEl = document.getElementById('lives');
const levelEl = document.getElementById('level');
const overlay = document.getElementById('overlay');
const panel = document.getElementById('panel');
const pauseBtn = document.getElementById('pauseBtn');

const keys = {};
addEventListener('keydown', e => {
  keys[e.key.toLowerCase()] = true;
  if (e.key === 'Enter' && (state.mode === 'menu' || state.mode === 'gameover')) startGame();
  if ((e.key === 'p' || e.key === 'P' || e.key === 'Escape') && (state.mode === 'playing' || state.mode === 'paused')) togglePause();
  if ([' ', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) e.preventDefault();
});
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

canvas.addEventListener('click', () => {
  canvas.focus();
  if (state.mode === 'paused') togglePause();
});
window.addEventListener('load', () => canvas.focus());

// ══════════════════════════════════════════════════════════════════
//  NAVES
// ══════════════════════════════════════════════════════════════════
const SHIPS = [
  { id:'veloz',    nome:'VELOZ',    desc:'Voa rápido',      cor:'#5bc8f5', ac:'#dff6ff',
    speed:7.0, cd:11, shots:1, vidas:3, w:26, h:26, forma:'dardo' },
  { id:'metralha', nome:'METRALHA', desc:'Atira muito',     cor:'#ffd42a', ac:'#fff6c2',
    speed:5.0, cd:5,  shots:1, vidas:3, w:32, h:28, forma:'caca' },
  { id:'tridente', nome:'TRIDENTE', desc:'Atira em três',   cor:'#ff4fd8', ac:'#ffd9f6',
    speed:4.6, cd:16, shots:3, vidas:3, w:38, h:28, forma:'asa' },
  { id:'tanque',   nome:'TANQUE',   desc:'Aguenta pancada', cor:'#22c55e', ac:'#c9ffdb',
    speed:3.9, cd:13, shots:2, vidas:5, w:42, h:32, forma:'bloco' },
];
const FORMAS = {
  // naves do jogador
  dardo: [[0,-20],[5,-6],[7,10],[3,13],[-3,13],[-7,10],[-5,-6]],
  caca:  [[0,-19],[4,-8],[16,6],[16,11],[6,9],[4,13],[-4,13],[-6,9],[-16,11],[-16,6],[-4,-8]],
  asa:   [[0,-16],[6,-6],[20,8],[10,10],[4,13],[-4,13],[-10,10],[-20,8],[-6,-6]],
  bloco: [[0,-18],[7,-10],[9,2],[18,4],[18,12],[8,12],[6,15],[-6,15],[-8,12],[-18,12],[-18,4],[-9,2],[-7,-10]],
  // inimigos
  besouro:  [[0,-16],[6,-5],[15,5],[7,8],[3,13],[-3,13],[-7,8],[-15,5],[-6,-5]],
  lamina:   [[0,-19],[4,-5],[11,4],[5,7],[2,14],[-2,14],[-5,7],[-11,4],[-4,-5]],
  canhao:   [[0,-13],[8,-8],[10,0],[19,2],[19,10],[12,9],[7,13],[-7,13],[-12,9],[-19,10],[-19,2],[-10,0],[-8,-8]],
};
// esc = ajuste para o desenho bater com a caixa de colisão
const ENEMY_ART = {
  grunt:   { forma:'besouro', cor:'#ff5d5d', ac:'#ffd2d2', esc:1.47, w:28, h:24 },
  zigzag:  { forma:'lamina',  cor:'#ffb84a', ac:'#ffeac4', esc:2.00, w:22, h:26 },
  shooter: { forma:'canhao',  cor:'#c46bff', ac:'#eed2ff', esc:1.16, w:36, h:24 },
};

let shipIdx = 0;
try { const v = +localStorage.getItem('ssNave'); if (v >= 0 && v < SHIPS.length) shipIdx = v; } catch (e) {}
const nave = () => SHIPS[shipIdx];

// Desenha uma nave. flip = de cabeça para baixo (inimigos descendo).
function drawShipArt(g, sh, x, y, size, t, flip, branco) {
  const u = size / 44;
  const pts = FORMAS[sh.forma];
  g.save();
  g.translate(x, y);
  if (flip) g.scale(1, -1);

  // fogo do motor
  const fl = (7 + Math.sin(t * .35) * 3) * u;
  const gf = g.createLinearGradient(0, 11 * u, 0, 11 * u + fl);
  gf.addColorStop(0, 'rgba(255,220,120,.95)');
  gf.addColorStop(1, 'rgba(255,90,40,0)');
  g.fillStyle = gf;
  g.beginPath();
  g.moveTo(-4.5 * u, 11 * u); g.lineTo(0, 11 * u + fl); g.lineTo(4.5 * u, 11 * u);
  g.closePath(); g.fill();

  // casco
  g.beginPath();
  pts.forEach(([px, py], i) => i ? g.lineTo(px * u, py * u) : g.moveTo(px * u, py * u));
  g.closePath();
  if (branco) {
    g.fillStyle = '#ffffff';
  } else {
    const gg = g.createLinearGradient(0, -20 * u, 0, 15 * u);
    gg.addColorStop(0, sh.ac); gg.addColorStop(.45, sh.cor); gg.addColorStop(1, '#1b1636');
    g.fillStyle = gg;
  }
  g.fill();
  g.strokeStyle = '#0d0a1e'; g.lineWidth = 2.2 * u; g.lineJoin = 'round'; g.stroke();

  // cabine
  g.beginPath();
  g.ellipse(0, -6 * u, 3.4 * u, 5.4 * u, 0, 0, Math.PI * 2);
  g.fillStyle = '#0d1030'; g.fill();
  g.strokeStyle = sh.ac; g.lineWidth = 1.4 * u; g.stroke();
  g.beginPath();
  g.ellipse(-1.1 * u, -7.6 * u, 1.2 * u, 2 * u, -.4, 0, Math.PI * 2);
  g.fillStyle = 'rgba(255,255,255,.65)'; g.fill();

  g.restore();
}

// ── Telas ──
const menuEl = document.getElementById('menu');
const navesEl = document.getElementById('naves');
const previewCtx = document.getElementById('preview').getContext('2d');

function showMenu() {
  state.mode = 'menu';
  menuEl.classList.remove('hidden');
  navesEl.classList.add('hidden');
  overlay.classList.add('hidden');
  pauseBtn.disabled = true;
  document.getElementById('shipName').textContent = nave().nome;
  document.getElementById('shipDesc').textContent = nave().desc;
}

function montarGrade() {
  const g = document.getElementById('shipGrid');
  g.innerHTML = '';
  SHIPS.forEach((sh, i) => {
    const card = document.createElement('div');
    card.className = 'ship-card' + (i === shipIdx ? ' on' : '');
    card.innerHTML = `<canvas width="120" height="120"></canvas>
                      <div class="n" style="color:${sh.cor}">${sh.nome}</div>
                      <div class="s">${sh.desc}</div>`;
    const c = card.querySelector('canvas');
    drawShipArt(c.getContext('2d'), sh, 60, 62, 92, 0);
    card.onclick = () => {
      shipIdx = i;
      try { localStorage.setItem('ssNave', i); } catch (e) {}
      montarGrade();
      showMenu();
    };
    g.appendChild(card);
  });
}

document.getElementById('btnPlay').onclick = () => startGame();
document.getElementById('btnNaves').onclick = () => {
  state.mode = 'naves';
  montarGrade();
  menuEl.classList.add('hidden');
  navesEl.classList.remove('hidden');
};
document.getElementById('btnVoltar').onclick = () => showMenu();

// ── Touch controls ──
if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
  document.body.classList.add('touch');
}

const joystick = document.getElementById('joystick');
const knob = document.getElementById('joystick-knob');
const shootBtn = document.getElementById('shoot-btn');

let joyTouchId = null;
const JOY_RADIUS = 50;
const DEAD_ZONE = 0.18;

function setMoveKeys(dx, dy) {
  const mag = Math.hypot(dx, dy);
  if (mag < DEAD_ZONE) {
    keys['arrowleft'] = keys['arrowright'] = keys['arrowup'] = keys['arrowdown'] = false;
    return;
  }
  const ang = Math.atan2(dy, dx);
  keys['arrowleft']  = Math.cos(ang) < -0.4;
  keys['arrowright'] = Math.cos(ang) > 0.4;
  keys['arrowup']    = Math.sin(ang) < -0.4;
  keys['arrowdown']  = Math.sin(ang) > 0.4;
}

function updateKnob(dx, dy) {
  const mag = Math.hypot(dx, dy);
  const max = JOY_RADIUS;
  if (mag > max) { dx = dx * max / mag; dy = dy * max / mag; }
  knob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
}

function resetKnob() {
  knob.style.transform = 'translate(-50%, -50%)';
  setMoveKeys(0, 0);
}

joystick.addEventListener('touchstart', e => {
  e.preventDefault();
  if (joyTouchId !== null) return;
  const t = e.changedTouches[0];
  joyTouchId = t.identifier;
  const r = joystick.getBoundingClientRect();
  const cx = r.left + r.width / 2;
  const cy = r.top + r.height / 2;
  const dx = t.clientX - cx, dy = t.clientY - cy;
  updateKnob(dx, dy);
  setMoveKeys(dx / JOY_RADIUS, dy / JOY_RADIUS);
}, { passive: false });

joystick.addEventListener('touchmove', e => {
  e.preventDefault();
  for (const t of e.changedTouches) {
    if (t.identifier !== joyTouchId) continue;
    const r = joystick.getBoundingClientRect();
    const cx = r.left + r.width / 2;
    const cy = r.top + r.height / 2;
    const dx = t.clientX - cx, dy = t.clientY - cy;
    updateKnob(dx, dy);
    setMoveKeys(dx / JOY_RADIUS, dy / JOY_RADIUS);
  }
}, { passive: false });

function endJoy(e) {
  for (const t of e.changedTouches) {
    if (t.identifier === joyTouchId) {
      joyTouchId = null;
      resetKnob();
    }
  }
}
joystick.addEventListener('touchend', endJoy, { passive: false });
joystick.addEventListener('touchcancel', endJoy, { passive: false });

shootBtn.addEventListener('touchstart', e => {
  e.preventDefault();
  keys[' '] = true;
  shootBtn.classList.add('active');
  if (state.mode === 'menu' || state.mode === 'gameover') startGame();
  else if (state.mode === 'paused') togglePause();
}, { passive: false });

shootBtn.addEventListener('touchend', e => {
  e.preventDefault();
  keys[' '] = false;
  shootBtn.classList.remove('active');
}, { passive: false });

shootBtn.addEventListener('touchcancel', e => {
  keys[' '] = false;
  shootBtn.classList.remove('active');
}, { passive: false });

const state = {
  mode: 'menu', // menu, playing, paused, gameover
  score: 0,
  lives: 3,
  level: 1,
  player: null,
  bullets: [],
  enemies: [],
  enemyBullets: [],
  particles: [],
  stars: [],
  spawnTimer: 0,
  shootCooldown: 0,
  invuln: 0,
};

function makeStars() {
  state.stars = [];
  for (let i = 0; i < 120; i++) {
    state.stars.push({
      x: Math.random() * W,
      y: Math.random() * H,
      v: 0.3 + Math.random() * 1.8,
      r: Math.random() * 1.4 + 0.2,
    });
  }
}

function startGame() {
  const sh = nave();
  state.mode = 'playing';
  state.ship = sh;
  state.score = 0;
  state.lives = sh.vidas;
  state.level = 1;
  state.bullets = [];
  state.enemies = [];
  state.enemyBullets = [];
  state.particles = [];
  state.player = { x: W / 2, y: H - 60, w: sh.w, h: sh.h, speed: sh.speed };
  state.spawnTimer = 0;
  state.invuln = 60;
  menuEl.classList.add('hidden');
  navesEl.classList.add('hidden');
  overlay.classList.add('hidden');
  pauseBtn.disabled = false;
  pauseBtn.textContent = 'PAUSAR';
  updateHUD();
  canvas.focus();
}

function togglePause() {
  if (state.mode === 'playing') {
    state.mode = 'paused';
    pauseBtn.textContent = 'RETOMAR';
    panel.innerHTML = `
      <h1>PAUSADO</h1>
      <p style="margin-top:14px;opacity:0.7">Pressione P ou clique em RETOMAR</p>
    `;
    overlay.classList.remove('hidden');
  } else if (state.mode === 'paused') {
    state.mode = 'playing';
    pauseBtn.textContent = 'PAUSAR';
    overlay.classList.add('hidden');
  }
}

pauseBtn.addEventListener('click', () => {
  togglePause();
  pauseBtn.blur();
});

function gameOver() {
  state.mode = 'gameover';
  pauseBtn.disabled = true;
  pauseBtn.textContent = 'PAUSAR';
  panel.innerHTML = `
    <h1>GAME OVER</h1>
    <p>Pontuação final: <b>${state.score}</b></p>
    <p>Nível alcançado: <b>${state.level}</b></p>
    <div style="display:flex;gap:10px;margin-top:16px">
      <button class="mbtn naves" id="goMenu" style="flex:1;font-size:14px">MENU</button>
      <button class="mbtn play"  id="goAgain" style="flex:1;font-size:16px">DE NOVO</button>
    </div>
  `;
  overlay.classList.remove('hidden');
  document.getElementById('goMenu').onclick = e => { e.stopPropagation(); showMenu(); };
  document.getElementById('goAgain').onclick = e => { e.stopPropagation(); startGame(); };
}

function updateHUD() {
  scoreEl.textContent = state.score;
  livesEl.textContent = state.lives;
  levelEl.textContent = state.level;
}

function spawnEnemy() {
  const types = ['grunt', 'zigzag', 'shooter'];
  const weights = state.level >= 3 ? [0.4, 0.3, 0.3] : state.level === 2 ? [0.55, 0.3, 0.15] : [0.8, 0.2, 0];
  const r = Math.random();
  let type, acc = 0;
  for (let i = 0; i < types.length; i++) {
    acc += weights[i];
    if (r < acc) { type = types[i]; break; }
  }
  const art = ENEMY_ART[type];
  const e = {
    type,
    x: 30 + Math.random() * (W - 60),
    y: -30,
    w: art.w,
    h: art.h,
    vx: 0,
    vy: 1.2 + Math.random() * 0.6 + state.level * 0.2,
    hp: type === 'shooter' ? 2 : 1,
    t: Math.random() * 60,
    flash: 0,
    shootTimer: 60 + Math.random() * 60,
  };
  if (type === 'zigzag') e.vx = (Math.random() < 0.5 ? -1 : 1) * 2;
  state.enemies.push(e);
}

function shoot() {
  const p = state.player, y = p.y - 14, sh = state.ship;
  const add = (x, vx) => state.bullets.push({ x, y, vx, vy: -9, w: 3, h: 10 });
  if (sh.shots === 2)      { add(p.x - 10, 0); add(p.x + 10, 0); }
  else if (sh.shots === 3) { add(p.x, 0); add(p.x - 6, -2.6); add(p.x + 6, 2.6); }
  else                       add(p.x, 0);
}

function enemyShoot(e) {
  const dx = state.player.x - e.x;
  const dy = state.player.y - e.y;
  const d = Math.hypot(dx, dy) || 1;
  const sp = 4;
  state.enemyBullets.push({ x: e.x, y: e.y + 12, vx: (dx / d) * sp, vy: (dy / d) * sp, w: 4, h: 4 });
}

function spawnParticles(x, y, color, n = 14) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = 1 + Math.random() * 3;
    state.particles.push({
      x, y,
      vx: Math.cos(a) * s,
      vy: Math.sin(a) * s,
      life: 30 + Math.random() * 20,
      color,
    });
  }
}

function rectsHit(a, b) {
  return Math.abs(a.x - b.x) < (a.w + b.w) / 2 &&
         Math.abs(a.y - b.y) < (a.h + b.h) / 2;
}

function update() {
  // stars sempre rolam
  for (const s of state.stars) {
    s.y += s.v;
    if (s.y > H) { s.y = 0; s.x = Math.random() * W; }
  }
  if (state.mode !== 'playing') return;

  const p = state.player;
  const left = keys['arrowleft'] || keys['a'];
  const right = keys['arrowright'] || keys['d'];
  const up = keys['arrowup'] || keys['w'];
  const down = keys['arrowdown'] || keys['s'];
  if (left) p.x -= p.speed;
  if (right) p.x += p.speed;
  if (up) p.y -= p.speed;
  if (down) p.y += p.speed;
  p.x = Math.max(p.w / 2, Math.min(W - p.w / 2, p.x));
  p.y = Math.max(p.h / 2, Math.min(H - p.h / 2, p.y));

  if (state.shootCooldown > 0) state.shootCooldown--;
  if ((keys[' '] || keys['x']) && state.shootCooldown === 0) {
    shoot();
    state.shootCooldown = state.ship.cd;
  }

  if (state.invuln > 0) state.invuln--;

  // dificuldade aumenta
  state.spawnTimer--;
  const spawnRate = Math.max(20, 70 - state.level * 6);
  if (state.spawnTimer <= 0) {
    spawnEnemy();
    state.spawnTimer = spawnRate;
  }

  // sobe de nível a cada 500 pontos
  const targetLevel = 1 + Math.floor(state.score / 500);
  if (targetLevel > state.level) {
    state.level = targetLevel;
    updateHUD();
  }

  for (const b of state.bullets) { b.y += b.vy; b.x += b.vx || 0; }
  state.bullets = state.bullets.filter(b => b.y > -20 && b.x > -20 && b.x < W + 20);

  for (const b of state.enemyBullets) { b.x += b.vx; b.y += b.vy; }
  state.enemyBullets = state.enemyBullets.filter(b => b.y < H + 20 && b.y > -20 && b.x > -20 && b.x < W + 20);

  for (const e of state.enemies) {
    e.t++;
    if (e.flash > 0) e.flash--;
    e.y += e.vy;
    if (e.type === 'zigzag') {
      e.x += e.vx;
      if (e.x < 20 || e.x > W - 20) e.vx *= -1;
    }
    if (e.type === 'shooter') {
      e.shootTimer--;
      if (e.shootTimer <= 0) {
        enemyShoot(e);
        e.shootTimer = 70 + Math.random() * 60;
      }
    }
  }

  // colisões: tiro do jogador x inimigo
  for (const b of state.bullets) {
    for (const e of state.enemies) {
      if (e.hp <= 0) continue;
      if (rectsHit(b, e)) {
        e.hp--;
        e.flash = 4;
        b.dead = true;
        spawnParticles(e.x, e.y, '#ffb04a', 6);
        if (e.hp <= 0) {
          spawnParticles(e.x, e.y, '#ff5050', 18);
          state.score += e.type === 'shooter' ? 30 : e.type === 'zigzag' ? 20 : 10;
          updateHUD();
        }
        break;
      }
    }
  }
  state.bullets = state.bullets.filter(b => !b.dead);
  state.enemies = state.enemies.filter(e => e.hp > 0 && e.y < H + 40);

  // colisões: inimigo/tiro inimigo x jogador
  if (state.invuln === 0) {
    for (const e of state.enemies) {
      if (rectsHit(e, p)) { hitPlayer(); e.hp = 0; spawnParticles(e.x, e.y, '#ff5050', 18); break; }
    }
    for (const b of state.enemyBullets) {
      if (rectsHit(b, p)) { hitPlayer(); b.dead = true; break; }
    }
    state.enemyBullets = state.enemyBullets.filter(b => !b.dead);
  }

  for (const pt of state.particles) {
    pt.x += pt.vx;
    pt.y += pt.vy;
    pt.vx *= 0.96;
    pt.vy *= 0.96;
    pt.life--;
  }
  state.particles = state.particles.filter(pt => pt.life > 0);
}

function hitPlayer() {
  state.lives--;
  state.invuln = 90;
  spawnParticles(state.player.x, state.player.y, '#7fb6ff', 24);
  updateHUD();
  if (state.lives <= 0) gameOver();
}

function drawEnemy(e) {
  const a = ENEMY_ART[e.type];
  drawShipArt(ctx, a, e.x, e.y, e.w * a.esc, tick + e.t, true, e.flash > 0);
}

function render() {
  ctx.clearRect(0, 0, W, H);
  // estrelas
  for (const s of state.stars) {
    ctx.fillStyle = `rgba(255,255,255,${0.3 + s.r * 0.4})`;
    ctx.fillRect(s.x, s.y, s.r, s.r);
  }

  if (state.mode === 'playing' || state.mode === 'gameover') {
    // tiros jogador
    ctx.fillStyle = '#7ff0ff';
    for (const b of state.bullets) ctx.fillRect(b.x - b.w / 2, b.y - b.h / 2, b.w, b.h);
    // tiros inimigos
    ctx.fillStyle = '#ff80c0';
    for (const b of state.enemyBullets) ctx.fillRect(b.x - b.w / 2, b.y - b.h / 2, b.w, b.h);
    // inimigos
    for (const e of state.enemies) drawEnemy(e);
    // partículas
    for (const pt of state.particles) {
      ctx.fillStyle = pt.color;
      ctx.globalAlpha = Math.max(0, pt.life / 50);
      ctx.fillRect(pt.x, pt.y, 2, 2);
    }
    ctx.globalAlpha = 1;
    // jogador
    if (state.mode === 'playing') {
      const piscar = state.invuln > 0 && Math.floor(performance.now() / 80) % 2 === 0;
      if (!piscar) drawShipArt(ctx, state.ship, state.player.x, state.player.y, state.player.w * 1.5, tick);
    }
  }
}

let tick = 0;
function loop() {
  tick++;
  update();
  render();
  if (state.mode === 'menu') {
    previewCtx.clearRect(0, 0, 220, 220);
    // sombra no chão
    previewCtx.beginPath();
    previewCtx.ellipse(110, 190, 62, 14, 0, 0, Math.PI * 2);
    previewCtx.fillStyle = 'rgba(8,4,20,.55)';
    previewCtx.fill();
    // brilho atrás da nave
    const gl = previewCtx.createRadialGradient(110, 105, 6, 110, 105, 96);
    gl.addColorStop(0, nave().cor + '55');
    gl.addColorStop(1, 'transparent');
    previewCtx.fillStyle = gl;
    previewCtx.fillRect(0, 0, 220, 220);
    drawShipArt(previewCtx, nave(), 110, 105, 150, tick);
  }
  requestAnimationFrame(loop);
}

makeStars();
showMenu();
loop();
</script>
</body>
