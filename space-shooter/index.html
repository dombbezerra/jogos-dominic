<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#05060d" />
<title>Space Shooter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: #05060d;
    color: #e8e8f0;
    font-family: system-ui, -apple-system, sans-serif;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    overscroll-behavior: none;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    gap: 8px;
  }
  #back-link {
    position: fixed;
    top: calc(env(safe-area-inset-top) + 8px);
    left: calc(env(safe-area-inset-left) + 8px);
    background: rgba(26, 32, 80, 0.85);
    color: #8fb6ff;
    border: 1px solid #4050a0;
    padding: 6px 12px;
    font-size: 13px;
    text-decoration: none;
    border-radius: 6px;
    z-index: 20;
    backdrop-filter: blur(6px);
  }
  #game-wrap {
    position: relative;
    width: 100%;
    max-width: 800px;
    aspect-ratio: 4 / 3;
    max-height: calc(100vh - 80px);
  }
  #game {
    display: block;
    width: 100%;
    height: 100%;
    background: radial-gradient(ellipse at center, #0b1030 0%, #02030a 70%);
    border: 1px solid #222a55;
    box-shadow: 0 0 40px #1a2070;
    touch-action: none;
  }
  #preview, .ship-card canvas { display: block; margin: 0 auto; background: none; border: 0; }
  #hud {
    font-size: clamp(11px, 2.4vw, 14px);
    letter-spacing: 1px;
    opacity: 0.9;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 4px 12px;
    padding: 0 8px;
  }
  #hud span { white-space: nowrap; }
  #pauseBtn {
    background: #1a2050;
    color: #e8e8f0;
    border: 1px solid #4050a0;
    padding: 6px 14px;
    font-family: inherit;
    font-size: clamp(11px, 2.4vw, 13px);
    letter-spacing: 1px;
    cursor: pointer;
    border-radius: 4px;
    min-height: 36px;
  }
  #pauseBtn:hover { background: #2a3070; }
  #pauseBtn:disabled { opacity: 0.4; cursor: not-allowed; }
  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    padding: 16px;
  }
  #overlay .panel {
    background: rgba(5, 8, 20, 0.9);
    border: 1px solid #4050a0;
    padding: 20px 24px;
    text-align: center;
    border-radius: 8px;
    pointer-events: auto;
    max-width: 90%;
  }
  #overlay h1 { margin: 0 0 8px; font-size: clamp(22px, 5vw, 32px); color: #8fb6ff; }
  #overlay p { margin: 4px 0; font-size: clamp(13px, 2.5vw, 16px); }
  #overlay .start-btn {
    margin-top: 16px;
    background: #4050a0;
    color: white;
    border: none;
    padding: 14px 32px;
    font-family: inherit;
    font-size: 16px;
    letter-spacing: 2px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
  }
  #overlay .start-btn:hover { background: #5060c0; }
  .hidden { display: none !important; }

  /* ── Menu inicial ── */
  #menu, #naves {
    position: absolute;
    inset: 0;
    z-index: 12;
    display: flex;
    flex-direction: column;
    align-items: center;
    background: radial-gradient(ellipse at 50% 36%, #3d2670 0%, #1c1036 55%, #0c0718 100%);
    padding: 12px 16px 16px;
    overflow-y: auto;
  }
  .menu-title { text-align: center; line-height: .9; margin-top: 2%; }
  .menu-title .l1 {
    display: block;
    font-size: clamp(24px, 6.5vw, 50px);
    font-weight: 900; letter-spacing: 2px; color: #ffd42a;
    text-shadow: 0 4px 0 rgba(0,0,0,.5);
  }
  .menu-title .l2 {
    display: block;
    font-size: clamp(32px, 9.5vw, 72px);
    font-weight: 900; letter-spacing: 1px; color: #ff4fd8;
    text-shadow: 0 4px 0 rgba(0,0,0,.5);
  }
  #preview-wrap {
    flex: 1;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    width: 100%;
  }
  #preview {
    width: clamp(130px, 30vw, 200px);
    height: clamp(130px, 30vw, 200px);
    animation: float 3.2s ease-in-out infinite;
  }
  @keyframes float { 0%,100% { transform: translateY(-6px); } 50% { transform: translateY(6px); } }
  .ship-name { font-size: clamp(18px, 4.4vw, 28px); font-weight: 800; letter-spacing: 1px; margin-top: 2px; }
  .ship-desc { font-size: clamp(12px, 2.8vw, 16px); opacity: .6; margin-top: 3px; }
  .menu-btns {
    display: flex; gap: clamp(8px, 2vw, 14px);
    width: 100%; max-width: 620px;
  }
  .mbtn {
    flex: 1;
    border: 3px solid #14112a;
    border-radius: 4px;
    padding: clamp(11px, 2.4vw, 17px) 4px;
    font-family: inherit;
    font-weight: 900;
    font-size: clamp(13px, 3vw, 20px);
    letter-spacing: 1px;
    color: #14112a;
    cursor: pointer;
    box-shadow: 0 5px 0 rgba(0,0,0,.5);
  }
  .mbtn:active { transform: translateY(4px); box-shadow: 0 1px 0 rgba(0,0,0,.5); }
  .mbtn.naves { background: #5bc8f5; }
  .mbtn.play  { background: #22c55e; color: #fff; flex: 1.4; font-size: clamp(16px, 3.8vw, 26px); }

  /* ── Escolha de nave ── */
  .ship-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(clamp(112px, 22vw, 150px), 1fr));
    gap: 10px;
    width: 100%; max-width: 620px;
    margin-bottom: 14px;
  }
  .ship-card {
    background: rgba(255,255,255,.05);
    border: 2px solid #3b2f6e;
    border-radius: 8px;
    padding: 10px 6px 8px;
    text-align: center;
    cursor: pointer;
    transition: transform .12s, border-color .12s;
  }
  .ship-card:hover { transform: translateY(-3px); }
  .ship-card.on { border-color: #ffd42a; background: rgba(255,212,42,.13); }
  .ship-card canvas { width: clamp(58px, 12vw, 76px); height: clamp(58px, 12vw, 76px); }
  .ship-card .n { font-weight: 800; font-size: clamp(11px, 2.4vw, 14px); margin-top: 2px; }
  .ship-card .s { font-size: clamp(9px, 2vw, 11px); opacity: .55; margin-top: 2px; }

  /* Touch controls */
  #touch-ui {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 15;
    display: none;
  }
  #joystick {
    position: absolute;
    bottom: calc(env(safe-area-inset-bottom) + 24px);
    left: calc(env(safe-area-inset-left) + 24px);
    width: 130px;
    height: 130px;
    background: rgba(64, 80, 160, 0.18);
    border: 2px solid rgba(143, 182, 255, 0.4);
    border-radius: 50%;
    pointer-events: auto;
    touch-action: none;
  }
  #joystick-knob {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 56px;
    height: 56px;
    background: rgba(143, 182, 255, 0.6);
    border: 2px solid rgba(255, 255, 255, 0.5);
    border-radius: 50%;
    pointer-events: none;
    transition: background 0.1s;
  }
  #shoot-btn {
    position: absolute;
    bottom: calc(env(safe-area-inset-bottom) + 40px);
    right: calc(env(safe-area-inset-right) + 28px);
    width: 100px;
    height: 100px;
    background: rgba(255, 80, 100, 0.3);
    border: 3px solid rgba(255, 100, 120, 0.7);
    border-radius: 50%;
    color: white;
    font-size: 14px;
    font-weight: bold;
    letter-spacing: 1px;
    pointer-events: auto;
    touch-action: none;
    display: flex;
    align-items: center;
    justify-content: center;
    text-shadow: 0 1px 3px rgba(0,0,0,0.5);
  }
  #shoot-btn:active, #shoot-btn.active {
    background: rgba(255, 80, 100, 0.6);
    transform: scale(0.95);
  }
  body.touch #touch-ui { display: block; }
  @media (hover: none) and (pointer: coarse) {
    #touch-ui { display: block; }
  }

  /* ── Visual novo: letra de fliperama, bordas grossas e sombra dura (igual ao menu dos jogos) ── */
  :root { --tinta: #0c0718; --display: 'Bungee', 'Arial Black', Impact, sans-serif; --texto: 'Baloo 2', system-ui, sans-serif; }
  html, body, button { font-family: var(--texto); }
  body { background:
    radial-gradient(circle, rgba(255,255,255,0.06) 1.5px, transparent 1.6px) 0 0 / 22px 22px, #05060d; }
  #game { border: 3px solid var(--tinta); outline: 3px solid #8fb6ff; border-radius: 14px; box-shadow: 0 6px 0 var(--tinta), 0 0 40px #1a2070; }
  #menu, #naves { border-radius: 14px; }
  .menu-title .l1, .menu-title .l2 { font-family: var(--display); font-weight: 400; letter-spacing: 0;
    text-shadow: 3px 3px 0 var(--tinta), 6px 6px 0 rgba(12, 7, 24, 0.5); }
  .menu-title { transform: rotate(-2deg); }
  .ship-name { font-family: var(--display); font-weight: 400; letter-spacing: 0; }
  .ship-desc { font-weight: 600; opacity: .8; }
  .mbtn { font-family: var(--texto); font-weight: 800; letter-spacing: 0; border-color: var(--tinta); border-radius: 14px; box-shadow: 0 5px 0 var(--tinta); }
  .mbtn.play { font-family: var(--display); font-weight: 400; }
  .mbtn:active { box-shadow: 0 1px 0 var(--tinta); }
  .ship-card { border-width: 3px; border-radius: 14px; }
  .ship-card .n { font-size: clamp(13px, 2.6vw, 15px); }
  .ship-card .s { font-size: clamp(11px, 2.2vw, 12px); opacity: .75; font-weight: 600; }
  #overlay .panel { border: 3px solid var(--tinta); outline: 3px solid #8fb6ff; outline-offset: -8px; border-radius: 18px; box-shadow: 0 6px 0 var(--tinta); padding: 22px 26px; }
  #overlay h1 { font-family: var(--display); font-weight: 400; text-shadow: 3px 3px 0 var(--tinta); }
  #overlay .start-btn { font-weight: 800; letter-spacing: 0; border: 3px solid var(--tinta); border-radius: 14px; box-shadow: 0 5px 0 var(--tinta); }
  #hud { font-weight: 700; letter-spacing: 0; font-size: clamp(13px, 2.6vw, 16px); }
  #hud b { font-family: var(--display); font-weight: 400; color: #ffd42a; }
  #pauseBtn { font-weight: 800; letter-spacing: 0; border: 3px solid var(--tinta); border-radius: 12px; box-shadow: 0 4px 0 var(--tinta); background: #8fb6ff; color: var(--tinta); }
  #pauseBtn:hover { background: #a8c6ff; }
  #shoot-btn { font-family: var(--texto); font-weight: 800; }
  #back-link { font-weight: 800; font-size: 14px; background: #8fb6ff; color: var(--tinta); backdrop-filter: none;
    border: 3px solid var(--tinta); border-radius: 12px; box-shadow: 0 4px 0 var(--tinta); padding: 4px 12px 2px; }
  @media (max-width: 520px) {
    #game-wrap { width: calc(100% - 14px); }
    #preview { width: 96px; height: 96px; }
    .menu-title { margin-top: 0; }
    .mbtn { padding: 8px 4px 6px; }
  }
  @media (prefers-reduced-motion: reduce) { #preview { animation: none; } }

  /* ── Hangar, moedas e poderes ── */
  .menu-top { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; margin-top: 4px; font-weight: 800; font-size: clamp(13px, 2.6vw, 16px); }
  .menu-top b { font-family: var(--display); font-weight: 400; color: #ffd42a; }
  .stats { width: min(320px, 92%); margin: 8px auto 0; display: grid; grid-template-columns: auto 1fr; gap: 3px 8px; align-items: center; font-size: clamp(11px, 2.4vw, 13px); font-weight: 800; text-align: left; }
  .stats .bar { height: 9px; border-radius: 6px; background: rgba(255,255,255,.12); overflow: hidden; border: 2px solid var(--tinta); }
  .stats .bar i { display: block; height: 100%; border-radius: 4px; }
  .stats .esp { grid-column: 1 / -1; text-align: center; margin-top: 3px; color: #ffd42a; }
  .raridade { display: inline-block; font-size: clamp(10px, 2.2vw, 12px); font-weight: 800; padding: 1px 8px; border-radius: 8px; border: 2px solid var(--tinta); color: var(--tinta); margin-top: 3px; }
  .ship-card { position: relative; }
  .ship-card .preco { margin-top: 4px; font-weight: 800; font-size: clamp(11px, 2.4vw, 13px); }
  .ship-card.lock canvas { filter: brightness(.35) saturate(.4); }
  .ship-card.lock .preco { color: #ffd42a; }
  .ship-card.pode { border-color: #22c55e; }
  .ship-card.armado { border-color: #ffd42a; background: rgba(255,212,42,.2); }
  .naves-top { display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 620px; margin-bottom: 8px; font-weight: 800; }
  .naves-top b { font-family: var(--display); font-weight: 400; color: #ffd42a; }
  #navesMsg { min-height: 22px; text-align: center; font-weight: 800; color: #ffd42a; margin-bottom: 8px; }
  .mini { margin-top: 10px; background: rgba(255,255,255,.08); color: #e8e8f0; border: 2px solid #3b2f6e; border-radius: 12px; padding: 5px 12px 3px; font-family: var(--texto); font-weight: 800; font-size: clamp(12px, 2.6vw, 14px); cursor: pointer; }
  /* menu cabe na tela: a nave do meio encolhe quando a tela é baixinha */
  #preview-wrap { flex-direction: row; gap: clamp(8px, 3vw, 24px); }
  #preview { width: clamp(90px, 24vw, 180px) !important; height: clamp(90px, 24vw, 180px) !important; flex: none; }
  .info { text-align: center; min-width: 0; }
  .info .stats { width: clamp(180px, 34vw, 280px); }
  #menu .menu-title .l1 { font-size: clamp(20px, min(5.5vw, 5vh), 46px); }
  #menu .menu-title .l2 { font-size: clamp(26px, min(8vw, 7vh), 66px); }
  #preview-wrap { justify-content: center; padding: 4px 0; }
  .ship-name { font-size: clamp(16px, min(4vw, 3.6vh), 26px); }
  .ship-desc { margin-top: 1px; }
  /* celular em pé: a caixa do jogo é baixinha, então o menu fica enxuto */
  @media (max-width: 560px) {
    #menu, #naves { padding: 6px 10px 8px; }
    .info .stats, .ship-desc { display: none; }
    #preview { width: 64px !important; height: 64px !important; }
    #menu .menu-title .l1 { font-size: 18px; } #menu .menu-title .l2 { font-size: 28px; }
    .menu-top { margin-top: 2px; font-size: 12px; }
    #preview-wrap { padding: 0; }
    .mini { margin-top: 6px; padding: 3px 10px 1px; font-size: 12px; }
    .ship-grid { grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .ship-card { padding: 6px 2px 5px; }
    #navesMsg { font-size: 12px; min-height: 16px; }
  }
  #special-btn {
    position: absolute; bottom: calc(env(safe-area-inset-bottom) + 150px); right: calc(env(safe-area-inset-right) + 40px);
    width: 76px; height: 76px; border-radius: 50%; pointer-events: auto; touch-action: none;
    background: rgba(255, 212, 42, .18); border: 3px solid rgba(255, 212, 42, .5); color: #fff; font-size: 30px; opacity: .55;
  }
  #special-btn.cheio { opacity: 1; background: rgba(255, 212, 42, .55); animation: pisca 0.8s ease-in-out infinite alternate; }
  @keyframes pisca { to { box-shadow: 0 0 22px #ffd42a; } }
</style>
</head>
<body>
  <a href="../index.html" id="back-link" onclick="if(window!==window.top){event.preventDefault();window.parent.postMessage({type:'closeGame'},'*');}">← Menu</a>
  <div id="game-wrap">
    <canvas id="game" width="800" height="600" tabindex="0"></canvas>

    <div id="menu">
      <div class="menu-title"><span class="l1">SPACE</span><span class="l2">SHOOTER</span></div>
      <div class="menu-top"><span>🪙 <b id="mMoedas">0</b></span><span>🏆 RECORDE <b id="mRecorde">0</b></span></div>
      <div id="preview-wrap">
        <canvas id="preview" width="220" height="220"></canvas>
        <div class="info">
          <div class="ship-name" id="shipName">—</div>
          <div><span class="raridade" id="shipRar">—</span></div>
          <div class="ship-desc" id="shipDesc">—</div>
          <div class="stats" id="shipStats"></div>
        </div>
      </div>
      <div class="menu-btns">
        <button class="mbtn naves" id="btnNaves">NAVES</button>
        <button class="mbtn play" id="btnPlay">JOGAR</button>
      </div>
      <button class="mini" id="btnAuto">🔫 Tiro automático: NÃO</button>
    </div>

    <div id="naves" class="hidden">
      <div class="menu-title" style="margin: 6px 0 10px">
        <span class="l1" style="font-size: clamp(19px, 5vw, 34px)">HANGAR</span>
      </div>
      <div class="naves-top"><span id="navesQtd"></span><span>🪙 <b id="nMoedas">0</b></span></div>
      <div id="navesMsg">Toque numa nave pra ver. Toque de novo pra comprar ou usar.</div>
      <div class="ship-grid" id="shipGrid"></div>
      <div class="menu-btns">
        <button class="mbtn naves" id="btnVoltar">VOLTAR</button>
      </div>
    </div>

    <div id="overlay" class="hidden">
      <div class="panel" id="panel"></div>
    </div>
  </div>
  <div id="hud">
    <span>PONTOS: <b id="score">0</b></span>
    <span>🪙 <b id="coins">0</b></span>
    <span>VIDAS: <b id="lives">3</b></span>
    <span>NÍVEL: <b id="level">1</b></span>
    <button id="pauseBtn" disabled>PAUSAR</button>
  </div>
  <div id="touch-ui">
    <div id="joystick"><div id="joystick-knob"></div></div>
    <button id="special-btn" aria-label="Especial">⚡</button>
    <button id="shoot-btn">FOGO</button>
  </div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width;
const H = canvas.height;
const $ = id => document.getElementById(id);

const scoreEl = $('score'), livesEl = $('lives'), levelEl = $('level'), coinsEl = $('coins');
const overlay = $('overlay'), panel = $('panel'), pauseBtn = $('pauseBtn');

// ── Guardado neste aparelho (cada perfil tem o seu) ──
const PERFIL = new URLSearchParams(location.search).get('perfil');
const KEY = k => k + (PERFIL ? ':' + PERFIL : '');
const ler = (k, d) => { try { const v = JSON.parse(localStorage.getItem(KEY(k))); return v == null ? d : v; } catch (e) { return d; } };
const grava = (k, v) => { try { localStorage.setItem(KEY(k), JSON.stringify(v)); } catch (e) { /* sem espaço */ } };
// ADM (a conta do Dominic): todas as naves liberadas de graça
const isAdm = (() => { try { const m = JSON.parse(localStorage.getItem('aventuraConta' + (PERFIL ? ':' + PERFIL : ''))); return ['endrick', 'dominic'].includes(String(m && m.user && m.user.nome || '').trim().toLowerCase()); } catch (e) { return false; } })();
let banco = ler('ssMoedas', 0), recorde = ler('ssRecorde', 0);
let minhas = ler('ssNaves', ['veloz', 'metralha', 'tridente', 'tanque']);
let autoFire = ler('ssAuto', 'ontouchstart' in window || navigator.maxTouchPoints > 0);

const keys = {};
addEventListener('keydown', e => {
  keys[e.key.toLowerCase()] = true;
  if (e.key === 'Enter' && (state.mode === 'menu' || state.mode === 'gameover')) startGame();
  if ((e.key === 'p' || e.key === 'P' || e.key === 'Escape') && (state.mode === 'playing' || state.mode === 'paused')) togglePause();
  if (['e', 'q', 'shift', 'b'].includes(e.key.toLowerCase()) && state.mode === 'playing') usarEspecial();
  if ([' ', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) e.preventDefault();
});
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
canvas.addEventListener('click', () => { canvas.focus(); if (state.mode === 'paused') togglePause(); });
window.addEventListener('load', () => canvas.focus());

// ══════════════════════════════════════════════════════════════════
//  NAVES
// ══════════════════════════════════════════════════════════════════
const RARIDADES = {
  comum:    { nome: 'COMUM',    cor: '#b9c2d6' },
  rara:     { nome: 'RARA',     cor: '#5bc8f5' },
  epica:    { nome: 'ÉPICA',    cor: '#c46bff' },
  lendaria: { nome: 'LENDÁRIA', cor: '#ffb84a' },
  mitica:   { nome: 'MÍTICA',   cor: 'arco' },
};
const ESPECIAIS = {
  escudo: '🛡️ Escudo: nada te acerta',
  turbo:  '💨 Turbo: voa rápido e passa por tudo',
  furia:  '🔥 Fúria: atira o dobro',
  raio:   '⚡ Mega laser: um raio gigante',
  drones: '🤖 Drones: 2 ajudantes atirando',
  bomba:  '💣 Bomba: explode a tela toda',
  chuva:  '🚀 Chuva de mísseis',
  tempo:  '⏳ Câmera lenta nos inimigos',
  buraco: '🌀 Buraco negro: puxa e destrói',
};

// Desenha uma nave. flip = de cabeça para baixo (inimigos descendo).
function drawShipArt(g, sh, x, y, size, t, flip, branco) {
  const u = size / 44;
  const pts = FORMAS[sh.forma];
  g.save();
  g.translate(x, y);
  if (flip) g.scale(1, -1);
  // fogo do motor
  const fl = (7 + Math.sin(t * .35) * 3) * u;
  const gf = g.createLinearGradient(0, 11 * u, 0, 11 * u + fl);
  gf.addColorStop(0, 'rgba(255,220,120,.95)');
  gf.addColorStop(1, 'rgba(255,90,40,0)');
  g.fillStyle = gf;
  g.beginPath();
  g.moveTo(-4.5 * u, 11 * u); g.lineTo(0, 11 * u + fl); g.lineTo(4.5 * u, 11 * u);
  g.closePath(); g.fill();
  // casco
  g.beginPath();
  pts.forEach(([px, py], i) => i ? g.lineTo(px * u, py * u) : g.moveTo(px * u, py * u));
  g.closePath();
  if (branco) g.fillStyle = '#ffffff';
  else if (sh.arco) {   // nave arco-íris: as cores vão girando
    const gg = g.createLinearGradient(-20 * u, -20 * u, 20 * u, 15 * u);
    for (let i = 0; i <= 5; i++) gg.addColorStop(i / 5, `hsl(${(t * 3 + i * 60) % 360} 90% 62%)`);
    g.fillStyle = gg;
  } else {
    const gg = g.createLinearGradient(0, -20 * u, 0, 15 * u);
    gg.addColorStop(0, sh.ac); gg.addColorStop(.45, sh.cor); gg.addColorStop(1, '#1b1636');
    g.fillStyle = gg;
  }
  g.fill();
  g.strokeStyle = '#0d0a1e'; g.lineWidth = 2.2 * u; g.lineJoin = 'round'; g.stroke();
  // cabine
  g.beginPath();
  g.ellipse(0, -6 * u, 3.4 * u, 5.4 * u, 0, 0, Math.PI * 2);
  g.fillStyle = '#0d1030'; g.fill();
  g.strokeStyle = sh.ac; g.lineWidth = 1.4 * u; g.stroke();
  g.beginPath();
  g.ellipse(-1.1 * u, -7.6 * u, 1.2 * u, 2 * u, -.4, 0, Math.PI * 2);
  g.fillStyle = 'rgba(255,255,255,.65)'; g.fill();
  g.restore();
}

const joystick = $('joystick'), knob = $('joystick-knob'), shootBtn = $('shoot-btn'), specialBtn = $('special-btn');
let joyTouchId = null;
const JOY_RADIUS = 50, DEAD_ZONE = 0.18;
const joy = { x: 0, y: 0 };
function setJoy(dx, dy) {
  const mag = Math.hypot(dx, dy);
  if (mag < DEAD_ZONE) { joy.x = joy.y = 0; return; }
  const k = Math.min(1, mag) / mag;
  joy.x = dx * k; joy.y = dy * k;
}
function updateKnob(dx, dy) {
  const mag = Math.hypot(dx, dy);
  if (mag > JOY_RADIUS) { dx = dx * JOY_RADIUS / mag; dy = dy * JOY_RADIUS / mag; }
  knob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
}
function joyMove(t) {
  const r = joystick.getBoundingClientRect();
  const dx = t.clientX - (r.left + r.width / 2), dy = t.clientY - (r.top + r.height / 2);
  updateKnob(dx, dy);
  setJoy(dx / JOY_RADIUS, dy / JOY_RADIUS);
}
joystick.addEventListener('touchstart', e => { e.preventDefault(); if (joyTouchId !== null) return; const t = e.changedTouches[0]; joyTouchId = t.identifier; joyMove(t); }, { passive: false });
joystick.addEventListener('touchmove', e => { e.preventDefault(); for (const t of e.changedTouches) if (t.identifier === joyTouchId) joyMove(t); }, { passive: false });
function endJoy(e) { for (const t of e.changedTouches) if (t.identifier === joyTouchId) { joyTouchId = null; knob.style.transform = 'translate(-50%, -50%)'; joy.x = joy.y = 0; } }
joystick.addEventListener('touchend', endJoy, { passive: false });
joystick.addEventListener('touchcancel', endJoy, { passive: false });

let ac = null, somT = {};
function som(tipo) {
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const agora = ac.currentTime;
    if (somT[tipo] && agora - somT[tipo] < ({ tiro: 0.07, acerto: 0.04, moeda: 0.05 }[tipo] || 0)) return;
    somT[tipo] = agora;
    const nota = (f, d, tp = 'square', v = 0.05, f2 = null, atraso = 0) => {
      const o = ac.createOscillator(), g = ac.createGain(), t = agora + atraso;
      o.type = tp; o.frequency.setValueAtTime(f, t);
      if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
      g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0008, t + d);
      o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + d + 0.02);
    };
    const ruido = (d, v = 0.12) => {
      const n = ac.createBufferSource(), b = ac.createBuffer(1, ac.sampleRate * d, ac.sampleRate), c = b.getChannelData(0);
      for (let i = 0; i < c.length; i++) c[i] = (Math.random() * 2 - 1) * (1 - i / c.length);
      const g = ac.createGain(); g.gain.value = v; n.buffer = b; n.connect(g); g.connect(ac.destination); n.start();
    };
    if (tipo === 'tiro') nota(880, 0.06, 'square', 0.02, 440);
    else if (tipo === 'acerto') nota(300, 0.05, 'square', 0.025, 160);
    else if (tipo === 'explode') { ruido(0.25, 0.1); nota(140, 0.25, 'sawtooth', 0.04, 40); }
    else if (tipo === 'grande') { ruido(0.7, 0.18); nota(90, 0.7, 'sawtooth', 0.06, 25); }
    else if (tipo === 'moeda') { nota(1320, 0.06, 'triangle', 0.05); nota(1760, 0.08, 'triangle', 0.05, null, 0.05); }

}
function spawnEnemy(tipo) {

}

function atualizaChefe(b, vel) {
  b.t += vel;

  b.x = W / 2 + Math.sin(b.t / 90) * (W / 2 - 110);

  const T = Math.floor(b.t);
  const cada = (n) => T % n === 0 && Math.floor(b.t - vel) !== T;
  // leque pra baixo
  if (cada(fase === 2 ? 50 : 70)) { const qtd = 7 + fase * 2; for (let i = 0; i < qtd; i++) { const a = Math.PI / 2 + (i - (qtd - 1) / 2) * 0.17; tiroInimigo(b.x, b.y + 40, Math.cos(a) * 3.2, Math.sin(a) * 3.2, b.cor, 6); } }

}

    case 'laser': for (let i = 0; i < P; i++) bala(x + (i - (P - 1) / 2) * 12, y, 0, -14, { w: 4, h: 34, pierce: 3, tipo: 'laser', cor: sh.cor }); break;
    case 'laser2': for (let i = 0; i < P + 1; i++) bala(x + (i - P / 2) * 14, y, 0, -14, { w: 4, h: 34, pierce: 3, tipo: 'laser', cor: sh.cor }); break;

    case 'plasma': for (let i = 0; i < P; i++) bala(x + (i - (P - 1) / 2) * 22, y, 0, -6, { w: 18, h: 18, dano: 4, pierce: 1, tipo: 'plasma', cor: sh.cor }); break;

function solta(x, y, tipo) { state.pickups.push({ x, y, vx: (Math.random() - 0.5) * 2, vy: -1.5 - Math.random(), tipo, t: 0 }); }
const ICONES = { moeda: '🪙', arma: '⬆️', escudo: '🛡️', vida: '❤️', ima: '🧲', carga: '⚡' };

      return;
    }
    gameOver();
  }
}

// ══════════════════════════════════════════════════════════════════
//  UPDATE
// ══════════════════════════════════════════════════════════════════
function update() {
  for (const s of state.stars) { s.y += s.v * (state.turbo > 0 ? 3 : 1); if (s.y > H) { s.y = 0; s.x = Math.random() * W; } }
  nebY = (nebY + 0.25) % H;
  if (state.mode !== 'playing') return;
  if (!state.proxNivel) state.proxNivel = 18;
  const p = state.player, sh = state.ship;
  const vel = state.tempo > 0 ? 0.4 : 1;   // câmera lenta nos inimigos

  // mexer
  let mx = (keys['arrowright'] || keys['d'] ? 1 : 0) - (keys['arrowleft'] || keys['a'] ? 1 : 0);
  let my = (keys['arrowdown'] || keys['s'] ? 1 : 0) - (keys['arrowup'] || keys['w'] ? 1 : 0);
  if (joy.x || joy.y) { mx = joy.x; my = joy.y; }
  const l = Math.hypot(mx, my); if (l > 1) { mx /= l; my /= l; }
  const sp = p.speed * (state.turbo > 0 ? 1.8 : 1);
  p.x = Math.max(16, Math.min(W - 16, p.x + mx * sp));
  p.y = Math.max(20, Math.min(H - 20, p.y + my * sp));
  p.trail.push({ x: p.x, y: p.y + 14 }); if (p.trail.length > 12) p.trail.shift();

  // atirar
  if (state.shootCooldown > 0) state.shootCooldown--;
  if ((keys[' '] || keys['x'] || autoFire) && state.shootCooldown <= 0) {
    state.tiros++;
    atira(sh.tiro, p);
    if (sh.extra && state.tiros % 3 === 0) atira(sh.extra, p);
    state.shootCooldown = Math.max(3, Math.round(sh.cd * (state.furia > 0 ? 0.5 : 1)));
    som('tiro');
  }
  // contadores
  for (const k of ['invuln', 'escudo', 'turbo', 'furia', 'tempo', 'ima', 'flash']) if (state[k] > 0) state[k]--;
  if (state.shake > 0) state.shake *= 0.85;
  if (state.comboT > 0 && --state.comboT === 0) state.combo = 0;
  state.carga = Math.min(100, state.carga + 0.07);
  if (state.banner && state.banner.t > 0) state.banner.t--;

  // drones
  for (const d of state.drones) {
    d.t--; d.a += 0.05;
    d.x = p.x + Math.cos(d.a) * 46; d.y = p.y + Math.sin(d.a) * 26;
    if (d.t % 12 === 0) bala(d.x, d.y - 8, 0, -10, { cor: '#7ff0ff' });
  }
  state.drones = state.drones.filter(d => d.t > 0);

  // aparecer inimigos (com chefão, menos)
  state.spawnTimer -= vel;
  if (state.spawnTimer <= 0) {
    if (!state.boss) {
      spawnEnemy();
      if (state.level >= 3 && Math.random() < 0.25) {   // às vezes vem uma fila
        const tipo = Math.random() < 0.5 ? 'grunt' : 'zigzag', x0 = 60 + Math.random() * (W - 120);
        for (let i = 1; i < 4; i++) { const e = spawnEnemy(tipo); e.x = x0; e.y = -30 - i * 36; }
      }
    }
    state.spawnTimer = state.boss ? 9999 : Math.max(22, 68 - state.level * 4);
  }

  // tiros do jogador
  const alvos = () => [...state.enemies.filter(e => e.hp > 0), ...(state.boss ? [state.boss] : [])];
  for (const b of state.bullets) {
    b.t++;
    if (b.tipo === 'missil') {   // persegue o inimigo mais perto
      let alvo = null, md = 1e9;
      for (const e of alvos()) { const d = Math.hypot(e.x - b.x, e.y - b.y); if (d < md) { md = d; alvo = e; } }
      const v = Math.min(9, Math.hypot(b.vx, b.vy) + 0.25);
      let a = Math.atan2(b.vy, b.vx);
      if (alvo) { const want = Math.atan2(alvo.y - b.y, alvo.x - b.x); let da = want - a; while (da > Math.PI) da -= Math.PI * 2; while (da < -Math.PI) da += Math.PI * 2; a += Math.max(-0.12, Math.min(0.12, da)); }
      b.vx = Math.cos(a) * v; b.vy = Math.sin(a) * v;
      if (b.t % 2 === 0) state.particles.push({ x: b.x, y: b.y, vx: 0, vy: 0, life: 14, color: '#ffb04a', r: 2 });
    }
    if (b.tipo === 'onda') { b.y += b.vy; b.x = b.x0 + Math.sin(b.t * 0.25 + b.fase) * 26; continue; }
    if (b.tipo === 'prisma' && b.t === 22) {   // se divide em três
      b.dead = true;
      for (const da of [-0.35, 0, 0.35]) { const a = Math.atan2(b.vy, b.vx) + da; bala(b.x, b.y, Math.cos(a) * 9, Math.sin(a) * 9, { w: 6, h: 6, tipo: 'bola', cor: '#ffffff' }); }
    }
    b.x += b.vx; b.y += b.vy;
  }
  state.bullets = state.bullets.filter(b => !b.dead && b.y > -40 && b.y < H + 120 && b.x > -40 && b.x < W + 40 && b.t < 240);

  // tiros inimigos
  for (const b of state.enemyBullets) {
    if (state.buraco) { const dx = state.buraco.x - b.x, dy = state.buraco.y - b.y, d = Math.hypot(dx, dy) || 1; b.vx += dx / d * 0.3; b.vy += dy / d * 0.3; if (d < 30) b.dead = true; }
    b.x += b.vx * vel; b.y += b.vy * vel;
  }
  state.enemyBullets = state.enemyBullets.filter(b => !b.dead && b.y < H + 20 && b.y > -40 && b.x > -20 && b.x < W + 20);

  // inimigos
  for (const e of state.enemies) {
    e.t += vel;
    if (e.flash > 0) e.flash--;
    if (state.buraco) { const dx = state.buraco.x - e.x, dy = state.buraco.y - e.y, d = Math.hypot(dx, dy) || 1; e.x += dx / d * 2.4; e.y += dy / d * 2.4; }
    if (e.type === 'kamikaze') {
      if (!e.mergulho && e.y > 90 + (e.t % 60)) { e.mergulho = true; const [vx, vy] = mira(e, 5.5 + state.level * 0.1); e.vx = vx; e.vy = vy; }
      e.x += e.vx * vel; e.y += e.vy * vel; continue;
    }
    if (e.type === 'sniper') {
      if (e.parada === -999) { e.y += e.vy * vel; continue; }   // já atirou: vai embora
      if (e.y < e.parada) e.y += e.vy * vel;
      else {
        e.shootTimer -= vel;
        if (e.shootTimer < 50 && !e.alvo) e.alvo = { x: state.player.x, y: state.player.y };   // aviso: linha vermelha
        if (e.shootTimer <= 0) {
          const dx = e.alvo.x - e.x, dy = e.alvo.y - e.y, d = Math.hypot(dx, dy) || 1;
          tiroInimigo(e.x, e.y + 14, dx / d * 8, dy / d * 8, '#3fe0d0', 5);
          e.alvo = null; e.tiros++; e.shootTimer = 110;
          if (e.tiros >= 3) { e.vy = -2.5; e.parada = -999; }
        }
      }
      continue;
    }
    e.y += e.vy * vel;
    if (e.type === 'zigzag' || e.type === 'asteroide') { e.x += e.vx * vel; if (e.x < 20 || e.x > W - 20) e.vx *= -1; }
    if (e.type === 'asteroide') e.rot += e.vr * vel;
    if (e.type === 'shooter' || e.type === 'tanque') {
      e.shootTimer -= vel;
      if (e.shootTimer <= 0 && e.y > 0) {
        if (e.type === 'shooter') { const [vx, vy] = mira(e, 3.4 + state.level * 0.06); tiroInimigo(e.x, e.y + 12, vx, vy); e.shootTimer = 90 + Math.random() * 60; }
        else { for (let i = -2; i <= 2; i++) tiroInimigo(e.x, e.y + 20, i * 0.9, 3, '#b4ff8a', 5); e.shootTimer = 100; }
      }
    }
  }
  if (state.boss) atualizaChefe(state.boss, vel);

  // buraco negro
  if (state.buraco) {
    const bn = state.buraco; bn.t--;
    if (bn.t % 8 === 0) for (const e of alvos()) if (Math.hypot(e.x - bn.x, e.y - bn.y) < 110) fere(e, e === state.boss ? 2 : 1);
    if (bn.t <= 0) state.buraco = null;
  }
  // mega laser
  if (state.megaLaser > 0) {
    state.megaLaser--;
    state.shake = Math.max(state.shake, 3);
    if (state.megaLaser % 5 === 0) for (const e of alvos()) if (Math.abs(e.x - p.x) < 34 + e.w / 2 && e.y < p.y) fere(e, e === state.boss ? 2 : 2);
    state.enemyBullets = state.enemyBullets.filter(b => !(Math.abs(b.x - p.x) < 34 && b.y < p.y));
  }

  // colisões: tiro do jogador x inimigo
  for (const b of state.bullets) {
    if (b.dead) continue;
    for (const e of alvos()) {
      if (b.ja && b.ja.includes(e)) continue;
      if (rectsHit(b, e)) {
        fere(e, b.dano);
        explosao(b.x, b.y, b.cor, 3);
        if (b.pierce > 0) { b.pierce--; (b.ja = b.ja || []).push(e); }
        else { b.dead = true; break; }
      }
    }
  }
  state.bullets = state.bullets.filter(b => !b.dead);
  state.enemies = state.enemies.filter(e => e.hp > 0 && e.y < H + 60 && e.y > -400 && e.x > -60 && e.x < W + 60);

  // colisões: inimigo/tiro inimigo x jogador (a caixa do jogador é menor que o desenho)
  const corpo = { x: p.x, y: p.y, w: 16, h: 18 };
  if (state.invuln === 0 || state.escudo > 0) {
    for (const e of state.enemies) {
      if (rectsHit(e, state.escudo > 0 ? { x: p.x, y: p.y, w: 50, h: 50 } : corpo)) { fere(e, 99); if (state.escudo <= 0) { hitPlayer(); break; } }
    }
    if (state.boss && rectsHit(state.boss, corpo) && state.invuln === 0) hitPlayer();
    for (const b of state.enemyBullets) {
      if (state.escudo > 0 && Math.hypot(b.x - p.x, b.y - p.y) < 34) { b.dead = true; continue; }
      if (state.invuln === 0 && rectsHit(b, corpo)) { hitPlayer(); b.dead = true; break; }
    }
    state.enemyBullets = state.enemyBullets.filter(b => !b.dead);
  }

  // coisas que caem
  for (const k of state.pickups) {
    k.t++;
    const dx = p.x - k.x, dy = p.y - k.y, d = Math.hypot(dx, dy) || 1;
    const puxa = k.tipo === 'moeda' && (state.ima > 0 || d < 70);
    if (puxa) { k.vx = dx / d * 7; k.vy = dy / d * 7; } else { k.vy = Math.min(2.2, k.vy + 0.06); k.vx *= 0.97; }
    k.x += k.vx; k.y += k.vy;
    if (d < 26) { k.dead = true; pega(k); }
  }
  state.pickups = state.pickups.filter(k => !k.dead && k.y < H + 30);

  for (const pt of state.particles) { pt.x += pt.vx; pt.y += pt.vy; pt.vx *= 0.95; pt.vy *= 0.95; pt.life--; }
  state.particles = state.particles.filter(pt => pt.life > 0);
  if (state.particles.length > 700) state.particles.splice(0, state.particles.length - 700);
  for (const o of state.ondas) { o.r += 4; o.t--; }
  state.ondas = state.ondas.filter(o => o.t > 0);
  for (const t of state.textos) { t.y -= 0.8; t.t--; }
  state.textos = state.textos.filter(t => t.t > 0);
  for (const r of state.raios) r.t--;
  state.raios = state.raios.filter(r => r.t > 0);

  // botão de especial no celular
  const cheio = state.carga >= 100;
  if (specialBtn.classList.contains('cheio') !== cheio) specialBtn.classList.toggle('cheio', cheio);
}

// ══════════════════════════════════════════════════════════════════
//  DESENHO
// ══════════════════════════════════════════════════════════════════
function drawAsteroide(e) {
  ctx.save(); ctx.translate(e.x, e.y); ctx.rotate(e.rot);
  const r = e.w / 2;
  ctx.beginPath();
  e.forma.forEach((k, i) => { const a = i / e.forma.length * Math.PI * 2; const fn = i ? 'lineTo' : 'moveTo'; ctx[fn](Math.cos(a) * r * k, Math.sin(a) * r * k); });
  ctx.closePath();
  ctx.fillStyle = e.flash > 0 ? '#fff' : '#8a7560'; ctx.fill();
  ctx.strokeStyle = '#2a2018'; ctx.lineWidth = 3; ctx.stroke();
  ctx.fillStyle = 'rgba(0,0,0,.25)';
  ctx.beginPath(); ctx.arc(-r * 0.25, -r * 0.2, r * 0.22, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(r * 0.3, r * 0.25, r * 0.15, 0, 7); ctx.fill();
  ctx.restore();
}
function barrinhaVida(e) {
  if (e.maxHp <= 2 || e.hp >= e.maxHp) return;
  const w = e.w;
  ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(e.x - w / 2, e.y - e.h / 2 - 10, w, 5);
  ctx.fillStyle = '#5df07a'; ctx.fillRect(e.x - w / 2, e.y - e.h / 2 - 10, w * Math.max(0, e.hp / e.maxHp), 5);
}
function drawEnemy(e) {
  if (e.type === 'asteroide') { drawAsteroide(e); barrinhaVida(e); return; }
  const a = ENEMY_ART[e.type];
  if (e.type === 'sniper' && e.alvo) {   // linha de aviso
    ctx.save(); ctx.strokeStyle = `rgba(255,60,60,${0.3 + 0.4 * Math.sin(tick * 0.5)})`; ctx.lineWidth = 2; ctx.setLineDash([8, 6]);
    ctx.beginPath(); ctx.moveTo(e.x, e.y); ctx.lineTo(e.alvo.x, e.alvo.y); ctx.stroke(); ctx.restore();
  }
  const ang = e.type === 'kamikaze' && e.mergulho ? Math.atan2(e.vy, e.vx) - Math.PI / 2 : 0;
  if (ang) { ctx.save(); ctx.translate(e.x, e.y); ctx.rotate(ang); drawShipArt(ctx, a, 0, 0, e.w * a.esc, tick + e.t, true, e.flash > 0); ctx.restore(); }
  else drawShipArt(ctx, a, e.x, e.y, e.w * a.esc, tick + e.t, true, e.flash > 0);
  barrinhaVida(e);
}
function drawChefe(b) {
  const a = Object.assign({}, ENEMY_ART.chefe, { cor: b.cor });
  ctx.save();
  const gl = ctx.createRadialGradient(b.x, b.y, 10, b.x, b.y, 140);
  gl.addColorStop(0, b.cor + '66'); gl.addColorStop(1, 'transparent');
  ctx.fillStyle = gl; ctx.fillRect(b.x - 140, b.y - 140, 280, 280);
  ctx.restore();
  drawShipArt(ctx, a, b.x, b.y, 150, tick, true, b.flash > 0);
  // olho brilhante
  ctx.beginPath(); ctx.arc(b.x, b.y + 6, 12 + Math.sin(tick * 0.2) * 2, 0, 7);
  ctx.fillStyle = '#ff3b3b'; ctx.fill(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.stroke();
}
function render() {
  ctx.save();
  ctx.clearRect(0, 0, W, H);
  if (state.shake > 0.5) ctx.translate((Math.random() - 0.5) * state.shake, (Math.random() - 0.5) * state.shake);
  // fundo: nebulosas e estrelas
  ctx.drawImage(nebula, 0, nebY - H, W, H * 2);
  ctx.drawImage(nebula, 0, nebY - H * 3, W, H * 2);
  for (const s of state.stars) {
    ctx.fillStyle = `rgba(255,255,255,${0.25 + s.r * 0.35})`;
    if (state.turbo > 0) ctx.fillRect(s.x, s.y, s.r, s.r * 8); else ctx.fillRect(s.x, s.y, s.r, s.r);
  }
  if (state.tempo > 0) { ctx.fillStyle = 'rgba(80,140,255,.08)'; ctx.fillRect(0, 0, W, H); }

  if (state.mode === 'playing' || state.mode === 'gameover' || state.mode === 'paused') {
    const p = state.player;
    // buraco negro
    if (state.buraco) {
      const bn = state.buraco;
      const g = ctx.createRadialGradient(bn.x, bn.y, 4, bn.x, bn.y, 120);
      g.addColorStop(0, '#000'); g.addColorStop(0.3, '#2a0a4a'); g.addColorStop(0.6, 'rgba(176,108,255,.4)'); g.addColorStop(1, 'transparent');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(bn.x, bn.y, 120, 0, 7); ctx.fill();
      ctx.strokeStyle = '#b06cff'; ctx.lineWidth = 3;
      for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.arc(bn.x, bn.y, 30 + i * 22 + (tick * 2 % 22), tick * 0.1 + i, tick * 0.1 + i + 3); ctx.stroke(); }
    }
    // coisas que caem
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (const k of state.pickups) {
      const s = k.tipo === 'moeda' ? 18 : 26;
      if (k.tipo !== 'moeda') { ctx.fillStyle = 'rgba(127,240,255,.25)'; ctx.beginPath(); ctx.arc(k.x, k.y, 18 + Math.sin(k.t * 0.2) * 3, 0, 7); ctx.fill(); }
      ctx.font = s + 'px sans-serif';
      ctx.fillText(ICONES[k.tipo], k.x, k.y + Math.sin(k.t * 0.15) * 2);
    }
    // inimigos e chefão
    for (const e of state.enemies) drawEnemy(e);
    if (state.boss) drawChefe(state.boss);
    // tiros (brilhando)
    ctx.globalCompositeOperation = 'lighter';
    for (const b of state.bullets) {
      ctx.fillStyle = b.cor;
      if (b.tipo === 'laser') { ctx.globalAlpha = 0.35; ctx.fillRect(b.x - 5, b.y - b.h / 2, 10, b.h); ctx.globalAlpha = 1; ctx.fillRect(b.x - 2, b.y - b.h / 2, 4, b.h); }
      else if (b.tipo === 'plasma') { ctx.globalAlpha = 0.4; ctx.beginPath(); ctx.arc(b.x, b.y, 14, 0, 7); ctx.fill(); ctx.globalAlpha = 1; ctx.beginPath(); ctx.arc(b.x, b.y, 8, 0, 7); ctx.fill(); }
      else if (b.tipo === 'missil') { ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(Math.atan2(b.vy, b.vx) + Math.PI / 2); ctx.fillStyle = '#fff'; ctx.fillRect(-3, -7, 6, 12); ctx.fillStyle = b.cor; ctx.fillRect(-3, 3, 6, 4); ctx.restore(); }
      else if (b.tipo === 'normal') { ctx.globalAlpha = 0.35; ctx.fillRect(b.x - 4, b.y - b.h / 2 - 2, 8, b.h + 4); ctx.globalAlpha = 1; ctx.fillRect(b.x - 2, b.y - b.h / 2, 4, b.h); }
      else { ctx.globalAlpha = 0.4; ctx.beginPath(); ctx.arc(b.x, b.y, b.w, 0, 7); ctx.fill(); ctx.globalAlpha = 1; ctx.beginPath(); ctx.arc(b.x, b.y, b.w / 2, 0, 7); ctx.fill(); }
    }
    for (const b of state.enemyBullets) {
      ctx.fillStyle = b.cor; ctx.globalAlpha = 0.35; ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 2, 0, 7); ctx.fill();
      ctx.globalAlpha = 1; ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 0.7, 0, 7); ctx.fill();
      ctx.strokeStyle = b.cor; ctx.lineWidth = 2; ctx.stroke();
    }
    // raios (corrente)
    for (const r of state.raios) {
      ctx.strokeStyle = '#ffe94a'; ctx.lineWidth = 3; ctx.globalAlpha = r.t / 8;
      ctx.beginPath(); ctx.moveTo(r.x1, r.y1);
      for (let i = 1; i < 6; i++) ctx.lineTo(r.x1 + (r.x2 - r.x1) * i / 6 + (Math.random() - 0.5) * 16, r.y1 + (r.y2 - r.y1) * i / 6 + (Math.random() - 0.5) * 16);
      ctx.lineTo(r.x2, r.y2); ctx.stroke(); ctx.globalAlpha = 1;
    }
    // partículas e ondas de explosão
    for (const pt of state.particles) { ctx.fillStyle = pt.color; ctx.globalAlpha = Math.max(0, pt.life / 50); ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.r || 2, 0, 7); ctx.fill(); }
    for (const o of state.ondas) { ctx.strokeStyle = o.cor; ctx.globalAlpha = o.t / 20; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(o.x, o.y, o.r, 0, 7); ctx.stroke(); }
    ctx.globalAlpha = 1;
    // mega laser
    if (state.megaLaser > 0) {
      const w = 30 + Math.sin(tick * 0.6) * 8;
      const g = ctx.createLinearGradient(p.x - w, 0, p.x + w, 0);
      g.addColorStop(0, 'transparent'); g.addColorStop(0.3, state.ship.cor); g.addColorStop(0.5, '#ffffff'); g.addColorStop(0.7, state.ship.cor); g.addColorStop(1, 'transparent');
      ctx.fillStyle = g; ctx.fillRect(p.x - w, 0, w * 2, p.y - 16);
    }
    ctx.globalCompositeOperation = 'source-over';

    // jogador
    if (state.mode !== 'gameover') {
      if (state.turbo > 0) for (let i = 0; i < p.trail.length; i++) { const t = p.trail[i]; ctx.globalAlpha = i / p.trail.length * 0.5; drawShipArt(ctx, state.ship, t.x, t.y - 14, 45, tick); }
      ctx.globalAlpha = 1;
      const piscar = state.invuln > 0 && state.escudo <= 0 && state.turbo <= 0 && Math.floor(performance.now() / 80) % 2 === 0;
      if (!piscar) drawShipArt(ctx, state.ship, p.x, p.y, 46, tick);
      for (const d of state.drones) drawShipArt(ctx, { forma: 'dardo', cor: '#7ff0ff', ac: '#ffffff' }, d.x, d.y, 22, tick);
      if (state.escudo > 0) {
        ctx.strokeStyle = `rgba(127,240,255,${state.escudo < 90 && tick % 10 < 5 ? 0.2 : 0.8})`; ctx.lineWidth = 3;
        ctx.fillStyle = 'rgba(127,240,255,.12)';
        ctx.beginPath(); ctx.arc(p.x, p.y, 32 + Math.sin(tick * 0.2) * 2, 0, 7); ctx.fill(); ctx.stroke();
      }
    }
    // textinhos (+pontos)
    for (const t of state.textos) {
      ctx.globalAlpha = Math.min(1, t.t / 20);
      ctx.font = (t.grande ? '800 22px ' : '800 15px ') + "'Baloo 2', sans-serif";
      ctx.lineWidth = 4; ctx.strokeStyle = '#0c0718'; ctx.strokeText(t.txt, t.x, t.y);
      ctx.fillStyle = t.cor; ctx.fillText(t.txt, t.x, t.y);
    }
    ctx.globalAlpha = 1;
    desenhaHud();
  }
  ctx.restore();
  if (state.flash > 0) { ctx.fillStyle = `rgba(255,255,255,${state.flash / 16})`; ctx.fillRect(0, 0, W, H); }
}
function desenhaHud() {
  const p = state.player;
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  // barra do especial
  const bx = 14, by = H - 26, bw = 190;
  ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(bx - 3, by - 3, bw + 6, 16);
  const cheio = state.carga >= 100;
  ctx.fillStyle = cheio ? `hsl(${45 + Math.sin(tick * 0.2) * 10} 100% 60%)` : '#c9a21a';
  ctx.fillRect(bx, by, bw * state.carga / 100, 10);
  ctx.font = "800 14px 'Baloo 2', sans-serif";
  ctx.fillStyle = '#fff'; ctx.lineWidth = 3; ctx.strokeStyle = '#0c0718';
  const txtEsp = cheio ? (document.body.classList.contains('touch') ? '⚡ ESPECIAL PRONTO! Toque no ⚡' : '⚡ ESPECIAL PRONTO! Aperte E') : '⚡ ESPECIAL';
  ctx.strokeText(txtEsp, bx, by - 7); ctx.fillText(txtEsp, bx, by - 7);
  // força da arma
  ctx.textAlign = 'right';
  const txtArma = 'ARMA ' + '▮'.repeat(state.poder) + '▯'.repeat(3 - state.poder);
  ctx.strokeText(txtArma, W - 14, H - 14); ctx.fillText(txtArma, W - 14, H - 14);
  // vidas
  ctx.font = '18px sans-serif';
  const vy = state.boss ? 62 : 28;   // com chefão, desce pra não ficar em cima da barra dele
  if (state.lives <= 5) ctx.fillText('❤️'.repeat(state.lives), W - 12, vy);
  else { ctx.fillText('❤️', W - 44, vy); ctx.font = "800 18px 'Baloo 2', sans-serif"; ctx.strokeText('×' + state.lives, W - 12, vy); ctx.fillText('×' + state.lives, W - 12, vy); }
  // combo
  ctx.textAlign = 'left';
  if (state.combo >= 3) {
    ctx.font = "800 20px 'Baloo 2', sans-serif";
    const mult = Math.min(8, 1 + Math.floor(state.combo / 5));
    const t = 'COMBO ' + state.combo + (mult > 1 ? '  x' + mult : '');
    ctx.fillStyle = '#ffd42a'; ctx.strokeText(t, 14, 30); ctx.fillText(t, 14, 30);
  }
  // poderes ligados
  const on = [['🛡️', state.escudo], ['🔥', state.furia], ['⏳', state.tempo], ['🧲', state.ima], ['💨', state.turbo]].filter(x => x[1] > 0);
  ctx.font = '18px sans-serif';
  on.forEach(([ic], i) => ctx.fillText(ic, 14 + i * 26, 56));
  // chefão
  if (state.boss) {
    const b = state.boss, w = W * 0.6, x = (W - w) / 2;
    ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(x - 3, 12, w + 6, 18);
    ctx.fillStyle = b.cor; ctx.fillRect(x, 15, w * Math.max(0, b.hp / b.maxHp), 12);
    ctx.textAlign = 'center'; ctx.font = "800 14px 'Bungee', sans-serif"; ctx.fillStyle = '#fff';
    ctx.strokeText(b.nome, W / 2, 46); ctx.fillText(b.nome, W / 2, 46);
  }
  // aviso de nível / chefão
  const bn = state.banner;
  if (bn && bn.t > 0) {
    ctx.globalAlpha = Math.min(1, bn.t / 25);
    ctx.textAlign = 'center';
    ctx.font = "44px 'Bungee', sans-serif"; ctx.lineWidth = 6;
    ctx.strokeText(bn.txt, W / 2, H / 2 - 20); ctx.fillStyle = bn.cor || '#ffd42a'; ctx.fillText(bn.txt, W / 2, H / 2 - 20);
    ctx.font = "800 20px 'Baloo 2', sans-serif"; ctx.lineWidth = 4;
    ctx.strokeText(bn.sub, W / 2, H / 2 + 16); ctx.fillStyle = '#fff'; ctx.fillText(bn.sub, W / 2, H / 2 + 16);
    ctx.globalAlpha = 1;
  }
}

let tick = 0;
function loop() {
  tick++;
  update();
  render();
  if (state.mode === 'menu') {
    previewCtx.clearRect(0, 0, 220, 220);
    previewCtx.beginPath();
    previewCtx.ellipse(110, 190, 62, 14, 0, 0, Math.PI * 2);
    previewCtx.fillStyle = 'rgba(8,4,20,.55)';
    previewCtx.fill();
    const gl = previewCtx.createRadialGradient(110, 105, 6, 110, 105, 96);
    gl.addColorStop(0, (nave().arco ? `hsl(${tick * 3 % 360} 90% 60%)` : nave().cor) + (nave().arco ? '' : '55'));
    gl.addColorStop(1, 'transparent');
    previewCtx.globalAlpha = nave().arco ? 0.35 : 1;
    previewCtx.fillStyle = gl;
    previewCtx.fillRect(0, 0, 220, 220);
    previewCtx.globalAlpha = 1;
    drawShipArt(previewCtx, nave(), 110, 105, 150, tick);
  }
  requestAnimationFrame(loop);
}

makeStars();
showMenu();
loop();
</script>
